<style id="qz-style">
/* ===== Quizlet 式單字卡／學習模式（共用模組） ===== */
:root {
  --qz-good: #2f7a47; --qz-good-bg: #dcefe0;
  --qz-bad: #b3413a;  --qz-bad-bg: #f6dedb;
  --qz-mid: #a8781f;  --qz-mid-bg: #f3e6cd;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --qz-good: #8fca9d; --qz-good-bg: #1e3324; --qz-bad: #ec9a92; --qz-bad-bg: #3c1f1c; --qz-mid: #e0b768; --qz-mid-bg: #3a3018;
} }
:root[data-theme="dark"] {
  --qz-good: #8fca9d; --qz-good-bg: #1e3324; --qz-bad: #ec9a92; --qz-bad-bg: #3c1f1c; --qz-mid: #e0b768; --qz-mid-bg: #3a3018;
}
.qz-entry { margin-top: -6px; }

  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.qz-overlay[hidden] { display: none !important; }
body.qz-open { overflow: hidden; }
.qz-wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 60px; display: flex; flex-direction: column; gap: 16px; }
.qz-bar { display: flex; align-items: center; gap: 10px; min-height: 40px; }

.qz-x:hover { color: var(--accent-strong); border-color: var(--accent); }

.qz-h { font-size: 0.82rem; font-weight: 700; color: var(--ink-soft); margin: 0 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.qz-tools { display: flex; gap: 12px; }

.qz-g .qz-gn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.qz-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
.qz-dot.m { background: var(--qz-good); } .qz-dot.l { background: var(--qz-mid); } .qz-dot.n { background: var(--border); }

.qz-big i { display: block; height: 100%; transition: width 0.3s ease; }
.qz-big .m { background: var(--qz-good); } .qz-big .l { background: var(--qz-mid); } .qz-big .p { background: var(--accent); }
.qz-reset { font-size: 0.74rem; color: var(--ink-faint); background: none; border: none; text-decoration: underline; cursor: pointer; padding: 0; font-family: inherit; }
.qz-top { display: flex; align-items: center; gap: 10px; }

.qz-count { font-size: 0.8rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
.qz-btn { padding: 8px 13px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--ink-soft); cursor: pointer; font: inherit; font-size: 0.8rem; white-space: nowrap; }
.qz-btn:hover { border-color: var(--accent); color: var(--accent-strong); }
.qz-btn.undo { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-strong); }
.qz-primary { padding: 13px 16px; border-radius: 12px; border: none; background: var(--accent-strong); color: var(--surface); font: inherit; font-weight: 700; font-size: 0.95rem; cursor: pointer; }
.qz-primary:hover { background: var(--accent); }
.qz-row { display: flex; gap: 10px; flex-wrap: wrap; }
.qz-row > * { flex: 1; min-width: 140px; }
/* flashcard */
.qz-tally { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.qz-tally .s { color: var(--qz-mid); } .qz-tally .k { color: var(--qz-good); }
.qz-fc { position: relative; min-height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 28px 22px;
  border-radius: 18px; border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow); cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: pan-y; transition: transform 0.18s ease, border-color 0.18s ease; }
.qz-fc.flip { animation: qzflip 0.22s ease; }
@keyframes qzflip { from { transform: rotateX(70deg); opacity: 0.4; } to { transform: none; opacity: 1; } }
.qz-fc.go-k { border-color: var(--qz-good); } .qz-fc.go-s { border-color: var(--qz-mid); }
.qz-side { position: absolute; top: 12px; left: 16px; font-size: 0.7rem; color: var(--ink-faint); letter-spacing: 0.06em; }
.qz-term { font-family: var(--font-serif, var(--f-display, "Noto Serif TC", serif)); font-size: clamp(1.7rem, 6vw, 2.3rem); font-weight: 700; line-height: 1.2; word-break: break-word; }
.qz-kk { color: var(--accent); font-size: 0.95rem; }
.qz-zh { font-size: clamp(1.1rem, 4vw, 1.35rem); font-weight: 700; line-height: 1.5; }
.qz-pos { display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-strong); margin-right: 6px; vertical-align: 2px; }
.qz-ex { font-style: italic; color: var(--ink-soft); font-size: 0.98rem; line-height: 1.6; max-width: 54ch; }
.qz-ex b { font-style: normal; color: var(--accent-strong); }
.qz-exzh { font-size: 0.84rem; color: var(--ink-faint); }
.qz-note { font-size: 0.8rem; color: var(--ink-faint); max-width: 54ch; }
.qz-hint { font-size: 0.74rem; color: var(--ink-faint); }
.qz-say { border: none; background: none; color: var(--accent); cursor: pointer; font-size: 1rem; padding: 2px 6px; border-radius: 6px; }
.qz-say:hover { background: var(--accent-soft); }
.qz-sort { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.qz-sort button { padding: 14px; border-radius: 14px; font: inherit; font-weight: 700; font-size: 0.95rem; cursor: pointer; border: 2px solid; background: var(--surface); }
.qz-sort .s { border-color: var(--qz-mid); color: var(--qz-mid); } .qz-sort .s:hover { background: var(--qz-mid-bg); }
.qz-sort .k { border-color: var(--qz-good); color: var(--qz-good); } .qz-sort .k:hover { background: var(--qz-good-bg); }
.qz-keys { text-align: center; font-size: 0.72rem; color: var(--ink-faint); }
/* learn */
.qz-q { display: flex; flex-direction: column; gap: 10px; }
.qz-qlabel { font-size: 0.74rem; color: var(--ink-faint); font-weight: 700; letter-spacing: 0.04em; }
.qz-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.qz-choice { text-align: left; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); color: var(--ink); font: inherit; font-size: 0.98rem; cursor: pointer; display: flex; gap: 10px; align-items: baseline; min-width: 0; word-break: break-word; }
.qz-choice:hover:not(:disabled) { border-color: var(--accent); }
.qz-choice .n { font-size: 0.72rem; color: var(--ink-faint); font-weight: 700; flex-shrink: 0; }
.qz-choice.ok { border-color: var(--qz-good); background: var(--qz-good-bg); color: var(--qz-good); font-weight: 700; }
.qz-choice.no { border-color: var(--qz-bad); background: var(--qz-bad-bg); color: var(--qz-bad); }
.qz-choice:disabled { cursor: default; }
.qz-write { display: flex; gap: 8px; }
.qz-write input { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--ink); font: inherit; font-size: 1.05rem; }
.qz-write input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.qz-write input.ok { border-color: var(--qz-good); background: var(--qz-good-bg); }
.qz-write input.no { border-color: var(--qz-bad); background: var(--qz-bad-bg); }
.qz-write button { padding: 0 18px; border-radius: 10px; border: none; background: var(--accent-strong); color: var(--surface); font: inherit; font-weight: 700; cursor: pointer; }
.qz-fb { border-radius: 12px; padding: 12px 14px; font-size: 0.9rem; display: flex; flex-direction: column; gap: 6px; }
.qz-fb.ok { background: var(--qz-good-bg); color: var(--qz-good); }
.qz-fb.no { background: var(--qz-bad-bg); color: var(--qz-bad); }
.qz-fb .ans { font-size: 1.15rem; font-weight: 700; color: var(--ink); }
.qz-fb .qz-ex, .qz-fb .qz-exzh, .qz-fb .qz-note { max-width: none; }
.qz-sub { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: flex-end; }
.qz-hintline { font-family: var(--font-serif, serif); letter-spacing: 2px; color: var(--accent-strong); font-size: 1.05rem; }
.qz-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.qz-list li { display: flex; gap: 10px; align-items: baseline; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); font-size: 0.86rem; color: var(--ink-soft); }
.qz-list li b { color: var(--ink); }
.qz-list li .r { margin-left: auto; font-size: 0.74rem; white-space: nowrap; }
.qz-list li .r.m { color: var(--qz-good); } .qz-list li .r.l { color: var(--qz-mid); }
.qz-done { text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; padding: 24px 10px; }
.qz-done .big { font-size: 2.4rem; }
@media (max-width: 520px) {
  .qz-modes, .qz-choices { grid-template-columns: 1fr; }
  .qz-write { flex-direction: column; }
  .qz-write button { padding: 12px; }
}
/* ---------- 答對回饋 ---------- */
.fc-pop { position: fixed; left: 50%; top: 18%; z-index: 2147483000; pointer-events: none; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.fc-pop .fc-ring { width: 76px; height: 76px; border-radius: 50%; background: var(--qz-good); color: var(--surface, #fff); display: grid; place-items: center; box-shadow: 0 10px 30px -8px rgba(0,0,0,.35), 0 0 0 8px var(--qz-good-bg); animation: fcIn .42s cubic-bezier(.2,1.6,.4,1) both; }
.fc-pop .fc-ring svg { width: 42px; height: 42px; stroke: currentColor; stroke-width: 3.4; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; animation: fcDraw .32s .12s ease-out forwards; }
.fc-pop .fc-txt { font-weight: 800; font-size: 1.05rem; color: var(--qz-good); background: var(--surface, #fff); border: 1px solid var(--qz-good); padding: 4px 14px; border-radius: 999px; box-shadow: 0 6px 18px -8px rgba(0,0,0,.3); white-space: nowrap; animation: fcUp .35s .08s ease-out both; }
.fc-pop .fc-txt small { font-weight: 700; color: var(--qz-mid); margin-left: 6px; font-size: 0.85rem; }
.fc-pop.out { animation: fcOut .3s ease-in forwards; }
.fc-pop i { position: absolute; left: 50%; top: 38px; width: 8px; height: 8px; border-radius: 2px; animation: fcBurst .9s ease-out forwards; }
.fc-hit { animation: fcPulse .55s ease-out; position: relative; z-index: 1; }
@keyframes fcIn { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes fcDraw { to { stroke-dashoffset: 0; } }
@keyframes fcUp { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fcOut { to { opacity: 0; transform: translateX(-50%) translateY(-14px); } }
@keyframes fcBurst { from { transform: translate(-50%, -50%) rotate(0); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--r)); opacity: 0; } }
@keyframes fcPulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 var(--qz-good); } 35% { transform: scale(1.04); } 100% { transform: scale(1); box-shadow: 0 0 0 14px transparent; } }
@media (prefers-reduced-motion: reduce) { .fc-pop .fc-ring, .fc-pop .fc-txt, .fc-hit, .fc-pop i { animation: none; } .fc-pop .fc-ring svg { animation: none; stroke-dashoffset: 0; } }
/* ---------- 答錯時：選錯的那個字的完整釋義 ---------- */
.wd-box { margin-top: 10px; text-align: left; border-left: 3px solid var(--qz-bad); background: var(--qz-bad-bg); border-radius: 8px; padding: 10px 12px; font-size: 0.88rem; line-height: 1.55; color: var(--ink-soft); display: grid; gap: 2px; font-style: normal; font-weight: 400; }
.wd-box .wd-h { font-size: 0.76rem; color: var(--qz-bad); font-weight: 700; }
.wd-box .wd-w { font-weight: 700; color: var(--ink); font-size: 1rem; margin-right: 6px; }
.wd-box .wd-pos { display: inline-block; font-size: 0.7rem; font-weight: 700; padding: 0 7px; border-radius: 999px; border: 1px solid var(--qz-bad); color: var(--qz-bad); margin-right: 6px; vertical-align: 1px; }
.wd-box .wd-kk { color: var(--ink-faint); font-size: 0.8rem; margin-left: 4px; }
.wd-box .wd-zh { color: var(--ink); }
.wd-box .wd-ex { font-style: italic; color: var(--ink-soft); }
.wd-box .wd-ex b { color: var(--ink); }
.wd-box .wd-exzh, .wd-box .wd-note { color: var(--ink-faint); font-size: 0.8rem; }
.qz-fb .wd-box { background: var(--surface); }
.wd-box .wd-sense + .wd-sense { border-top: 1px dashed var(--qz-bad); padding-top: 6px; margin-top: 4px; }
@media (prefers-reduced-motion: reduce) { .qz-fc, .qz-fc.flip, .qz-big i { animation: none; transition: none; } }
</style>
<div class="qz-overlay" id="qzRoot" hidden></div>
<script>
(function () {
  /* ---------- 答錯時：把你選的那個字的完整釋義列出來（三種測驗與 Quizlet 式共用） ---------- */
  // senses: [{ pos, kk, zh, ex(可含 <b> 的 HTML), exZh, note }]
  if (!window.wrongDefHTML) window.wrongDefHTML = function (word, senses, label) {
    const e = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    if (!senses || !senses.length) return '';
    return `<div class="wd-box"><div class="wd-h">${e(label || '你選的')}「${e(word)}」是：</div>${senses.slice(0, 3).map(x =>
      `<div class="wd-sense"><div>${x.pos ? `<span class="wd-pos">${e(x.pos)}</span>` : ''}<span class="wd-zh">${e(x.zh)}</span>${x.kk ? `<span class="wd-kk">${e(x.kk)}</span>` : ''}</div>${x.ex ? `<div class="wd-ex">${x.ex}</div>` : ''}${x.exZh ? `<div class="wd-exzh">${e(x.exZh)}</div>` : ''}${x.note ? `<div class="wd-note">${e(x.note)}</div>` : ''}</div>`).join('')}</div>`;
  };
  /* ---------- 答對回饋：打勾動畫＋提示音＋連對計數（三種測驗與 Quizlet 式共用） ---------- */
  if (!window.famCheer) window.famCheer = (function () {
    let streak = 0, pop = null, timer = 0, ac = null;
    const PRAISE = ['答對了！', '漂亮！', '正確！', 'Nice!', '好棒！', '沒錯！'];
    // 馬林巴木琴：用程式合成，走 Web Audio 當「網站音效」播放——不會中斷 Spotify 等正在播的音樂
    const SR = 44100;
    function marimba(notes, len) {   // notes: [[頻率, 起始秒, 音量]] → Float32Array
      const n = Math.floor(SR * len), buf = new Float32Array(n);
      const PART = [[1, 1, 16], [3.93, 0.3, 45], [9.2, 0.06, 90]];   // [倍頻, 音量, 衰減]：短促的木頭聲
      notes.forEach(([f, t0, amp]) => {
        const s0 = Math.floor(t0 * SR);
        for (let k = s0; k < n; k++) {
          const t = (k - s0) / SR, att = Math.min(1, t / 0.0012);
          let v = 0; for (const [m, a, d] of PART) if (f * m < SR * 0.45) v += a * Math.exp(-d * t) * Math.sin(2 * Math.PI * f * m * t);
          if (t < 0.006) v += 0.1 * (Math.random() * 2 - 1) * Math.exp(-t * 900);   // 琴槌敲下去的「咯」
          buf[k] += amp * att * v;
        }
      });
      let peak = 0; for (let k = 0; k < n; k++) peak = Math.max(peak, Math.abs(buf[k]));
      for (let k = 0; k < n; k++) buf[k] = buf[k] / peak * 0.95;
      return buf;
    }
    const PCM = {
      ok: () => marimba([[1046.5, 0, 1], [1396.9, 0.075, 1]], 0.32),                                                                 // C6 → F6
      win: () => marimba([[1046.5, 0, 0.8], [1396.9, 0.065, 0.85], [1760, 0.13, 0.9], [2093, 0.195, 1], [2093, 0.3, 0.75], [1046.5, 0.3, 0.6]], 0.6)   // C6 F6 A6 C7 → C7＋C6
    };
    let SND = null;
    function ctx() {
      try { if (navigator.audioSession) navigator.audioSession.type = 'ambient'; } catch (e) {}   // iOS 17+：當音效、跟背景音樂混音
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state !== 'running') ac.resume();
      if (!SND) {
        SND = {};
        for (const k in PCM) { const d = PCM[k](), b = ac.createBuffer(1, d.length, SR); b.getChannelData(0).set(d); SND[k] = b; }
      }
      return ac;
    }
    function tone(milestone) {
      try {
        const a = ctx(), src = a.createBufferSource(), g = a.createGain();
        src.buffer = SND[milestone ? 'win' : 'ok']; g.gain.value = 0.9;
        src.connect(g).connect(a.destination); src.start(a.currentTime + 0.01);
      } catch (e) {}
    }
    // 第一次點畫面時先把音效準備好（iPhone 要在手指點擊時啟動聲音），之後第一聲才不會被吞掉
    const warm = () => { try { const a = ctx(), b = a.createBuffer(1, 1, 22050), s = a.createBufferSource(); s.buffer = b; s.connect(a.destination); s.start(0); } catch (e) {} };
    ['touchend', 'pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, function once() { document.removeEventListener(ev, once, true); warm(); }, true));
    function hit(target) {
      streak++;
      const milestone = streak >= 5 && streak % 5 === 0;

    if (!first) L.qDone++;
    if (!L.queue.length) { if (L.phase === 'mc') return startPhase('write'); return renderRoundEnd(); }
    L.cur = L.queue.shift(); L.state = 'ask'; L.hint = 0; L.choice = null; L.typed = ''; L.given = '';
    const it = BY.get(L.cur);
    L.kind = L.phase === 'mc' ? 'mc' : 'write';
    if (L.kind === 'mc') L.opts = buildChoices(it);
    renderLearn();
  }
  // 中文意思重疊檢查：兩個字的中文解釋只要有相同的兩字詞（例如「水槽」「很棒」），就不放在同一題當選項
  const zhBigrams = z => { const out = new Set(); String(z || '').replace(/（[^）]*）|\([^)]*\)/g, '').replace(/[的地得了一個某些著]/g, '').split(/[；、，,／\/\s;=]+/).forEach(seg => { const c = seg.replace(/[^一-鿿]/g, ''); for (let i = 0; i + 1 < c.length; i++) out.add(c.slice(i, i + 2)); if (c.length === 1) out.add(c); }); return out; };
  const zhOverlap = (a, b) => { const A = zhBigrams(a); for (const x of zhBigrams(b)) if (A.has(x)) return true; return false; };
  function buildChoices(it) {
    const key = norm(it.term), seen = new Set([key]);
    const pk = (it.pos || '').replace(/[^a-z]/gi, '').slice(0, 1).toLowerCase();
    const cands = shuffle(A.items.filter(x => !seen.has(norm(x.term))));
    const pref = cands.filter(x => (x.pos || '').replace(/[^a-z]/gi, '').slice(0, 1).toLowerCase() === pk && String(x.g) === String(it.g));
    const pref2 = cands.filter(x => (x.pos || '').replace(/[^a-z]/gi, '').slice(0, 1).toLowerCase() === pk);
    const out = [];
    const zs = [it.zh], ft = t => norm(t).split(' ')[0];
    for (const x of pref.concat(pref2, cands)) {
      const k = norm(x.term); if (seen.has(k)) continue;
      // 不放意思重疊（例如兩個都是「追捕」）或長得像（pursue／pursuit）的選項，免得答對卻被判錯
      if (zs.some(z => zhOverlap(z, x.zh))) continue;
      if ([it.term].concat(out).some(t => ft(t) === ft(x.term) || (ft(t).length >= 5 && ft(x.term).length >= 5 && ft(t).slice(0, 5) === ft(x.term).slice(0, 5)))) continue;
      seen.add(k); out.push(x.term); zs.push(x.zh); if (out.length === 3) break;
    }
    if (out.length < 3) for (const x of cands) { const k = norm(x.term); if (seen.has(k)) continue; seen.add(k); out.push(x.term); if (out.length === 3) break; }
    return shuffle(out.concat([it.term]));
  }
  function setLvl(id, v) { st.m[id] = v; st.mt = st.mt || {}; st.mt[id] = Date.now(); save(); }
  // 每次學習模式的作答都記下來，讓原本測驗模式的熟悉度也跟著調整：選擇題答對 +0.5、拼字答對 +0.8、答錯記 -1（各字最多留 12 筆）
  function learnEvent(id, credit) {
    st.ev = st.ev || {}; const a = st.ev[id] = st.ev[id] || [];
    a.push([Date.now(), credit]); if (a.length > 12) a.splice(0, a.length - 12); save();
  }
  function overall() { return counts(poolItems()); }
  function renderLearn() {
    const it = BY.get(L.cur);
    const phaseName = L.phase === 'mc' ? '第 1 階段・選擇題' : '第 2 階段・拼寫';
    const c = overall();
    let body = '';
    if (L.kind === 'mc') {
      body = `<div class="qz-qlabel">選出正確的英文</div>
        <div class="qz-choices">${L.opts.map((o, k) => {
          let cls = '';
          if (L.state !== 'ask') { if (norm(o) === norm(it.term)) cls = ' ok'; else if (k === L.choice) cls = ' no'; }
          return `<button type="button" class="qz-choice${cls}" data-k="${k}" ${L.state !== 'ask' ? 'disabled' : ''}><span class="n">${k + 1}</span><span>${esc(o)}</span></button>`;
        }).join('')}</div>`;
    } else {
      const hintLine = L.hint ? `<div class="qz-hintline">${esc(it.term.split('').map((ch, i) => (i < L.hint || ch === ' ') ? ch : '_').join(' '))}</div>` : '';
      body = `<div class="qz-qlabel">${L.state === 'retype' ? '把正確答案打一次' : '用英文打出答案'}</div>${hintLine}
        <form class="qz-write" id="qzForm" autocomplete="off"><input id="qzIn" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${L.state === 'retype' ? esc(it.term) : '輸入英文'}" aria-label="輸入英文答案" ${L.state === 'ok' || L.state === 'no' ? 'readonly' : ''} value="${esc(L.typed)}"><button type="submit">${L.state === 'ask' || L.state === 'retype' ? '送出' : '繼續'}</button></form>
        ${L.state === 'ask' ? `<div class="qz-sub"><button class="qz-link" type="button" id="qzHint">提示字母</button><button class="qz-link" type="button" id="qzIdk">不知道</button></div>` : ''}`;
    }
    let fb = '';
    if (L.state === 'ok') fb = `<div class="qz-fb ok"><b>答對了！</b>${answerHTML(it).replace('qz-term', 'ans')}${exFullHTML(it)}</div>`;
    if (L.state === 'no' || L.state === 'retype') fb = `<div class="qz-fb no"><b>${L.kind === 'mc' ? '再想想，正確答案是' : (L.given ? '不太對，正確答案是' : '正確答案是')}</b><div class="ans">${esc(it.term)} ${sayBtn(it.term)}</div>${it.kk ? `<div class="qz-kk">${esc(it.kk)}</div>` : ''}${exFullHTML(it)}${it.note ? `<div class="qz-note">${esc(it.note)}</div>` : ''}${L.kind === 'write' && L.given ? `<div class="qz-hint">你的答案：${esc(L.given)}</div>` : ''}${wrongDef(it)}</div>`;
    let actions = '';
    if (L.state === 'ok' || L.state === 'no') actions = `<div class="qz-sub"><button class="qz-primary" type="button" id="qzNext" style="flex:0;min-width:120px">繼續</button></div>`;
    if (L.state === 'retype' && L.given) actions = `<div class="qz-sub"><button class="qz-btn" type="button" id="qzOverride">我其實答對了</button></div>`;
    root.innerHTML = `<div class="qz-wrap">${header('學習', true)}
      <div class="qz-top"><span class="qz-count">${phaseName}　${Math.min(L.qDone + 1, L.qTotal)} / ${L.qTotal}</span><div class="qz-big"><i class="p" style="width:${(L.qDone / Math.max(1, L.qTotal) * 100).toFixed(1)}%"></i></div></div>
      <div class="qz-card qz-q">
        <div class="qz-hint">${L.kind === 'mc' ? '四選一' : '拼寫'}・${esc(groupName(it.g))}</div>
        ${promptHTML(it)}
        ${body}
        ${fb}
        ${actions}
      </div>
      <div class="qz-stat"><span><i class="qz-dot m"></i>已掌握 ${c.m}</span><span><i class="qz-dot l"></i>學習中 ${c.l}</span><span><i class="qz-dot n"></i>未學 ${c.n}</span></div>
      <p class="qz-keys">${L.kind === 'mc' ? '可按 1–4 作答，Enter 或「繼續」下一題' : 'Enter 送出／繼續'}</p>
    </div>`;
    wireHeader();
    if (L.kind === 'mc' && L.state === 'ask') root.querySelectorAll('[data-k]').forEach(b => b.onclick = () => answerMC(+b.dataset.k));
    const f = $('#qzForm');
    if (f) {
      const inp = $('#qzIn');
      f.onsubmit = e => { e.preventDefault(); if (L.state === 'ask') answerWrite(inp.value); else if (L.state === 'retype') retype(inp.value); else nextQ(); };
      if (L.state === 'ask' || L.state === 'retype') { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
      const h = $('#qzHint'); if (h) h.onclick = () => { L.hint = Math.min(L.hint + 1, it.term.length - 1); L.typed = $('#qzIn').value; renderLearn(); };
      const k = $('#qzIdk'); if (k) k.onclick = () => answerWrite('');
    }
    const n = $('#qzNext'); if (n) { n.onclick = () => nextQ(); if (!f || L.state !== 'retype') n.focus(); }
    const o = $('#qzOverride'); if (o) o.onclick = () => { const e = st.ev && st.ev[L.cur]; if (e && e.length && e[e.length - 1][1] < 0) e.pop(); setLvl(L.cur, 2); learnEvent(L.cur, 0.8); nextQ(); };
  }
  function answerMC(k) {
    const it = BY.get(L.cur);
    L.choice = k;
    if (norm(L.opts[k]) === norm(it.term)) {
      L.state = 'ok'; setLvl(it.id, Math.max(lvl(it.id), 1)); learnEvent(it.id, 0.5);
      renderLearn(); famCheer.hit(root.querySelector('.qz-choice.ok')); setTimeout(() => say(it.term), 700);
    } else {
      L.state = 'no'; learnEvent(it.id, -1); renderLearn(); famCheer.miss();
    }
  }
  function answerWrite(v) {
    const it = BY.get(L.cur);
    L.typed = v.trim();
    if (L.typed && isRight(it, L.typed)) {
      L.state = 'ok'; setLvl(it.id, 2); learnEvent(it.id, 0.8); renderLearn(); famCheer.hit(root.querySelector('#qzIn')); setTimeout(() => say(it.term), 700);
    } else {
      famCheer.miss(); learnEvent(it.id, -1); L.state = 'retype'; L.given = L.typed; L.typed = ''; renderLearn();
    }
  }
  function retype(v) {
    const it = BY.get(L.cur);
    if (isRight(it, v)) nextQ();
    else { const inp = $('#qzIn'); inp.classList.add('no'); inp.value = ''; inp.placeholder = it.term; inp.focus(); }
  }
  function renderRoundEnd() {
    st.carry = L.items.filter(id => lvl(id) < 2); save();
    const c = overall();
    const rows = L.items.map(id => { const it = BY.get(id), v = lvl(id); return `<li><b>${esc(it.term)}</b><span>${esc(it.zh)}</span><span class="r ${v >= 2 ? 'm' : 'l'}">${v >= 2 ? '已掌握' : v === 1 ? '下回合考拼寫' : '下回合考選擇題'}</span></li>`; }).join('');
    const left = c.t - c.m;
    root.innerHTML = `<div class="qz-wrap">${header('學習', true)}
      <div class="qz-card qz-done"><div class="big">💪</div><b>這回合結束</b><span class="qz-hint">整個範圍：已掌握 ${c.m} / ${c.t}</span>${bar(c, ' style="width:100%"')}</div>
      <div class="qz-card"><p class="qz-h"><span>這回合的字</span></p><ul class="qz-list">${rows}</ul></div>
      <div class="qz-row">${left ? '<button class="qz-primary" type="button" id="qzGo">下一回合</button>' : ''}<button class="qz-btn" type="button" id="qzFc">用單字卡複習</button></div>
    </div>`;
    wireHeader();
    const g = $('#qzGo'); if (g) { g.onclick = startLearn; g.focus(); } else renderLearnDone();
    $('#qzFc').onclick = () => startFlash(shuffle(L.items));
  }
  function renderLearnDone() {
    const pool = poolItems();
    root.innerHTML = `<div class="qz-wrap">${header('學習', true)}
      <div class="qz-card qz-done"><div class="big">🎉</div><b>這個範圍的 ${pool.length} 個字全部掌握了</b><span class="qz-hint">可以換別的範圍，或重新學一次加深印象</span></div>
      <div class="qz-row"><button class="qz-primary" type="button" id="qzAgain">重新學一次</button><button class="qz-btn" type="button" id="qzHome">換範圍</button></div>
    </div>`;
    wireHeader();
    $('#qzAgain').onclick = () => { pool.forEach(it => delete st.m[it.id]); save(); startLearn(); };
    $('#qzHome').onclick = renderHome;
  }

  /* ---------- keyboard ---------- */
  document.addEventListener('keydown', e => {
    if (root.hidden) return;
    if (e.key === 'Escape') { close(); return; }
    const typing = e.target && e.target.tagName === 'INPUT';
    if (mode === 'flash' && F && F.i < F.deck.length && !typing) {
      if (e.key === ' ') { e.preventDefault(); F.flipped = !F.flipped; renderFlash(); }
      else if (e.key === 'ArrowRight') flashSort(true);
      else if (e.key === 'ArrowLeft') flashSort(false);
    } else if (mode === 'learn' && L && !typing) {
      if (L.kind === 'mc' && L.state === 'ask' && /^[1-4]$/.test(e.key)) answerMC(+e.key - 1);
      else if ((L.state === 'ok' || L.state === 'no') && e.key === 'Enter') { e.preventDefault(); nextQ(); }
    }
  });

  /* ---------- entry button ---------- */
  const anchor = document.querySelector(A.anchor || '.study-toggle-btn');
  if (anchor) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = (anchor.className || '').replace(/\bactive\b/, '') + ' qz-entry'; b.id = 'qzOpen';
    b.innerHTML = '<span>單字卡／學習</span><span class="qz-entry-sub">（Quizlet 式）</span>';
    b.onclick = open;
    anchor.insertAdjacentElement('afterend', b);
  }
  window.QZ = { open, maskZh, items: A.items, dbg: () => ({ L, F, st, BY }) };   // dbg：自動測試用（唯讀）
})();
</script>
