 a consensus on + N（議論文常用於描述多方討論後的結果）／a general consensus（普遍共識）", "經過數小時的辯論，委員會終於對新政策達成共識。"], ["be prone to", "prone /pron/", "phrase", "容易……的；有……傾向的", "Teenagers who lack sufficient sleep are prone to mood swings and poor concentration.", "be prone to + N/Ving（常用於描述某群體『容易發生某種負面狀況』，議論文中用於建立因果或歸納論點，與 be susceptible to 相近但更口語通用）", "睡眠不足的青少年容易情緒起伏不定、難以專注。"], ["grapple with", "grapple /ˋgræpl/", "phrasal verb", "努力解決；設法應付（棘手的問題）", "Many developing countries are still grappling with poverty and pollution.", "grapple with + problem/issue/challenge/question（本義「扭打、搏鬥」，強調費力地處理難題；比 deal with 更生動、比 cope with 更強調掙扎，議論文描述社會問題很好用）", "許多開發中國家仍在努力對抗貧窮與污染問題。"], ["walk the talk", "—", "phrase", "說到做到；言行一致", "Leaders who ask citizens to save energy must walk the talk themselves.", "walk the talk（= practice what you preach；反面是 all talk and no action 光說不練；議論文要求政府、領導人以身作則時很好用）", "要求民眾節能的領導人，自己必須說到做到。"], ["provided (that)", "/prəˋvaɪdɪd/", "conj.", "只要；在…的前提下（提出配套條件）", "Raising the minimum wage can benefit workers, provided that supporting measures are in place for small businesses.", "…, provided (that) + S + V（= as long as／on condition that，比 if 正式；議論文先肯定政策、再補上『配套措施』當前提時很好用）", "只要有針對小型企業的配套措施，調漲基本工資就能讓勞工受惠。"], ["overreliance (on)", "/ˌovɚrɪˋlaɪəns/", "n.", "過度依賴", "Overreliance on smartphones may weaken students' ability to concentrate.", "overreliance on + N（議論文批評過度依賴科技、補習、進口能源時的好用主詞；形容詞 overreliant on／動詞 over-rely on）", "過度依賴智慧型手機可能削弱學生的專注力。"], ["align with", "/əˋlaɪn/", "phrase", "與…一致、符合；配合", "The new policy aligns with the government's goal of cutting carbon emissions.", "A align(s) with B（A 與 B 一致）／align A with B（使 A 配合 B）／be aligned with + N；議論文說政策、課程「符合」某目標時比 match 更正式", "這項新政策符合政府減碳的目標。"]]}, {"name": "18. Health & Emergency Phrases（醫療與緊急狀況片語）", "rows": [["fall ill", "—", "phrase", "患病", "He fell ill just days before the competition.", "fall ill with + 疾病（比 get sick 稍正式）", "比賽前幾天他生病了。"], ["come down with", "—", "phrasal verb", "染上；患上（較輕微疾病）", "He came down with a bad cold over the weekend.", "come down with + a cold/flu/fever（比 get sick 正式一些，但仍算口語，常接輕症）", "週末他得了重感冒。"], ["be afflicted with", "afflicted /əˋflɪktɪd/", "phrase", "罹患；受……所苦", "The region was afflicted with severe drought.", "be afflicted with + 疾病/災難（正式書面用語，也可用於疾病以外的苦難）", "這個地區飽受嚴重乾旱之苦。"], ["seek medical attention", "seek /sik/", "phrase", "尋求醫療協助", "If symptoms persist, one should seek medical attention immediately.", "seek medical attention/advice/treatment（比 see a doctor 正式）", "如果症狀持續，應立即就醫。"], ["consult a physician", "physician /fəˋzɪʃən/", "phrase", "就診；請教醫師", "It is advisable to consult a physician before taking any medication.", "consult a physician/specialist（physician 比 doctor 正式）", "服用任何藥物前，最好先諮詢醫師。"], ["be hospitalized", "hospitalized /ˋhɑspɪtəlaɪzd/", "phrase", "住院", "He was hospitalized for a week due to pneumonia.", "be hospitalized for/with + 疾病", "他因肺炎住院一週。"], ["undergo treatment", "undergo /ʌndɚˋgo/", "phrase", "接受治療（亦可說 undergo surgery/an operation）", "She had to undergo surgery after the accident.", "undergo treatment/surgery/an operation", "事故後她必須接受手術。"], ["alert the authorities", "authorities /əˋθɔrətɪz/", "phrase", "通知當局；報警", "Witnesses immediately alerted the authorities after the incident.", "alert the authorities/the police（比 call the police 正式）", "事件發生後，目擊者立即通報了有關當局。"], ["report the incident to the police", "incident /ˋɪnsədənt/", "phrase", "向警方報案", "She reported the incident to the police right away.", "report + 事件 + to the police/authorities", "她立刻向警方報案。"], ["summon emergency assistance", "summon /ˋsʌmən/", "phrase", "呼叫緊急救援", "Bystanders quickly summoned emergency assistance for the injured man.", "summon + help/assistance/emergency services（summon 比 call 正式、書面）", "旁觀者迅速為受傷的男子叫來緊急救援。"], ["law enforcement officers", "enforcement /ɪnˋfɔrsmənt/", "n. phrase", "執法人員（警察的正式說法）", "Law enforcement officers arrived at the scene within minutes.", "law enforcement officers/agencies（比 police 正式，常用於新聞或議論文）", "執法人員在幾分鐘內就抵達現場。"], ["dial the emergency hotline", "emergency /ɪˋmɝdʒənsɪ/", "phrase", "撥打緊急專線", "In case of fire, one should dial the emergency hotline immediately.", "在台灣：110（報警）／119（消防、救護）；作文中可泛稱 dial the emergency hotline", "萬一發生火災，應立即撥打緊急求助電話。"]]}, {"name": "19. Everyday Life Phrases（日常生活情境片語）", "rows": [["mess up", "—", "phrasal verb", "搞砸；出差錯", "He messed up the final presentation due to nerves.", "mess up + N／mess things up（口語但很常用；較正式可換成 botch/bungle）", "他因為緊張把期末報告搞砸了。"], ["in a catastrophic mess", "catastrophic /kætəˋstrɑfɪk/", "phrase", "陷入極度混亂；一團糟", "After the storm, the entire city was left in a catastrophic mess.", "leave sth in a mess → a complete mess → a catastrophic mess（混亂程度依序遞增）", "暴風雨過後，整座城市一片狼藉。"], ["at a crossroads", "crossroads /ˋkrɔsrodz/", "phrase", "面臨抉擇；站在人生的十字路口", "After graduation, she found herself at a crossroads, unsure which career path to choose.", "be/stand at a crossroads（常用於人生重大抉擇的情境）", "畢業後，她發現自己站在十字路口，不確定該選擇哪條職涯道路。"], ["weigh the pros and cons", "weigh /we/", "phrase", "權衡利弊", "Before making a decision, it is wise to weigh the pros and cons.", "weigh the pros and cons of + N/Ving", "做決定之前，權衡利弊是明智的。"], ["make a snap decision", "snap /snæp/", "phrase", "倉促做決定", "He regretted making a snap decision without consulting his family.", "make a snap decision／a snap judgment（強調『未經思考』）", "他後悔沒和家人商量就草率做了決定。"], ["patch things up", "patch /pætʃ/", "phrase", "和好；修補關係", "The two friends finally patched things up after months of silence.", "patch things up with + 人（常用於『和好』的情境）", "沉默了好幾個月後，這兩個朋友終於和好了。"], ["drift apart", "drift /drɪft/", "phrase", "（感情、友情）漸行漸遠", "The two of them gradually drifted apart after moving to different cities.", "drift apart from + 人（強調『非刻意、逐漸』疏遠）", "搬到不同城市後，他們兩人漸漸疏遠了。"], ["see eye to eye", "—", "phrase", "意見一致", "The siblings rarely see eye to eye on financial matters.", "see eye to eye on/with + N（常用否定句：don't see eye to eye）", "這對兄弟姊妹在金錢問題上很少意見一致。"], ["rack one's brains", "rack /ræk/", "phrase", "絞盡腦汁", "She racked her brains trying to solve the math problem.", "rack one's brains for/over + N", "她絞盡腦汁想解出那道數學題。"], ["race against time", "—", "phrase", "與時間賽跑", "Rescuers raced against time to save the trapped miners.", "race against time to V（強調『時間緊迫』）", "救援人員與時間賽跑，搶救受困的礦工。"], ["against all odds", "odds /ɑdz/", "phrase", "克服萬難；不畏艱難", "Against all odds, the team won the championship.", "Against all odds, + S + V（句首，常用於逆轉勝的情境）", "在極為不利的情況下，這支隊伍贏得了冠軍。"], ["a blessing in disguise", "disguise /dɪsˋgaɪz/", "phrase", "因禍得福；塞翁失馬", "Losing that job turned out to be a blessing in disguise.", "turn out to be a blessing in disguise", "失去那份工作結果反而是因禍得福。"], ["learn something the hard way", "—", "phrase", "從慘痛經驗中學到教訓", "He learned the importance of saving money the hard way.", "learn + N + the hard way（常用於結論段，帶出『領悟』）", "他吃了苦頭才學到存錢的重要。"], ["tuition fee", "tuition /tjuˋɪʃən/", "n. phrase", "學費", "Many students take up part-time jobs to help cover their tuition fees.", "pay/cover/afford tuition fees（也可單用 tuition 表示學費，如 tuition assistance／此條為實用詞彙而非慣用語，先併入本類方便查找）", "許多學生打工來幫忙支付學費。"], ["make both ends meet", "—", "phrase", "收支平衡；勉強維持生計", "After losing his job, he had to work two part-time jobs to make both ends meet.", "make (both) ends meet（常和 struggle to／barely 連用；描寫經濟困境、物價上漲、低薪議題很好用）", "失業後，他得兼兩份差才能勉強維持生計。"]]}, {"name": "20. Transition Phrases（轉承片語）", "rows": [["as a result", "—", "phrase", "因此；結果", "He skipped every class; as a result, he failed the course.", "as a result of + N（介系詞用法）／..., as a result, + S + V", "他每堂課都翹，結果這門課被當了。"], ["on the other hand", "—", "phrase", "另一方面", "On the other hand, some argue that technology isolates people.", "On the one hand..., on the other hand...（常成對使用以呈現對比觀點）", "另一方面，有些人主張科技使人們孤立。"], ["in other words", "—", "phrase", "換句話說", "He wasn't invited; in other words, he was excluded on purpose.", "..., in other words, ...（用於重新詮釋前句，幫助讀者理解）", "他沒有被邀請；換句話說，他是被刻意排擠的。"], ["for instance", "instance /ˋɪnstəns/", "phrase", "舉例來說", "Many hobbies can relieve stress; reading, for instance, is both calming and enriching.", "..., for instance, ...（與 for example 同義，可交替使用避免重複）", "許多嗜好都能紓解壓力，例如閱讀，既能讓人平靜又能充實自己。"], ["that said", "—", "phrase", "話雖如此", "The plan has risks; that said, it is still worth trying.", "That said, + S + V（句首讓步轉折，語氣比 however 稍委婉）", "這個計畫有風險；話雖如此，仍然值得一試。"], ["all in all", "—", "phrase", "總而言之", "All in all, the trip was a memorable experience despite the rain.", "All in all, + S + V（常用於結論段，總結整體評價）", "總而言之，儘管下雨，這趟旅行仍是一次難忘的經驗。"], ["needless to say", "—", "phrase", "不用說；不言而喻", "Needless to say, hard work is the key to success.", "Needless to say, + S + V（強調『顯而易見』的道理，常用於破題或呼應主題句）", "不用說，努力是成功的關鍵。"], ["in a nutshell", "nutshell /ˋnʌtʃɛl/", "phrase", "簡而言之", "In a nutshell, the project failed due to poor planning.", "In a nutshell, + S + V（比 in short 更生動口語化，但仍適用於一般寫作）", "簡而言之，這個專案因規劃不周而失敗。"], ["by the same token", "token /ˋtokən/", "phrase", "同樣地；基於同樣的道理", "She respects her teachers; by the same token, she expects respect from her students.", "By the same token, + S + V（比 similarly 更強調『邏輯上同理』）", "她尊敬她的老師；同樣地，她也期待學生尊重她。"], ["on top of that", "—", "phrase", "除此之外（更進一步，語氣較強）", "He lost his job; on top of that, his car broke down the same week.", "On top of that, + S + V（比 moreover 更口語，強調『雪上加霜』式的累加）", "他丟了工作；更糟的是，同一週他的車也壞了。"], ["judge from", "—", "phrase", "從……判斷；依據……推斷", "Judging from his tone, he was clearly upset about the decision.", "Judging from + N, S + V（句首推斷句型，實際使用時多為 Judging from，等同 based on/according to）", "從他的語氣判斷，他顯然對這個決定很不高興。"], ["from then on", "—", "phrase", "從那時起；從此以後", "He failed the exam once during his first year; from then on, he studied harder than anyone else in class.", "From then on, + S + V（常用於敘事文標記『轉折後持續改變』的時間點，比 since then 更口語敘事化）", "他大一時考試不及格過一次；從那之後，他比班上任何人都用功。"], ["last but not least", "—", "phrase", "最後一點但同樣重要", "Last but not least, effective communication is essential for teamwork.", "Last but not least, + S + V（常用於列點的最後一項，強調『雖列在最後但同樣重要』）", "最後但同樣重要的是，有效的溝通對團隊合作至關重要。"]]}], "sentenceBank": [{"en": "He couldn’t fall asleep, tossing and turning on the bed overnight. He suffered from insomnia.", "zh": "他整夜在床上輾轉反側無法入睡，深受失眠之苦。"}, {"en": "He murdered the song off key just like a chicken being choked. A burst of neighing laughter erupted from the crowd, wild and untamed.", "zh": "他唱歌唱得走音且極其難聽，簡直就像一隻被掐住脖子的雞。人群中爆發出一陣馬嘶般的狂笑，野性而放蕩不羈。"}, {"en": "Upon feasting my eyes on the lucid air, the magnificent scenery and the sapphire sea, I forgot all the fatigue and frustration accumulated from the monthly examinations.", "zh": "一看到清澈的空氣、壯麗的景色與寶石藍的大海，我便忘卻了月考累積的所有疲憊與挫折。"}, {"en": "Life, for others, is a bed of roses and a bowl of cherries; however, for me, it is a bumpy road with numerous twists and turns.", "zh": "對其他人而言，生活是一床順遂的玫瑰與一碗甜美的櫻桃（順風順水）；然而對我來說，卻是一條充滿曲折與坎坷的崎嶇之路。"}, {"en": "Life is like a box of chocolate as well; you will never know which flavor you will pick.", "zh": "人生就像一盒巧克力，你永遠不會知道你會挑到哪種口味。"}, {"en": "Life is like ECG; without ups and downs, you are not living.", "zh": "人生就像心電圖；沒有起伏跌宕，你就等於沒有活過。"}, {"en": "Spring has transformed the outskirts of the metropolis into paradise.", "zh": "春天將這座大都會的郊區蛻變成了天堂。"}, {"en": "Sunlight shone upon the earth, and the breeze sang softly.", "zh": "陽光撒在大地上，微風輕聲吟唱。"}, {"en": "She burst into tears with her eyes blurred by teardrops.", "zh": "她潸然淚下，雙眼被淚水所模糊。"}, {"en": "The lush green meadow spread across hills and valleys just like a tremendous carpet.", "zh": "蒼翠茂密的草地如同一塊巨大的地毯，綿延覆蓋了山丘與山谷。"}, {"en": "Radiant and brilliant flowers of all sorts were in full blossom in the garden.", "zh": "花園裡繁花盛開，各式各樣璀璨奪目的花朵爭奇鬥艷。"}, {"en": "He sprained his arm, strained his muscle and scratched his skin. He got severely injured.", "zh": "他扭傷了手臂、拉傷了肌肉，還劃破了皮膚，受了極為嚴重的傷。"}, {"en": "She unzipped her lips as if to say something but remained silent.", "zh": "她張開雙唇彷彿想說些什麼，卻依然保持沉默。"}, {"en": "We began to strike up a conversation, sharing the bitterness and sweetness of our lives with one another.", "zh": "我們開始攀談起來，彼此分享著各自生活中的酸甜苦辣。"}, {"en": "Fatigued and exhausted, they ultimately reached the destination, only to find the area outside the building packed with a sea of faces to a degree that they could not see the contour.", "zh": "他們筋疲力竭地終於抵達了目的地，卻發現大樓外早已擠滿了茫茫人海，甚至連建築物的輪廓都看不清。"}, {"en": "Upon hearing the devastating shipwreck, my eyeballs popped out of my head.", "zh": "一聽到那起毀滅性的船難訊息，我震驚得目瞪口呆（眼睛差點掉出來）。"}, {"en": "Upon hearing the devastating shipwreck, my eye sockets turned into a wide-open faucet, tears gushing out of control.", "zh": "一聽到那起毀滅性的船難訊息，我的眼眶就像開了的水龍頭一樣，淚水完全失控流下。"}, {"en": "The children laughed and hopped around joyfully, their little hands waving in the air like untamed leaves in the wind.", "zh": "孩子們歡笑著快樂地到處蹦蹦跳跳，他們的小手在空中揮舞，宛如隨風飛揚的野性落葉。"}, {"en": "When we were on the brink of defeat with [Project Name / The Game], everyone thought it was over. But we refused to be counted out. Through sheer grit, we turned the tide and snatched victory from the jaws of defeat.", "zh": "當 [專案/比賽] 面臨失敗邊緣時，所有人都以為結束了。但我們拒絕認輸。憑藉著純粹的毅力，我們扭轉了局勢，從失敗的虎口中奪回了勝利。"}, {"en": "The crowd erupted into thunderous applause and cheers.", "zh": "群眾爆發出雷鳴般的掌聲與歡呼聲。"}, {"en": "With a face beaming with joy, she rushed to hug her parents at the airport.", "zh": "帶著洋溢喜悅的臉龐，她衝上前擁抱在機場等候的父母。"}, {"en": "The two of them clashed like thunder meeting lightning, their fists flying in a blur of raw fury, until at last both collapsed to the ground, breathless and battered.", "zh": "兩人交鋒恰如雷電相擊，拳頭在狂怒中翻飛成一片模糊，直到最後雙雙癱倒在地，氣喘吁吁、遍體鱗傷。"}, {"en": "The veil of mystery surrounded the government's new policy.", "zh": "神秘的面紗籠罩著政府的新政策。"}, {"en": "While proponents argue that social media fosters global connectivity, critics contend that it exacerbates feelings of isolation among young people.", "zh": "支持者主張社群媒體促進全球連結，批評者則認為它加劇了年輕人的孤立感。"}, {"en": "The rising rate of academic burnout can largely be attributed to excessive competition, which in turn undermines students' overall well-being.", "zh": "學業倦怠率上升很大程度上可歸因於過度競爭，而這反過來又損害了學生的整體福祉。"}, {"en": "Rather than viewing artificial intelligence as either a blessing or a curse, we should recognize the complexity of its impact on society.", "zh": "與其將人工智慧視為單純的福音或詛咒，我們應該認清它對社會影響的複雜性。"}, {"en": "His face flushed crimson with rage, and his clenched fists trembled as he fought to hold back the urge to scream.", "zh": "他的臉因盛怒而漲得通紅，緊握的拳頭顫抖著，強忍住想放聲怒吼的衝動。"}, {"en": "A cold shiver ran down her spine as the footsteps grew closer, her heart pounding so violently she thought it might burst from her chest.", "zh": "一陣寒意順著她的背脊竄下，腳步聲越來越近，她的心臟猛烈地跳動，彷彿隨時都會從胸口迸裂。"}, {"en": "Staring blankly at the rejection letter, he felt as though the last flicker of hope within him had been extinguished for good.", "zh": "他茫然地盯著那封拒絕信，感覺內心最後一絲希望的火光已徹底熄滅。"}, {"en": "Her palms grew clammy and her mind went blank the moment she stepped onto the stage, every pair of eyes in the audience pressing down on her like a physical weight.", "zh": "她一踏上舞台，手心就開始冒汗，腦中一片空白，觀眾的目光如同實質的重量般壓在她身上。"}, {"en": "Heat crept up his neck and flushed across his cheeks as the entire classroom burst into laughter at his mistake.", "zh": "當全班因他的失誤而爆出笑聲時，一股熱意從他的頸部竄升，蔓延至臉頰。"}, {"en": "A pang of envy twisted in her chest as she watched her classmate proudly hold up the trophy she had once dreamed of winning.", "zh": "看著同學驕傲地舉起她曾夢寐以求的獎盃，一陣忌妒感在她胸口糾結。"}, {"en": "Gulping down her water and perspiring profusely in the scorching heat, she leaned against the wall, utterly out of breath.", "zh": "她大口灌下水，在酷熱中汗流浹背，接著疲憊地靠在牆上直喘氣。"}], "lastUpdated": "2026-10-23（改寫 146 個太短或句意不完整的例句）"}</script>
<script>
(function () {
  // ---- Sidebar collapse/expand ----
  const sidebar = document.getElementById('sidebar');
  const collapseBtn = document.getElementById('collapseBtn');
  const expandBtn = document.getElementById('expandBtn');
  const SIDEBAR_KEY = 'vocabBankSidebarCollapsed';

  function setSidebarCollapsed(collapsed) {
    sidebar.classList.toggle('collapsed', collapsed);
    document.body.classList.toggle('sidebar-collapsed', collapsed);
    expandBtn.hidden = !collapsed;
    sidebar.setAttribute('aria-hidden', collapsed ? 'true' : 'false');
    try { localStorage.setItem(SIDEBAR_KEY, collapsed ? '1' : '0'); } catch (e) {}
  }

  collapseBtn.addEventListener('click', () => setSidebarCollapsed(true));
  expandBtn.addEventListener('click', () => {
    setSidebarCollapsed(false);
    document.getElementById('searchInput').focus();
  });

  let startCollapsed = false;
  try { startCollapsed = localStorage.getItem(SIDEBAR_KEY) === '1'; } catch (e) {}
  setSidebarCollapsed(startCollapsed);

  const data = JSON.parse(document.getElementById('vocab-data').textContent);
  const content = document.getElementById('content');
  const navList = document.getElementById('navList');
  const emptyState = document.getElementById('emptyState');

  document.getElementById('docTitle').textContent = '英文作文單字與句型庫';
  document.getElementById('lastUpdated').textContent = data.lastUpdated;

  const totalWords = data.categories.reduce((s, c) => s + c.rows.length, 0);
  document.getElementById('entryCount').textContent = (totalWords + data.sentenceBank.length) + ' 個條目';

  // 頁首資訊：只顯示實際的條目數、最後更新日期和目標（舊 Word 檔的「姓名」「Table Row」等欄位已不適用）
  const metaEl = document.getElementById('heroMeta');
  const nPhrase = data.categories.filter(c => /phrase/i.test(c.name)).reduce((s, c) => s + c.rows.length, 0);
  const goal = (data.meta || []).find(m => /^目標/.test(m));
  [['單字', (totalWords - nPhrase) + ' 個'], ['片語', nPhrase + ' 個'], ['佳句', data.sentenceBank.length + ' 句'], ['最後更新', String(data.lastUpdated || '').split('（')[0]]]
    .forEach(([k, v]) => { const span = document.createElement('span'); span.innerHTML = '<strong>' + k + '：</strong>' + escapeHtml(v); metaEl.appendChild(span); });
  if (goal) { const span = document.createElement('span'); span.innerHTML = '<strong>目標：</strong>' + escapeHtml(goal.split('：').slice(1).join('：').trim()); metaEl.appendChild(span); }
  document.getElementById('heroNote').textContent = '';
  document.getElementById('heroNote').hidden = true;

  function posClass(pos) {
    const p = (pos || '').toLowerCase();
    if (p.startsWith('v')) return 'v';
    if (p.startsWith('adj')) return 'adj';
    if (p.startsWith('adv')) return 'adv';
    if (p.startsWith('n')) return 'n';
    if (p.includes('phrase')) return 'phrase';
    return 'default';
  }

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---- Text-to-speech (read aloud) ----
  // Uses the browser's built-in Web Speech API — no network/API key needed,
  // so it works the same on a published Artifact page. Buttons carry the
  // text to read in a data-speak attribute (not inline onclick) so we never
  // have to worry about escaping quotes into JS string literals.
  // Cache available voices and prefer a higher-quality en-US voice when the
  // browser offers one (e.g. "Google US English" on Chrome). Voice lists can
  // load asynchronously, so we also refresh the cache on 'voiceschanged'.
  let _voiceCache = null;
  function pickVoice() {
    try {
      const voices = _voiceCache || window.speechSynthesis.getVoices();
      if (!voices || !voices.length) return null;
      _voiceCache = voices;
      const prefs = [
        v => /en-US/i.test(v.lang) && /google/i.test(v.name),
        v => /en-US/i.test(v.lang) && /natural/i.test(v.name),
        v => /en-US/i.test(v.lang) && v.localService === false,
        v => /en-US/i.test(v.lang),
        v => /^en/i.test(v.lang),
      ];
      for (const test of prefs) {
        const found = voices.find(test);
        if (found) return found;
      }
    } catch (e) {}
    return null;
  }
  if ('speechSynthesis' in window) {
    try {
      _voiceCache = window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => { _voiceCache = window.speechSynthesis.getVoices(); };
    } catch (e) {}
  }
  // A flat slow rate sounds natural for a single word (helps pronunciation
  // drilling) but makes a full sentence sound robotic/clipped, since the
  // synthesizer's prosody is tuned around its default rate. So: short
  // word/phrase text is read slightly slower, longer sentence text is read
  // at a natural pace.
  function speakEn(text) {
    if (window.famSpeak) return window.famSpeak(text);
    try {
      if (!('speechSynthesis' in window) || !text) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      const wordCount = text.trim().split(/\s+/).length;
      u.rate = wordCount <= 4 ? 0.88 : 1.0;
      const voice = pickVoice();
      if (voice) u.voice = voice;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  window.speakEn = speakEn;
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.speak-btn');
    if (!btn) return;
    e.stopPropagation();
    speakEn(btn.dataset.speak || '');
  });
  function speakBtnHtml(text, extraClass) {
    return `<button type="button" class="speak-btn${extraClass ? ' ' + extraClass : ''}" title="朗讀英文" data-speak="${escapeHtml(text)}">🔊</button>`;
  }
  // Exposed globally so the separate study-mode script (below) can reuse the
  // same helpers instead of duplicating them.
  window.speakBtnHtml = speakBtnHtml;

  // Build nav
  data.categories.forEach((cat, i) => {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = '#cat-' + i;
    a.dataset.target = 'cat-' + i;
    a.innerHTML = '<span>' + escapeHtml(cat.name) + '</span><span class="nav-count">' + cat.rows.length + '</span>';
    li.appendChild(a);
    navList.appendChild(li);
  });
  const sbLi = document.createElement('li');
  sbLi.innerHTML = '<a href="#cat-sentence-bank" data-target="cat-sentence-bank"><span>Sentence Bank（高分句型）</span><span class="nav-count">' + data.sentenceBank.length + '</span></a>';
  navList.appendChild(sbLi);

  // Build content
  data.categories.forEach((cat, i) => {
    const section = document.createElement('section');
    section.className = 'category';
    section.id = 'cat-' + i;

    const numMatch = cat.name.match(/^(\d+)\.\s*(.*)$/);
    const num = numMatch ? numMatch[1] : (i + 1);
    const restName = numMatch ? numMatch[2] : cat.name;

    section.innerHTML = `
      <div class="category-head">
        <span class="category-num">${num.toString().padStart(2, '0')}</span>
        <h2>${escapeHtml(restName)}</h2>
        <span class="category-count">${cat.rows.length} 筆</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>${/phrase/i.test(cat.name) ? 'Phrase' : 'Word'}</th>
            <th>KK音標</th>
            <th>POS</th>
            <th>中文</th>
            <th>Example</th>
            <th>常見搭配</th>
          </tr></thead>
          <tbody>
            ${cat.rows.map((r, j) => `
              <tr class="row" data-idx="c${i}-${j}" data-search="${escapeHtml((r[0]+' '+r[3]+' '+r[4]+' '+(r[5]||'')).toLowerCase())}">
                <td class="word"><span data-field="word">${escapeHtml(r[0])}</span> ${speakBtnHtml(r[0])}</td>
                <td class="kk" data-field="kk">${escapeHtml(r[1])}</td>
                <td><span class="pos-tag" style="color:var(--pos-${posClass(r[2])});background:var(--pos-${posClass(r[2])}-bg)">${escapeHtml(r[2])}</span></td>
                <td class="zh" data-field="zh">${escapeHtml(r[3])}</td>
                <td class="example"><span data-field="example">${escapeHtml(r[4])}</span> ${speakBtnHtml(r[4], 'speak-btn-sm')}</td>
                <td class="colloc" data-field="colloc">${escapeHtml(r[5] || '')}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    `;
    content.appendChild(section);
  });

  // Sentence bank
  const sbSection = document.createElement('section');
  sbSection.className = 'category';
  sbSection.id = 'cat-sentence-bank';
  sbSection.innerHTML = `
    <div class="category-head">
      <span class="category-num">${(data.categories.length + 1).toString().padStart(2, '0')}</span>
      <h2>Sentence Bank（考場必背高分句型）</h2>
      <span class="category-count">${data.sentenceBank.length} 句</span>
    </div>
    <div class="sentence-grid">
      ${data.sentenceBank.map((s, k) => `

    entries.forEach(entry => {
      const link = navLinks.find(l => l.dataset.target === entry.target.id);

  // ---- Search ----
  const searchInput = document.getElementById('searchInput');
  const resultCount = document.getElementById('resultCount');
  const allRows = Array.from(document.querySelectorAll('.row'));

  function rawFieldsFor(row) {
    const idx = row.dataset.idx;
    if (idx[0] === 'c') {
      const [ci, ri] = idx.slice(1).split('-').map(Number);
      const r = data.categories[ci].rows[ri];
      return { word: r[0], kk: r[1], zh: r[3], example: r[4], colloc: r[5] || '' };

  }

  function escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  function markedHtml(text, q) {
    const safe = escapeHtml(text || '');
    if (!q) return safe;
    const re = new RegExp(escapeRegExp(escapeHtml(q)), 'ig');

    const raw = rawFieldsFor(row);
    row.querySelectorAll('[data-field]').forEach(el => {

<script>
(function () {

  function escapeHtml(s) {

    }

  }

  // ---------- Build card pool ----------
  const CARDS = [];
  data.categories.forEach((cat) => {
    const isPhrase = /phrase/i.test(cat.name);
    cat.rows.forEach((r) => {
      CARDS.push({
        id: 'w:' + r[0].toLowerCase(),
        type: isPhrase ? 'phrase' : 'word',
        category: cat.name,
        word: r[0], kk: r[1], pos: r[2], zh: r[3], example: r[4], colloc: r[5] || '', exZh: r[6] || ''

    });
  });
  data.sentenceBank.forEach((s) => {
    CARDS.push({
      id: 's:' + simpleHash(s.en),
      type: 'sentence',
      category: 'Sentence Bank（考場必背高分句型）',
      word: s.en, zh: s.zh, example: '', colloc: '', kk: '', pos: ''
    });
  });
  const CATEGORY_NAMES = data.categories.map(c => c.name);
  const WORD_ONLY = CARDS.filter(c => c.type === 'word');

  function catShort(name) {
    const m = name.match(/^\d+\.\s*(.*)$/);

  }

  // ---------- Blank matching for sentence-context modes (word/phrase only) ----------
  // Tries an exact match of the headword/phrase first (works for most phrases,
  // which are usually quoted verbatim in their example), then falls back to a
  // stem match on the first token (handles inflected single words like
  // "gulp" -> "Gulping").
  function escapeRegExpBlank(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  const blankCache = new Map();
  // 片語挖空：把片語裡每個字（含介系詞）都挖掉，動詞可以有時態變化；sb／sth／A／B 這類代稱的位置保留原句的字
  // 回傳 [{ index, matched }]（依位置排序）；找不到完整片語就回傳 null
  const IRREG = { fling: 'flung', stride: 'strode|stridden', creep: 'crept', take: 'took|taken', fall: 'fell|fallen', come: 'came', bear: 'bore|borne', sink: 'sank|sunk', strike: 'struck', lie: 'lay|lain|lying', give: 'gave|given', see: 'saw|seen', keep: 'kept', throw: 'threw|thrown', make: 'made', learn: 'learnt', seek: 'sought', undergo: 'underwent|undergone', go: 'went|gone', get: 'got|gotten', run: 'ran', shed: 'shed', burst: 'burst', put: 'put', set: 'set', cut: 'cut', hit: 'hit', let: 'let', is: 'are|was|were|be|been' };

  // Builds a "hangman"-style hint: reveals a short prefix of the word/phrase

  function answerVariants(term) {
    const out = new Set();
    const parts = String(term || '').split(/\s*[\/／]\s*/).map(x => x.trim()).filter(Boolean);

  // Per-word hint used for whole-sentence dictation: short/common words (<=3

  function normalizeWord(w) { return (w || '').toLowerCase().replace(/[’'‘`]/g, '').replace(/[^a-z]/g, ''); }

    const prefixLen = letterCount <= 3 ? 0 : letterCount <= 6 ? 1 : letterCount <= 10 ? 2 : 3;
    let shown = 0, out = '';
    for (const ch of token) {

  // ---------- Progress storage (Leitner-style) ----------

/* ---------- 熟練度加權抽題：不熟的字比較常出現，熟的字比較少出現 ---------- */
// st = { c: 答對次數, w: 答錯次數, s: 目前連續答對, t: 上次練習時間(ms) }
function famScore(st) {

  v *= Math.pow(0.5, days / halfLife);

}
// 抽中機率的權重：沒練過的字＝1（最優先，和剛答錯的字一樣）；練過的字隨熟悉度快速下降

function famWeight(st) { const v = famScore(st); if (v == null) return 1; return 0.04 + 0.96 * Math.pow(1 - v, 2.5); }
function weightedOrder(list, statOf) {
  return list.map(x => ({ x, k: Math.pow(Math.random(), 1 / famWeight(statOf(x))) }))
    .sort((a, b) => b.k - a.k).map(o => o.x);
}
function famBuckets(list, statOf) {
  const b = { weak: 0, mid: 0, strong: 0, fresh: 0 };
  list.forEach(x => { const v = famScore(statOf(x)); if (v == null) b.fresh++; else if (v < 0.35) b.weak++; else if (v < 0.7) b.mid++; else b.strong++; });

}
const famLine = b => `熟練度：<span style="color:var(--qz-bad);font-weight:700">不熟 ${b.weak + b.fresh}</span>${b.fresh ? `（含沒練過的新字 ${b.fresh}）` : ''}・普通 ${b.mid}・<span style="color:var(--qz-good);font-weight:700">熟 ${b.strong}</span>（不熟的字會比較常出現）`;

  // 把原本的熟悉度分級（box / seen / wrong / lastSeen）換算成加權用的格式；cr＝考慮作答時間後的答對分數，lastSlow＝上次答對有多慢
  const QZ_STORE_KEY = 'qz.essay.v1';
  /* ---------- 學習模式（Quizlet 式）學過的字：測驗模式的起點比較高 ---------- */
  // 只在這個字還沒有測驗紀錄時使用；學習模式選擇題答對＝像慢慢答對一次，拼寫也答對（已掌握）＝像答對一次半
  let _lq = null, _lqT = 0;
  function learnStore() {
    if (!_lq || Date.now() - _lqT > 2000) { try { _lq = JSON.parse(localStorage.getItem(QZ_STORE_KEY) || '{}') || {}; } catch (e) { _lq = {}; } _lqT = Date.now(); }
    return _lq;
  }
  function learnPrior(level, t) {
    if (level >= 2) return { c: 1.5, w: 0, s: 1.5, t: t || 0, prior: 1 };
    if (level === 1) return { c: 0.6, w: 0, s: 0.6, t: t || 0, prior: 1 };

  }

  // st：測驗模式的紀錄（可能沒有）；evs：學習模式作答 [[時間, 分數]]；只採計 st 最後一次作答之後的學習紀錄（之前的已併入）
  function learnMerge(st, evs, lv, lt) {

              ✏️ 自訂
            </label>
          </div>
          ${cfg.countIsCustom ? `
            <div class="custom-count-row">
              <input type="number" id="customCountInput" min="1" step="1" inputmode="numeric"
                     value="${typeof cfg.count === 'number' ? cfg.count : ''}" placeholder="輸入題數…">
              <span class="custom-count-suffix">題</span>
            </div>` : ''}
        </div>

        <p class="study-pool-hint" id="poolHint"></p>
        <button class="study-start-btn" id="startBtn" type="button">開始背誦</button>
        <button class="study-reset-link" id="resetProgBtn" type="button">清除本機學習紀錄</button>
        <div>${famExportHTML()}</div>
      </div>
    `;

    function updateHint() {
      const p = computePool();
      const due = p.filter(c => getProg(c.id).dueAt <= Date.now());
      const hint = document.getElementById('poolHint');
      const startBtn = document.getElementById('startBtn');
      if (p.length === 0) {
        hint.innerHTML = '目前條件下沒有符合的項目，請調整內容類型或分類範圍。';
        startBtn.disabled = true;
      } else if (cfg.scope === 'due' && due.length === 0) {
        hint.innerHTML = `符合條件共 <strong>${p.length}</strong> 筆，目前沒有到期該複習的，會從全部項目中依熟練度出題。<br>${famLine(famBuckets(p, statOf))}`;
        startBtn.disabled = false;
      } else {
        const useCount = cfg.scope === 'due' ? due.length : p.length;
        hint.innerHTML = `符合條件共 <strong>${p.length}</strong> 筆，本次將練習 <strong>${cfg.count === 'all' ? useCount : Math.min(cfg.count, useCount)}</strong> 題。<br>${famLine(famBuckets(p, statOf)).replace('（不熟的字會比較常出現）', cfg.scope === 'all' ? '（全部隨機：不看熟練度）' : '（不熟的字會比較常出現）')}`;
        startBtn.disabled = false;
      }
    }
    updateHint();
    famWireExport();

    document.getElementById('studyBackBtn').addEventListener('click', () => setStudyMode(false));

    // Use 'change' on the actual <input> (not 'click' on the wrapping <label>) —
    // clicking a label that contains its input fires a click on both the label
    // and the input (event bubbles through), so a 'click' listener on the label
    // double-fires and the toggle cancels itself out. 'change' fires exactly
    // once per real state change regardless of how it was triggered.
    document.querySelectorAll('#modeGroup .radio-pill input').forEach(inp => {
      inp.addEventListener('change', () => { cfg.mode = inp.closest('.radio-pill').dataset.mode; renderSetup(); });
    });
    document.querySelectorAll('#typeGroup .chip input').forEach(inp => {
      inp.addEventListener('change', (e) => {
        const el = inp.closest('.chip');
        if (el.classList.contains('disabled')) { e.preventDefault(); inp.checked = !inp.checked; return; }
        cfg.types[el.dataset.type] = inp.checked;
        renderSetup();
      });
    });
    document.getElementById('catAllBtn').addEventListener('click', () => { cfg.cats = new Set(CATEGORY_NAMES); renderSetup(); });
    document.getElementById('catNoneBtn').addEventListener('click', () => { cfg.cats = new Set(); renderSetup(); });
    document.querySelectorAll('#catGroup .chip input').forEach(inp => {
      inp.addEventListener('change', () => {
        const name = inp.closest('.chip').dataset.cat;
        if (inp.checked) cfg.cats.add(name); else cfg.cats.delete(name);
        renderSetup();
      });
    });
    document.querySelectorAll('#scopeGroup .radio-pill input').forEach(inp => {
      inp.addEventListener('change', () => { cfg.scope = inp.closest('.radio-pill').dataset.scope; renderSetup(); });
    });
    document.querySelectorAll('#countGroup .radio-pill input').forEach(inp => {
      inp.addEventListener('change', () => {
        const v = inp.closest('.radio-pill').dataset.count;
        if (v === 'custom') {
          cfg.countIsCustom = true;
          if (typeof cfg.count !== 'number') cfg.count = 20;
        } else {
          cfg.countIsCustom = false;
          cfg.count = v === 'all' ? 'all' : Number(v);
        }
        renderSetup();
      });
    });
    const customCountInput = document.getElementById('customCountInput');
    if (customCountInput) {
      customCountInput.focus();
      customCountInput.addEventListener('input', () => {
        // Update cfg + the hint/start-button in place (no renderSetup() here —
        // a full re-render would rebuild the input and steal focus mid-type).
        const n = parseInt(customCountInput.value, 10);
        const valid = Number.isFinite(n) && n > 0;
        if (valid) cfg.count = Math.min(n, 9999);
        updateHint();
        document.getElementById('startBtn').disabled = !valid || computePool().length === 0;
      });
    }
    document.getElementById('startBtn').addEventListener('click', startSession);
    document.getElementById('resetProgBtn').addEventListener('click', () => {
      if (confirm('確定要清除所有本機學習紀錄嗎？此動作無法復原。')) {
        progress = {};
        saveProgress();
        renderSetup();
      }
    });
  }

  // ---------- Session / Drill ----------
  let session = null;

  function startSession() {
    const pool = computePool();
    if (pool.length === 0) return;
    let list;
    if (cfg.scope === 'due') {
      const due = pool.filter(c => getProg(c.id).dueAt <= Date.now());
      list = weightedOrder(due.length > 0 ? due : pool.slice(), statOf);
    } else {
      list = shuffle(pool);
    }
    const n = cfg.count === 'all' ? list.length : Math.min(cfg.count, list.length);
    session = { cards: list.slice(0, n), idx: 0, mode: cfg.mode, results: [] };
    renderDrill();
  }

  function drillTopbar() {
    const total = session.cards.length;
    const doneCount = session.idx;
    const pct = total ? Math.round((doneCount / total) * 100) : 0;
    const modeLabel = {flashcard:'單字卡', mc:'選擇題', spelling:'拼寫測驗', cloze:'克漏字', dictation:'句子默寫'}[session.mode];
    return `
      <div class="drill-mode-badge">${modeLabel}</div>
      <div class="drill-topbar">
        <span class="drill-progress-text">第 ${Math.min(doneCount + 1, total)} / ${total} 題</span>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        ${canUndo() ? '<button class="drill-exit-btn" id="undoBtn" type="button" title="回到上一張，重新選擇">← 上一張</button>' : ''}
        <button class="drill-exit-btn" id="exitBtn" type="button">結束</button>
      </div>
    `;
  }

  function recordResult(card, correct, box) {
    const before = progress[card.id] ? Object.assign({}, progress[card.id]) : null;
    const kind = session.mode === 'dictation' ? 'long' : (session.mode === 'spelling' || session.mode === 'cloze') ? 'type' : 'quick';
    const ms = session.mode === 'flashcard' ? session.flipMs : famElapsed(session.t0);
    const sf = correct ? slowFactor(ms, kind) : 0;
    famRecord(card.id, session.mode, kind, ms, correct);
    queueMicrotask(() => {
      const p = progress[card.id]; if (!p) return;
      const base = before ? (before.cr != null ? before.cr : Math.max(0, (before.seen || 0) - (before.wrong || 0))) : 0;
      p.cr = base + (correct ? creditFor(ms, kind) : 0);
      p.lastSlow = 0.3 * sf;   // 和 creditFor 同比例：慢答只小幅影響
      saveProgress();
    });
    const lf = learnFold(card);
    session.results.push({ card, correct });
    setProg(card.id, box, !correct);
    Object.assign(progress[card.id], lf, correct ? {} : { ls: 0 }); saveProgress();
  }

  function canUndo() {
    return !!(session && session.undo && session.undo.length && session.mode === 'flashcard');
  }
  function undoLast() {
    if (!canUndo()) return;
    const u = session.undo.pop();
    famUnrecord(u.id);
    session.results.pop();
    if (u.prev) progress[u.id] = u.prev; else delete progress[u.id];
    saveProgress();
    session.idx = u.idx;
    renderDrill();
  }
  function wireUndo() {
    const b = document.getElementById('undoBtn');
    if (b) b.addEventListener('click', undoLast);
  }

  function advance() {
    session.idx++;
    if (session.idx >= session.cards.length) renderSummary();
    else renderDrill();
  }

  function renderDrill() {
    const card = session.cards[session.idx];
    session.t0 = famStart(); session.flipMs = 0;
    let body = '';
    if (session.mode === 'flashcard') body = flashcardHtml(card);
    else if (session.mode === 'mc') body = mcHtml(card);
    else if (session.mode === 'spelling') body = spellingHtml(card);
    else if (session.mode === 'cloze') body = clozeHtml(card);
    else if (session.mode === 'dictation') body = dictationHtml(card);

    studyPanel.innerHTML = `<div class="study-card">${drillTopbar()}${body}</div>`;
    document.getElementById('exitBtn').addEventListener('click', () => {
      if (session.results.length > 0) renderSummary(); else renderSetup();
    });
    wireUndo();
    wireDrillMode(card);
  }

  function flashcardHtml(card) {
    if (card.type === 'sentence') {
      return `
        <div class="flashcard" id="fcCard">
          <div class="fc-word" style="font-size:1.15rem">${escapeHtml(card.zh)}</div>
          <p class="fc-hint" id="fcHint">點擊卡片，試著回想這句英文</p>
          <div class="fc-back-block hidden" id="fcBack">
            <p class="fc-sentence-en">${escapeHtml(card.word)} ${speakBtnHtml(card.word)}</p>
          </div>
          <div class="rate-btns hidden" id="rateBtns">
            <button class="rate-btn" data-rate="0" type="button">😵 還不熟</button>
            <button class="rate-btn" data-rate="1" type="button">🙂 有印象</button>
            <button class="rate-btn" data-rate="2" type="button">😎 記得</button>
          </div>
        </div>`;
    }
    return `
      <div class="flashcard" id="fcCard">
        <div class="fc-cat">${escapeHtml(catShort(card.category))}</div>
        <div class="fc-word">${escapeHtml(card.word)} ${speakBtnHtml(card.word)}</div>
        <div class="fc-kk">${escapeHtml(card.kk)} ${card.pos ? '· ' + escapeHtml(card.pos) : ''}</div>
        <p class="fc-hint" id="fcHint">點擊卡片，回想中文意思</p>
        <div class="fc-back-block hidden" id="fcBack">
          <p class="fc-back-row"><strong>中文：</strong>${escapeHtml(card.zh)}</p>
          <p class="fc-back-row fc-example">${escapeHtml(card.example)}</p>
          ${card.colloc ? `<p class="fc-back-row">${escapeHtml(card.colloc)}</p>` : ''}
        </div>
        <div class="rate-btns hidden" id="rateBtns">
          <button class="rate-btn" data-rate="0" type="button">😵 還不熟</button>
          <button class="rate-btn" data-rate="1" type="button">🙂 有印象</button>
          <button class="rate-btn" data-rate="2" type="button">😎 記得</button>
        </div>
      </div>`;
  }

  // 例句挖空：片語的每一段（含介系詞）都換成空格
  function blankedHtml(card, m) {
    const sp = m.spans || [{ index: m.index, matched: m.matched }];
    let out = '', pos = 0;
    sp.forEach(x => { out += escapeHtml(card.example.slice(pos, x.index)) + '<span class="cloze-blank">＿＿＿＿＿</span>'; pos = x.index + x.matched.length; });
    return out + escapeHtml(card.example.slice(pos));
  }
  // 選擇題：例句克漏字，從 4 個單字／片語選項中選出正確答案
  // 中文意思重疊檢查：兩個字的中文解釋只要有相同的兩字詞（例如「水槽」「很棒」），就不放在同一題當選項
  const zhBigrams = z => { const out = new Set(); String(z || '').replace(/（[^）]*）|\([^)]*\)/g, '').replace(/[的地得了一個某些著]/g, '').split(/[；、，,／\/\s;=]+/).forEach(seg => { const c = seg.replace(/[^一-鿿]/g, ''); for (let i = 0; i + 1 < c.length; i++) out.add(c.slice(i, i + 2)); if (c.length === 1) out.add(c); }); return out; };
  const zhOverlap = (a, b) => { const A = zhBigrams(a); for (const x of zhBigrams(b)) if (A.has(x)) return true; return false; };
  function mcHtml(card) {
    const m = findBlank(card);
    // 錯誤選項不能跟正解意思重疊，也不能長得像（同一個字開頭）
    const okD = c => c.type !== 'sentence' && c.id !== card.id && c.word.toLowerCase() !== card.word.toLowerCase() && !zhOverlap(c.zh, card.zh) && c.word.toLowerCase().split(' ')[0] !== card.word.toLowerCase().split(' ')[0];
    let distractorPool = CARDS.filter(c => c.type === card.type && okD(c));
    if (distractorPool.length < 3) distractorPool = CARDS.filter(okD);
    const distractors = [], dz = [];
    for (const c of shuffle(distractorPool)) { if (dz.some(z => zhOverlap(z, c.zh)) || distractors.some(w => w.toLowerCase() === c.word.toLowerCase())) continue; distractors.push(c.word); dz.push(c.zh); if (distractors.length === 3) break; }
    const options = shuffle([card.word, ...distractors]);
    return `
      <div class="cloze-question">
        <p class="cloze-sentence">${blankedHtml(card, m)}</p>
        <p class="cloze-zh-hint">提示：${escapeHtml(card.zh)}</p>
        <div class="mc-options" id="mcOptions">
          ${options.map(o => `<button class="mc-option" data-val="${escapeHtml(o)}" type="button">${escapeHtml(o)}</button>`).join('')}
        </div>
        <div class="next-btn-row hidden" id="nextRow"><button class="next-btn" id="nextBtn" type="button">下一題 →</button></div>
      </div>`;
  }

  function spellingHtml(card) {
    return `
      <div class="spelling-block">
        <div class="spelling-zh">${escapeHtml(card.zh)}</div>
        <div class="spelling-pos">${card.pos ? escapeHtml(card.pos) : ''}</div>
        <div class="spelling-input-row">
          <input type="text" id="spellInput" autocomplete="off" placeholder="請輸入英文單字或片語…">
          <button class="spelling-submit-btn" id="spellSubmit" type="button">送出</button>
        </div>
        <div id="spellFeedback"></div>
        <div class="next-btn-row hidden" id="nextRow"><button class="next-btn" id="nextBtn" type="button">下一題 →</button></div>
      </div>`;
  }

  // 克漏字：例句挖空 + 字首字母提示，自己打出正確答案
  function clozeHtml(card) {
    const m = findBlank(card);
    return `
      <div class="cloze-question">
        <p class="cloze-sentence">${blankedHtml(card, m)}</p>
        <p class="hint-pattern" id="hintPattern">${escapeHtml(hintPattern(card.word))}</p>
        <div class="spelling-input-row">
          <input type="text" id="spellInput" autocomplete="off" placeholder="請輸入完整答案…">
          <button class="spelling-submit-btn" id="spellSubmit" type="button">送出</button>
        </div>
        <div id="spellFeedback"></div>
        <div class="next-btn-row hidden" id="nextRow"><button class="next-btn" id="nextBtn" type="button">下一題 →</button></div>
      </div>`;
  }

  // 句子默寫：給中文＋單字數＋（較難的字給字首），默寫出整句英文
  function dictationHtml(card) {
    const words = card.word.split(/\s+/).filter(Boolean);
    const hintLine = words.map(w => `<span class="dict-word">${escapeHtml(wordHint(w))}</span>`).join(' ');
    return `
      <div class="cloze-question">
        <p class="dictation-zh">${escapeHtml(card.zh)}</p>
        <p class="cloze-zh-hint">共 ${words.length} 個單字（部分較長的字已給字首提示）</p>
        <p class="hint-pattern dictation-hint">${hintLine}</p>
        <textarea id="dictInput" class="dictation-textarea" rows="3" placeholder="請完整打出這句英文…"></textarea>
        <div class="next-btn-row" style="justify-content:flex-start;margin-top:10px;">
          <button class="spelling-submit-btn" id="spellSubmit" type="button">送出</button>
        </div>
        <div id="spellFeedback"></div>
        <div class="next-btn-row hidden" id="nextRow"><button class="next-btn" id="nextBtn" type="button">下一題 →</button></div>
      </div>`;
  }

  function wireDrillMode(card) {
    if (session.mode === 'flashcard') {
      const fcCard = document.getElementById('fcCard');
      let flipped = false;
      function flip(e) {
        if (flipped) return;
        if (e && e.target.closest('.speak-btn')) return; // tapping 🔊 shouldn't flip the card
        flipped = true;
        session.flipMs = famElapsed(session.t0);
        document.getElementById('fcBack').classList.remove('hidden');
        document.getElementById('rateBtns').classList.remove('hidden');
        document.getElementById('fcHint').textContent = '請選擇熟悉程度';
      }
      fcCard.addEventListener('click', flip);
      document.querySelectorAll('.rate-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (!flipped) return;
          const rate = Number(btn.dataset.rate);
          session.undo = session.undo || [];
          session.undo.push({ idx: session.idx, id: card.id, prev: progress[card.id] ? Object.assign({}, progress[card.id]) : null });
          const curBox = getProg(card.id).box;
          let newBox;
          if (rate === 0) newBox = 0;
          else if (rate === 1) newBox = curBox;
          else newBox = curBox + 1;
          recordResult(card, rate > 0, newBox);
          advance();
        });
      });
    } else if (session.mode === 'mc') {
      // 選擇題：例句克漏字，點選正確的單字／片語選項
      const opts = document.querySelectorAll('#mcOptions .mc-option');
      // 某個字的完整釋義（答錯時「你選的」、作答後點其他選項時「選項」）
      const defOf = (w, label, peek) => {
        if (!window.wrongDefHTML) return '';
        const hits = CARDS.filter(c => c.type !== 'sentence' && c.word.toLowerCase() === String(w).toLowerCase());
        return hits.length ? wrongDefHTML(hits[0].word, hits.map(c => ({ pos: c.pos, kk: c.kk && c.kk !== '—' ? c.kk : '', zh: c.zh, ex: escapeHtml(c.example), exZh: c.exZh, note: c.colloc ? '常見搭配：' + c.colloc : '' })), label, peek) : '';
      };
      let pickedBtn = null, peekBtn = null;
      opts.forEach(btn => {
        btn.addEventListener('click', () => {
          if (pickedBtn) {   // 已作答：點其他選項展開它的釋義，再點一次收起
            if (btn.dataset.val === card.word || btn === pickedBtn) return;
            peekBtn = peekBtn === btn ? null : btn;
            opts.forEach(b => b.classList.toggle('peek', b === peekBtn));
            const P = document.getElementById('mcPeek'); if (P) P.innerHTML = peekBtn ? defOf(peekBtn.dataset.val, '選項', true) : '';
            return;
          }
          pickedBtn = btn;
          const correct = btn.dataset.val === card.word;
          opts.forEach(b => {
            if (b.dataset.val === card.word) b.classList.add('correct');
            else if (b === btn) b.classList.add('wrong');
          });
          const curBox = getProg(card.id).box;
          recordResult(card, correct, correct ? curBox + 1 : 0);
          const nextRow = document.getElementById('nextRow');
          nextRow.insertAdjacentHTML('beforebegin',
            `<p class="cloze-zh-hint">${speakBtnHtml(card.example)} ${escapeHtml(card.example)}</p>${!correct && card.exZh ? `<p class="cloze-zh-hint ex-tr">${escapeHtml(card.exZh)}</p>` : ''}`);
          if (!correct) nextRow.insertAdjacentHTML('beforebegin', defOf(btn.dataset.val, '你選的'));   // 答錯：列出選錯的那個字的完整釋義
          nextRow.insertAdjacentHTML('beforebegin', '<p class="peek-hint">點其他選項可以看它的意思</p><div id="mcPeek"></div>');
          nextRow.classList.remove('hidden');
          document.getElementById('nextBtn').addEventListener('click', advance);
        });
      });
    } else if (session.mode === 'spelling') {
      const input = document.getElementById('spellInput');
      const submit = document.getElementById('spellSubmit');
      input.focus();
      function doSubmit() {
        if (input.disabled) return;
        const correct = answerVariants(card.word).some(v => normAnswer(input.value) === normAnswer(v));
        input.disabled = true;
        submit.disabled = true;
        input.classList.add(correct ? 'correct' : 'wrong');
        const fb = document.getElementById('spellFeedback');
        fb.innerHTML = `
          <div class="spelling-feedback ${correct ? 'correct' : 'wrong'}">
            ${correct ? '✅ 正確！' : '❌ 正確答案：' + escapeHtml(card.word)} ${speakBtnHtml(card.word)}
            <div class="fb-example">${escapeHtml(card.example)}</div>
            ${!correct && card.exZh ? `<div class="fb-example ex-tr">${escapeHtml(card.exZh)}</div>` : ''}
          </div>`;
        const curBox = getProg(card.id).box;
        recordResult(card, correct, correct ? curBox + 1 : 0);
        document.getElementById('nextRow').classList.remove('hidden');
        document.getElementById('nextBtn').addEventListener('click', advance);
      }
      submit.addEventListener('click', doSubmit);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSubmit(); });
    } else if (session.mode === 'cloze') {
      // 克漏字（拼寫版）：例句挖空 + 字首字母提示，親自打出答案
      const input = document.getElementById('spellInput');
      const submit = document.getElementById('spellSubmit');
      input.focus();
      function doSubmit() {
        if (input.disabled) return;
        const correct = answerVariants(card.word).some(v => normAnswer(input.value) === normAnswer(v));
        input.disabled = true;
        submit.disabled = true;
        input.classList.add(correct ? 'correct' : 'wrong');
        const fb = document.getElementById('spellFeedback');
        fb.innerHTML = `
          <div class="spelling-feedback ${correct ? 'correct' : 'wrong'}">
            ${correct ? '✅ 正確！' : '❌ 正確答案：' + escapeHtml(card.word)} ${speakBtnHtml(card.word)}
            <div class="fb-example">${escapeHtml(card.zh)}</div>
            <div class="fb-example">${speakBtnHtml(card.example)} ${escapeHtml(card.example)}</div>
            ${!correct && card.exZh ? `<div class="fb-example ex-tr">${escapeHtml(card.exZh)}</div>` : ''}
            ${card.colloc ? `<div class="fb-example">${escapeHtml(card.colloc)}</div>` : ''}
          </div>`;
        const curBox = getProg(card.id).box;
        recordResult(card, correct, correct ? curBox + 1 : 0);
        document.getElementById('nextRow').classList.remove('hidden');
        document.getElementById('nextBtn').addEventListener('click', advance);
      }
      submit.addEventListener('click', doSubmit);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSubmit(); });
    } else if (session.mode === 'dictation') {
      // 句子默寫：中文 + 單字數 + 部分字首提示，默寫出整句英文
      const input = document.getElementById('dictInput');
      const submit = document.getElementById('spellSubmit');
      input.focus();
      function doSubmit() {
        if (input.disabled) return;

        const n = targetWords.length;

  function renderSummary() {

  famAnalysisSetup({ title: '作文單字庫', items: CARDS, statOf, resolve: k => _faMap.get(k) || null,

    wordOf: c => c.type === 'sentence' ? (c.word.length > 48 ? c.word.slice(0, 46) + '…' : c.word) : c.word, zhOf: c => c.zh, anchor: '#studyModeBtn' });
  /* ---------- 單字表上的小標籤：每個字的熟悉度與答對率 ---------- */
  // cfg: { statOf(item), resolve(logKey) -> item|null, slots() -> [[要放標籤的元素, item], …], inline, qzKey }
  function famBadgeSetup(cfg) {
    const css = `
    .famb { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 0.7rem; font-weight: 500; color: var(--ink-faint); white-space: nowrap; font-variant-numeric: tabular-nums; line-height: 1.3; letter-spacing: 0; text-transform: none; font-style: normal; }
    .famb.inl { display: inline-flex; margin: 0 0 0 8px; vertical-align: 1px; }
    .famb .fb-bar { position: relative; width: 34px; height: 5px; border-radius: 3px; background: var(--border); overflow: hidden; flex: none; }
    .famb .fb-bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
    .famb.fbw .fb-bar i { background: var(--qz-bad); } .famb.fbm .fb-bar i { background: var(--qz-mid); } .famb.fbs .fb-bar i { background: var(--qz-good); }
    .famb.fbw b { color: var(--qz-bad); } .famb.fbm b { color: var(--qz-mid); } .famb.fbs b { color: var(--qz-good); }
    .famb b { font-weight: 700; }
    .famb.fbn { opacity: 0.8; }
    .famb[hidden] { display: none; }`;
    const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
    const level = v => v == null ? 'n' : v < 0.35 ? 'w' : v < 0.7 ? 'm' : 's';

    function html(item, acc) {
      const s = cfg.statOf(item), v = s ? famScore(s) : null, l = level(v);
      if (v == null) return { l, h: '還沒練過' };
      const p = Math.round(v * 100);
      let a;
      if (acc && acc.n) a = `答對率 ${Math.round(acc.ok / acc.n * 100)}%（${acc.ok}/${acc.n}）`;
      else if (acc && acc.fl) a = `單字卡看過 ${acc.fl} 次`;
      else if (s.prior) a = '學習模式學過';
      else a = '';
      return { l, h: `<span class="fb-bar"><i style="width:${Math.max(4, p)}%"></i></span>熟悉度 <b>${p}%</b>${a ? '・' + a : ''}` };
    }
    let sig = '';
    function signature() {
      const log = typeof famLog !== 'undefined' ? famLog : [];
      let q = ''; try { q = localStorage.getItem(cfg.qzKey || '') || ''; } catch (e) {}
      return log.length + ':' + (log.length ? log[log.length - 1][0] : 0) + ':' + q.length;
    }
    function refresh(force) {
      const slots = cfg.slots();
      if (!slots.length) return;
      const s = signature();
      if (!force && s === sig && slots[0][0].querySelector(':scope > .famb')) return;
      sig = s;
      const per = new Map();
      (typeof famLog !== 'undefined' ? famLog : []).forEach(r => {

        let a = per.get(it); if (!a) { a = { n: 0, ok: 0, fl: 0 }; per.set(it, a); }

        a.n++; if (r[5]) a.ok++;

      slots.forEach(([el, item]) => {
        if (!el || !item) return;
        let b = el.querySelector(':scope > .famb');
        if (!b) { b = document.createElement('span'); el.appendChild(b); }
        const o = html(item, per.get(item));
        b.className = 'famb fb' + o.l + (cfg.inline ? ' inl' : '');
        b.hidden = cfg.inline && o.l === 'n';   // 單元庫字太多：沒練過的就不標
        b.innerHTML = o.h;
      });
    }
    let t = 0;
    const later = () => { clearTimeout(t); t = setTimeout(() => refresh(false), 250); };
    document.addEventListener('click', later, true);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) later(); });
    setTimeout(() => refresh(true), 0);
    return { refresh };
  }
  famBadgeSetup({ statOf, resolve: k => _faMap.get(k) || null, qzKey: QZ_STORE_KEY,
    slots: () => [...document.querySelectorAll('#content .row')].map((r, i) => [r.matches('tr') ? r.querySelector('td.word') : r, CARDS[i]]) });
})();
</script>

<script>
(function () {
  const SEL = '.sentence-en [data-field="en"], td.example [data-field="example"]';

  });

  function addTips() {
    document.querySelectorAll('.sentence-grid, .table-wrap').forEach(function (box) {
      if (box.previousElementSibling && box.previousElementSibling.classList.contains('blur-tip')) return;

      box.parentNode.insertBefore(tip, box);
    });
  }
  document.addEventListener('click', function (e) {
    const b = e.target.closest('.blur-tip [data-blur]');
    if (!b) return;
    const box = b.parentNode.nextElementSibling;
    const on = b.dataset.blur === '1';
    box.querySelectorAll(SEL).forEach(function (el) { el.classList.toggle('is-blurred', on); });

  if (content) { addTips(); new MutationObserver(addTips).observe(content, { childList: true }); }

        <p class="qz-h"><span>選${A.groupLabel}（已選 ${st.sel.length} 個，共 ${pool.length} 字）</span><span class="qz-tools"><button class="qz-link" type="button" id="qzAll">全選</button><button class="qz-link" type="button" id="qzNone">清除</button></span></p>
        <div class="qz-groups${compact ? ' compact' : ''}">${A.groups.map(g => {
          const items = A.items.filter(it => String(it.g) === String(g.id)); const gc = counts(items);
          const on = st.sel.map(String).includes(String(g.id));
          const w = x => (gc.t ? (x / gc.t) * 100 : 0).toFixed(0) + '%';
          return `<button type="button" class="qz-g${on ? ' on' : ''}" data-g="${esc(g.id)}" title="${esc(g.name)}（${gc.t} 字，已掌握 ${gc.m}）"><span class="qz-gn">${esc(compact ? (g.short || g.name) : g.name)}</span><span class="qz-mini"><i class="m" style="width:${w(gc.m)}"></i><i class="l" style="width:${w(gc.l)}"></i></span></button>`;
        }).join('')}</div>
        ${(A.filters || []).length ? `<div class="qz-opt">${A.filters.map(f => `<label><input type="checkbox" data-filt="${f.key}" ${st.filt[f.key] ? 'checked' : ''}>${esc(f.label)}</label>`).join('')}</div>` : ''}
      </div>
      <div class="qz-card">
        <p class="qz-h"><span>學習進度（已選範圍）</span></p>
        ${bar(c)}
        <div class="qz-stat" style="margin-top:10px"><span><i class="qz-dot m"></i>已掌握 <strong>${c.m}</strong></span><span><i class="qz-dot l"></i>學習中 <strong>${c.l}</strong></span><span><i class="qz-dot n"></i>未學 <strong>${c.n}</strong></span><span>單字卡「會了」<strong>${knownN}</strong></span></div>
      </div>
      <div class="qz-modes">
        <button class="qz-mode" type="button" id="qzFlash" ${pool.length ? '' : 'disabled'}><b>單字卡</b><span>看中文和挖空例句，翻面看英文。分成「還在學／會了」，下一輪只練還在學的。</span></button>
        <button class="qz-mode" type="button" id="qzLearn" ${pool.length ? '' : 'disabled'}><b>學習</b><span>每回合 ${ROUND} 個字：先全部考選擇題，再全部考拼寫；答錯的字下一回合再考。</span></button>
      </div>
      <div class="qz-opt"><span>單字卡正面</span><span class="qz-seg"><button type="button" data-front="zh" class="${st.front === 'zh' ? 'on' : ''}">中文</button><button type="button" data-front="en" class="${st.front === 'en' ? 'on' : ''}">英文</button></span>
        <button class="qz-reset" type="button" id="qzReset">${resetArmed ? '確定清除這個範圍的進度？再按一次' : '清除這個範圍的學習進度'}</button></div>
    </div>`;
    wireHeader();
    root.querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
      const id = b.dataset.g, cur = st.sel.map(String);
      st.sel = cur.includes(id) ? st.sel.filter(x => String(x) !== id) : st.sel.concat([A.groups.find(g => String(g.id) === id).id]);
      save(); resetArmed = false; renderHome();
    });
    $('#qzAll').onclick = () => { st.sel = A.groups.map(g => g.id); save(); renderHome(); };
    $('#qzNone').onclick = () => { st.sel = []; save(); renderHome(); };
    root.querySelectorAll('[data-filt]').forEach(cb => cb.onchange = () => { st.filt[cb.dataset.filt] = cb.checked; save(); renderHome(); });
    root.querySelectorAll('[data-front]').forEach(b => b.onclick = () => { st.front = b.dataset.front; save(); renderHome(); });
    $('#qzFlash').onclick = () => startFlash();
    $('#qzLearn').onclick = () => startLearn();
    $('#qzReset').onclick = () => {
      if (!resetArmed) { resetArmed = true; renderHome(); return; }
      poolItems().forEach(it => { delete st.m[it.id]; known.delete(it.id); }); st.k = [...known]; save(); resetArmed = false; renderHome();
    };
  }

  /* ---------- flashcards ---------- */
  let F = null;
  function startFlash(ids) {
    const pool = poolItems();
    if (!ids) {
      const notKnown = pool.filter(it => !known.has(it.id));
      ids = shuffle((notKnown.length ? notKnown : pool).map(it => it.id));
    }
    F = { deck: ids, i: 0, flipped: false, hist: [], still: [], know: [] };
    mode = 'flash'; renderFlash();
  }
  function flashSort(ok) {
    if (!F || F.i >= F.deck.length) return;
    const id = F.deck[F.i];
    F.hist.push({ i: F.i, id, wasKnown: known.has(id) });
    if (ok) { known.add(id); F.know.push(id); } else { known.delete(id); F.still.push(id); }
    st.k = [...known]; save();
    F.i++; F.flipped = false; renderFlash(ok ? 'k' : 's');
  }
  function flashUndo() {
    const h = F.hist.pop(); if (!h) return;
    if (h.wasKnown) known.add(h.id); else known.delete(h.id);
    st.k = [...known]; save();
    F.still = F.still.filter(x => x !== h.id); F.know = F.know.filter(x => x !== h.id);
    F.i = h.i; F.flipped = false; renderFlash();
  }
  // 配圖（item.img，可省略）：只在翻面或作答後顯示
  // 例句變體（item.vars，可省略）：每換一題就隨機抽一句，免得看到句子就背出答案
  function rollEx(it) { if (it && it.vars && it.vars.length > 1) Object.assign(it, it.vars[Math.floor(Math.random() * it.vars.length)]); }
  function imgQ(it) { return it && it.img ? `<span class="qz-img" aria-hidden="true">${it.img}</span>` : ''; }
  function renderFlash(dir) {
    if (F.i >= F.deck.length) return renderFlashEnd();
    const it = BY.get(F.deck[F.i]);
    if (F.rolled !== F.deck[F.i] + '#' + F.i) { F.rolled = F.deck[F.i] + '#' + F.i; rollEx(it); }
    const frontEn = st.front === 'en';
    const showEn = frontEn ? !F.flipped : F.flipped;
    const extra = `${imgQ(it)}${exFullHTML(it)}${it.note ? `<div class="qz-note">${esc(it.note)}</div>` : ''}`;
    const zhOnly = `<div class="qz-zh">${it.pos ? `<span class="qz-pos">${esc(it.pos)}</span>` : ''}${esc(it.zh)}</div>`;
    let face;
    if (!frontEn) face = F.flipped ? answerHTML(it) + extra : promptHTML(it);
    else face = F.flipped ? zhOnly + extra : answerHTML(it);
    root.innerHTML = `<div class="qz-wrap">${header('單字卡', true)}
      <div class="qz-top"><span class="qz-count">${F.i + 1} / ${F.deck.length}</span>${bar({ m: F.know.length, l: F.still.length, t: F.deck.length })}${F.hist.length ? '<button class="qz-btn undo" type="button" id="qzUndo">← 上一張</button>' : ''}</div>
      <div class="qz-tally"><span class="s">還在學 ${F.still.length}</span><span class="k">會了 ${F.know.length}</span></div>
      <div class="qz-fc${F.flipped ? ' flip' : ''}" id="qzCard" role="button" tabindex="0" aria-label="翻面">
        <span class="qz-side">${showEn ? 'ENGLISH' : '中文'}</span>${face}
        ${F.flipped ? '' : `<span class="qz-hint">點卡片翻面</span>`}
      </div>
      <div class="qz-sort"><button type="button" class="s" id="qzStill">✗ 還在學</button><button type="button" class="k" id="qzKnow">✓ 會了</button></div>
      <p class="qz-keys">空白鍵翻面　←／→ 還在學／會了　手機可左右滑動</p>
    </div>`;
    wireHeader();
    const card = $('#qzCard');
    let sx = null, moved = false;
    card.onclick = e => { if (e.target.closest('[data-say]') || moved) return; F.flipped = !F.flipped; renderFlash(); };
    card.addEventListener('touchstart', e => { sx = e.touches[0].clientX; moved = false; }, { passive: true });
    card.addEventListener('touchmove', e => { if (sx == null) return; const dx = e.touches[0].clientX - sx; if (Math.abs(dx) > 12) { moved = true; card.style.transform = `translateX(${dx}px) rotate(${dx / 30}deg)`; card.classList.toggle('go-k', dx > 60); card.classList.toggle('go-s', dx < -60); } }, { passive: true });
    card.addEventListener('touchend', e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; sx = null; card.style.transform = ''; if (dx > 70) flashSort(true); else if (dx < -70) flashSort(false); else setTimeout(() => moved = false, 0); });
    $('#qzStill').onclick = () => flashSort(false);
    $('#qzKnow').onclick = () => flashSort(true);
    const u = $('#qzUndo'); if (u) u.onclick = flashUndo;
    if (F.flipped && showEn) say(it.term);
  }
  function renderFlashEnd() {
    const still = F.still.slice();
    root.innerHTML = `<div class="qz-wrap">${header('單字卡', true)}
      <div class="qz-card qz-done"><div class="big">${still.length ? '👍' : '🎉'}</div>
        <b>這一輪：會了 ${F.know.length}　還在學 ${still.length}</b>
        <span class="qz-hint">${still.length ? '下一輪只會出還在學的卡' : '這個範圍的卡全部都會了'}</span></div>
      ${still.length ? `<div class="qz-card"><p class="qz-h"><span>還在學的字</span></p><ul class="qz-list">${still.map(id => { const it = BY.get(id); return `<li><b>${esc(it.term)}</b><span>${esc(it.zh)}</span></li>`; }).join('')}</ul></div>` : ''}
      <div class="qz-row">
        ${still.length ? `<button class="qz-primary" type="button" id="qzMore">繼續練還在學的 ${still.length} 張</button>` : ''}
        <button class="qz-btn" type="button" id="qzAllAgain">整個範圍重新洗牌</button>
        <button class="qz-btn" type="button" id="qzToLearn">去學習模式</button>
      </div>
      ${F.hist.length ? '<div class="qz-row"><button class="qz-btn undo" type="button" id="qzUndo" style="flex:0">← 回到最後一張</button></div>' : ''}
    </div>`;
    wireHeader();
    const m = $('#qzMore'); if (m) m.onclick = () => startFlash(shuffle(still));
    $('#qzAllAgain').onclick = () => startFlash(shuffle(poolItems().map(it => it.id)));
    $('#qzToLearn').onclick = () => startLearn();
    const u = $('#qzUndo'); if (u) u.onclick = flashUndo;
  }

  /* ---------- learn ---------- */
  let L = null;
  // 每回合：這批字先全部考選擇題，再全部考拼寫；答錯的字留到下一回合，選擇題錯就下回合再考選擇題，拼寫錯就下回合再考拼寫
  function startLearn() {
    const pool = poolItems(), inPool = new Set(pool.map(it => it.id));
    const carry = (st.carry || []).filter(id => inPool.has(id) && lvl(id) < 2);
    const learning = shuffle(pool.filter(it => lvl(it.id) === 1).map(it => it.id));
    const fresh = shuffle(pool.filter(it => lvl(it.id) === 0).map(it => it.id));
    const pick = [...new Set(carry.concat(learning, fresh))].slice(0, ROUND);
    mode = 'learn';
    if (!pick.length) return renderLearnDone();
    L = { items: pick, phase: 'mc', queue: [], qDone: 0, qTotal: 0, cur: null, state: 'ask', hint: 0 };
    startPhase('mc');
  }
  function startPhase(ph) {
    L.phase = ph;
    L.queue = shuffle(L.items.filter(id => ph === 'mc' ? lvl(id) === 0 : lvl(id) === 1));
    L.qDone = 0; L.qTotal = L.queue.length;
    if (!L.queue.length) { if (ph === 'mc') return startPhase('write'); return renderRoundEnd(); }
    nextQ(true);
  }
  function nextQ(first) {
    if (!first) L.qDone++;
    if (!L.queue.length) { if (L.phase === 'mc') return startPhase('write'); return renderRoundEnd(); }
    L.cur = L.queue.shift(); L.state = 'ask'; L.hint = 0; L.choice = null; L.peek = null; L.typed = ''; L.given = '';
    const it = BY.get(L.cur);
    rollEx(it);
    L.kind = L.phase === 'mc' ? 'mc' : 'write';
    if (L.kind === 'mc') L.opts = buildChoices(it);
    renderLearn();
  }
  // 中文意思重疊檢查：兩個字的中文解釋只要有相同的兩字詞（例如「水槽」「很棒」），就不放在同一題當選項
  const zhBigrams = z => { const out = new Set(); String(z || '').replace(/（[^）]*）|\([^)]*\)/g, '').replace(/[的地得了一個某些著]/g, '').split(/[；、，,／\/\s;=]+/).forEach(seg => { const c = seg.replace(/[^一-鿿]/g, ''); for (let i = 0; i + 1 < c.length; i++) out.add(c.slice(i, i + 2)); if (c.length === 1) out.add(c); }); return out; };
  const zhOverlap = (a, b) => { const A = zhBigrams(a); for (const x of zhBigrams(b)) if (A.has(x)) return true; return false; };
  function buildChoices(it) {
    const key = norm(it.term), seen = new Set([key]);
    const pk = (it.pos || '').replace(/[^a-z]/gi, '').slice(0, 1).toLowerCase();
    const cands = shuffle(A.items.filter(x => !seen.has(norm(x.term))));
    const pref = cands.filter(x => (x.pos || '').replace(/[^a-z]/gi, '').slice(0, 1).toLowerCase() === pk && String(x.g) === String(it.g));
    const pref2 = cands.filter(x => (x.pos || '').replace(/[^a-z]/gi, '').slice(0, 1).toLowerCase() === pk);
    const out = [];
    const zs = [it.zh], ft = t => norm(t).split(' ')[0];
    for (const x of pref.concat(pref2, cands)) {
      const k = norm(x.term); if (seen.has(k)) continue;
      // 不放意思重疊（例如兩個都是「追捕」）或長得像（pursue／pursuit）的選項，免得答對卻被判錯
      if (zs.some(z => zhOverlap(z, x.zh))) continue;
      if ([it.term].concat(out).some(t => ft(t) === ft(x.term) || (ft(t).length >= 5 && ft(x.term).length >= 5 && ft(t).slice(0, 5) === ft(x.term).slice(0, 5)))) continue;
      seen.add(k); out.push(x.term); zs.push(x.zh); if (out.length === 3) break;
    }
    if (out.length < 3) for (const x of cands) { const k = norm(x.term); if (seen.has(k)) continue; seen.add(k); out.push(x.term); if (out.length === 3) break; }
    return shuffle(out.concat([it.term]));
  }
  function setLvl(id, v) { st.m[id] = v; st.mt = st.mt || {}; st.mt[id] = Date.now(); save(); }
  // 每次學習模式的作答都記下來，讓原本測驗模式的熟悉度也跟著調整：選擇題答對 +0.5、拼字答對 +0.8、答錯記 -1（各字最多留 12 筆）
  function learnEvent(id, credit) {
    st.ev = st.ev || {}; const a = st.ev[id] = st.ev[id] || [];
    a.push([Date.now(), credit]); if (a.length > 12) a.splice(0, a.length - 12); save();
  }
  function overall() { return counts(poolItems()); }
  function renderLearn() {
    const it = BY.get(L.cur);
    const phaseName = L.phase === 'mc' ? '第 1 階段・選擇題' : '第 2 階段・拼寫';
    const c = overall();
    let body = '';
    if (L.kind === 'mc') {
      body = `<div class="qz-qlabel">選出正確的英文</div>
        <div class="qz-choices">${L.opts.map((o, k) => {
          let cls = '';
          if (L.state !== 'ask') { if (norm(o) === norm(it.term)) cls = ' ok'; else if (k === L.choice) cls = ' no'; else if (k === L.peek) cls = ' peek'; }
          return `<button type="button" class="qz-choice${cls}" data-k="${k}"><span class="n">${k + 1}</span><span>${esc(o)}</span></button>`;
        }).join('')}</div>${L.state !== 'ask' ? '<p class="peek-hint">點其他選項可以看它的意思</p>' : ''}`;
    } else {
      const hintLine = L.hint ? `<div class="qz-hintline">${esc(it.term.split('').map((ch, i) => (i < L.hint || ch === ' ') ? ch : '_').join(' '))}</div>` : '';
      body = `<div class="qz-qlabel">${L.state === 'retype' ? '把正確答案打一次' : '用英文打出答案'}</div>${hintLine}
        <form class="qz-write" id="qzForm" autocomplete="off"><input id="qzIn" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${L.state === 'retype' ? esc(it.term) : '輸入英文'}" aria-label="輸入英文答案" ${L.state === 'ok' || L.state === 'no' ? 'readonly' : ''} value="${esc(L.typed)}"><button type="submit">${L.state === 'ask' || L.state === 'retype' ? '送出' : '繼續'}</button></form>
        ${L.state === 'ask' ? `<div class="qz-sub"><button class="qz-link" type="button" id="qzHint">提示字母</button><button class="qz-link" type="button" id="qzIdk">不知道</button></div>` : ''}`;
    }
    let fb = '';
    if (L.state === 'ok') fb = `<div class="qz-fb ok">${imgQ(it)}<b>答對了！</b>${answerHTML(it).replace('qz-term', 'ans')}${exFullHTML(it)}</div>`;
    if (L.state === 'no' || L.state === 'retype') fb = `<div class="qz-fb no">${imgQ(it)}<b>${L.kind === 'mc' ? '再想想，正確答案是' : (L.given ? '不太對，正確答案是' : '正確答案是')}</b><div class="ans">${esc(it.term)} ${sayBtn(it.term)}</div>${it.kk ? `<div class="qz-kk">${esc(it.kk)}</div>` : ''}${exFullHTML(it)}${it.note ? `<div class="qz-note">${esc(it.note)}</div>` : ''}${L.kind === 'write' && L.given ? `<div class="qz-hint">你的答案：${esc(L.given)}</div>` : ''}${wrongDef(it)}</div>`;
    fb += peekDef(it);
    let actions = '';
    if (L.state === 'ok' || L.state === 'no') actions = `<div class="qz-sub"><button class="qz-primary" type="button" id="qzNext" style="flex:0;min-width:120px">繼續</button></div>`;
    if (L.state === 'retype' && L.given) actions = `<div class="qz-sub"><button class="qz-btn" type="button" id="qzOverride">我其實答對了</button></div>`;
    root.innerHTML = `<div class="qz-wrap">${header('學習', true)}
      <div class="qz-top"><span class="qz-count">${phaseName}　${Math.min(L.qDone + 1, L.qTotal)} / ${L.qTotal}</span><div class="qz-big"><i class="p" style="width:${(L.qDone / Math.max(1, L.qTotal) * 100).toFixed(1)}%"></i></div></div>
      <div class="qz-card qz-q">
        <div class="qz-hint">${L.kind === 'mc' ? '四選一' : '拼寫'}・${esc(groupName(it.g))}</div>
        ${promptHTML(it)}
        ${body}
        ${fb}
        ${actions}
      </div>
      <div class="qz-stat"><span><i class="qz-dot m"></i>已掌握 ${c.m}</span><span><i class="qz-dot l"></i>學習中 ${c.l}</span><span><i class="qz-dot n"></i>未學 ${c.n}</span></div>
      <p class="qz-keys">${L.kind === 'mc' ? '可按 1–4 作答，Enter 或「繼續」下一題' : 'Enter 送出／繼續'}</p>
    </div>`;
    wireHeader();
    if (L.kind === 'mc') root.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
      const k = +b.dataset.k;
      if (L.state === 'ask') return answerMC(k);
      if (norm(L.opts[k]) === norm(it.term) || k === L.choice) return;   // 正解和你選的已經顯示了
      L.peek = L.peek === k ? null : k; renderLearn();
    });
    const f = $('#qzForm');
    if (f) {
      const inp = $('#qzIn');
      f.onsubmit = e => { e.preventDefault(); if (L.state === 'ask') answerWrite(inp.value); else if (L.state === 'retype') retype(inp.value); else nextQ(); };
      if (L.state === 'ask' || L.state === 'retype') { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
      const h = $('#qzHint'); if (h) h.onclick = () => { L.hint = Math.min(L.hint + 1, it.term.length - 1); L.typed = $('#qzIn').value; renderLearn(); };
      const k = $('#qzIdk'); if (k) k.onclick = () => answerWrite('');
    }
    const n = $('#qzNext'); if (n) { n.onclick = () => nextQ(); if (!f || L.state !== 'retype') n.focus(); }
    const o = $('#qzOverride'); if (o) o.onclick = () => { const e = st.ev && st.ev[L.cur]; if (e && e.length && e[e.length - 1][1] < 0) e.pop(); setLvl(L.cur, 2); learnEvent(L.cur, 0.8); nextQ(); };
  }
  function answerMC(k) {
    const it = BY.get(L.cur);
    L.choice = k;
    if (norm(L.opts[k]) === norm(it.term)) {
      L.state = 'ok'; setLvl(it.id, Math.max(lvl(it.id), 1)); learnEvent(it.id, 0.5);
      renderLearn(); famCheer.hit(root.querySelector('.qz-choice.ok')); setTimeout(() => say(it.term), 700);
    } else {
      L.state = 'no'; learnEvent(it.id, -1); renderLearn(); famCheer.miss();
    }
  }
  function answerWrite(v) {
    const it = BY.get(L.cur);
    L.typed = v.trim();
    if (L.typed && isRight(it, L.typed)) {
      L.state = 'ok'; setLvl(it.id, 2); learnEvent(it.id, 0.8); renderLearn(); famCheer.hit(root.querySelector('#qzIn')); setTimeout(() => say(it.term), 700);
    } else {
      famCheer.miss(); learnEvent(it.id, -1); L.state = 'retype'; L.given = L.typed; L.typed = ''; renderLearn();
    }
  }
  function retype(v) {
    const it = BY.get(L.cur);
    if (isRight(it, v)) nextQ();
    else { const inp = $('#qzIn'); inp.classList.add('no'); inp.value = ''; inp.placeholder = it.term; inp.focus(); }
  }
  function renderRoundEnd() {
    st.carry = L.items.filter(id => lvl(id) < 2); save();
    const c = overall();
    const rows = L.items.map(id => { const it = BY.get(id), v = lvl(id); return `<li><b>${esc(it.term)}</b><span>${esc(it.zh)}</span><span class="r ${v >= 2 ? 'm' : 'l'}">${v >= 2 ? '已掌握' : v === 1 ? '下回合考拼寫' : '下回合考選擇題'}</span></li>`; }).join('');
    const left = c.t - c.m;
    root.innerHTML = `<div class="qz-wrap">${header('學習', true)}
      <div class="qz-card qz-done"><div class="big">💪</div><b>這回合結束</b><span class="qz-hint">整個範圍：已掌握 ${c.m} / ${c.t}</span>${bar(c, ' style="width:100%"')}</div>
      <div class="qz-card"><p class="qz-h"><span>這回合的字</span></p><ul class="qz-list">${rows}</ul></div>
      <div class="qz-row">${left ? '<button class="qz-primary" type="button" id="qzGo">下一回合</button>' : ''}<button class="qz-btn" type="button" id="qzFc">用單字卡複習</button></div>
    </div>`;
    wireHeader();
    const g = $('#qzGo'); if (g) { g.onclick = startLearn; g.focus(); } else renderLearnDone();
    $('#qzFc').onclick = () => startFlash(shuffle(L.items));
  }
  function renderLearnDone() {
    const pool = poolItems();
    root.innerHTML = `<div class="qz-wrap">${header('學習', true)}
      <div class="qz-card qz-done"><div class="big">🎉</div><b>這個範圍的 ${pool.length} 個字全部掌握了</b><span class="qz-hint">可以換別的範圍，或重新學一次加深印象</span></div>
      <div class="qz-row"><button class="qz-primary" type="button" id="qzAgain">重新學一次</button><button class="qz-btn" type="button" id="qzHome">換範圍</button></div>
    </div>`;
    wireHeader();
    $('#qzAgain').onclick = () => { pool.forEach(it => delete st.m[it.id]); save(); startLearn(); };
    $('#qzHome').onclick = renderHome;
  }

  /* ---------- keyboard ---------- */
  document.addEventListener('keydown', e => {
    if (root.hidden) return;
    if (e.key === 'Escape') { close(); return; }
    const typing = e.target && e.target.tagName === 'INPUT';
    if (mode === 'flash' && F && F.i < F.deck.length && !typing) {
      if (e.key === ' ') { e.preventDefault(); F.flipped = !F.flipped; renderFlash(); }
      else if (e.key === 'ArrowRight') flashSort(true);
      else if (e.key === 'ArrowLeft') flashSort(false);
    } else if (mode === 'learn' && L && !typing) {
      if (L.kind === 'mc' && L.state === 'ask' && /^[1-4]$/.test(e.key)) answerMC(+e.key - 1);
      else if ((L.state === 'ok' || L.state === 'no') && e.key === 'Enter') { e.preventDefault(); nextQ(); }
    }
  });

  /* ---------- entry button ---------- */
  const anchor = document.querySelector(A.anchor || '.study-toggle-btn');
  if (anchor) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = (anchor.className || '').replace(/\bactive\b/, '') + ' qz-entry'; b.id = 'qzOpen';
    b.innerHTML = '<span>單字卡／學習</span><span class="qz-entry-sub">（Quizlet 式）</span>';
    b.onclick = open;
    anchor.insertAdjacentElement('afterend', b);
  }
  window.QZ = { open, maskZh, items: A.items, dbg: () => ({ L, F, st, BY }) };   // dbg：自動測試用（唯讀）
})();
</script>

<div class="pwa-toast" id="pwaToast" hidden></div>
<script>
(function () {
  const toast = msg => { const t = document.getElementById("pwaToast"); t.textContent = msg; t.hidden = false; setTimeout(() => t.hidden = true, 4000); };
  const footer = document.querySelector(".sidebar-footer") || document.getElementById("footer");
  const status = document.createElement("span"); status.className = "pwa-status";
  if (footer) footer.appendChild(status);
  const paint = () => status.textContent = navigator.onLine ? "已連線 · 會自動抓新版" : "離線中 · 使用已存的版本";
  paint(); addEventListener("online", paint); addEventListener("offline", paint);
  if (!("serviceWorker" in navigator) || location.protocol === "file:") return;
  let had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").then(reg => {
    const check = () => reg.update().catch(() => {});
    addEventListener("online", check);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });
  });
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!had) { had = true; return; }
    toast("有新版本，下次打開就會是最新的");
  });
})();
</script>
