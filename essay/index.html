</head><body>
<title>學測作文單字庫</title>
<style>
:root {
  --bg: #eef1f3;
  --surface: #ffffff;
  --surface-2: #f5f7f8;
  --ink: #1c2430;
  --ink-soft: #56606d;
  --ink-faint: #8993a1;
  --accent: #2f5d8a;
  --accent-strong: #1f4569;
  --accent-soft: #dce8f2;
  --gold: #a8781f;
  --gold-soft: #f3e6cd;
  --border: #dde2e6;
  --shadow: 0 1px 2px rgba(28,36,48,0.06), 0 8px 24px -12px rgba(28,36,48,0.12);
  --pos-v: #2f5d8a;      --pos-v-bg: #dce8f2;
  --pos-adj: #3f7a4e;    --pos-adj-bg: #dcefe0;
  --pos-adv: #6a4c93;    --pos-adv-bg: #e7dff2;
  --pos-n: #a8781f;      --pos-n-bg: #f3e6cd;
  --pos-phrase: #1f7a72; --pos-phrase-bg: #dbefec;
  --pos-default: #56606d; --pos-default-bg: #e7eaed;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161b;
    --surface: #1a1f26;
    --surface-2: #20262e;
    --ink: #e7eaee;
    --ink-soft: #a3adb8;
    --ink-faint: #6d7885;
    --accent: #7db1e0;
    --accent-strong: #9cc6ec;
    --accent-soft: #223447;
    --gold: #e0b768;
    --gold-soft: #3a3018;
    --border: #2b323b;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    --pos-v: #7db1e0;      --pos-v-bg: #1f3348;
    --pos-adj: #8fca9d;    --pos-adj-bg: #1e3324;
    --pos-adv: #b9a0dd;    --pos-adv-bg: #2c2440;
    --pos-n: #e0b768;      --pos-n-bg: #3a3018;
    --pos-phrase: #7fd0c6; --pos-phrase-bg: #1a3532;
    --pos-default: #a3adb8; --pos-default-bg: #262c34;
  }
}
:root[data-theme="dark"] {
  --bg: #12161b;
  --surface: #1a1f26;
  --surface-2: #20262e;
  --ink: #e7eaee;
  --ink-soft: #a3adb8;
  --ink-faint: #6d7885;
  --accent: #7db1e0;
  --accent-strong: #9cc6ec;
  --accent-soft: #223447;
  --gold: #e0b768;
  --gold-soft: #3a3018;
  --border: #2b323b;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  --pos-v: #7db1e0;      --pos-v-bg: #1f3348;
  --pos-adj: #8fca9d;    --pos-adj-bg: #1e3324;
  --pos-adv: #b9a0dd;    --pos-adv-bg: #2c2440;
  --pos-n: #e0b768;      --pos-n-bg: #3a3018;
  --pos-phrase: #7fd0c6; --pos-phrase-bg: #1a3532;
  --pos-default: #a3adb8; --pos-default-bg: #262c34;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Noto Sans TC", "Noto Sans", system-ui, sans-serif;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, .display {
  font-family: "Noto Serif TC", "Noto Serif", serif;
  text-wrap: balance;
}
::selection { background: var(--accent-soft); }

.layout {
  display: flex;
  min-height: 100vh;
}

/* ---- Sidebar ---- */
.sidebar {
  width: 280px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 20px 16px;
  gap: 16px;
  overflow: hidden;
  transition: width 0.22s ease, padding 0.22s ease, opacity 0.15s ease, border-color 0.22s ease;
}
.sidebar.collapsed {
  width: 0;
  padding-left: 0;
  padding-right: 0;
  border-right-color: transparent;
  opacity: 0;
  pointer-events: none;
}
.sidebar-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}
.sidebar-title {
  font-size: 1.05rem;
  line-height: 1.3;
  font-weight: 700;
  color: var(--ink);
  margin: 0;
  padding: 0 4px;
  white-space: nowrap;
}
.sidebar-sub {
  font-size: 0.75rem;
  line-height: 1.3;
  color: var(--ink-faint);
  padding: 0 4px;
  margin-top: 2px;
  white-space: nowrap;
}
.icon-btn {
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--ink-soft);
  cursor: pointer;
  padding: 0;
}
.icon-btn:hover { background: var(--accent-soft); color: var(--accent-strong); }
.icon-btn svg { width: 15px; height: 15px; }
.expand-fab {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 40;
  width: 38px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink-soft);
  box-shadow: var(--shadow);
  cursor: pointer;
}
.expand-fab:hover { color: var(--accent-strong); }
.expand-fab svg { width: 17px; height: 17px; }
.expand-fab[hidden] { display: none; }
.search-box {
  position: relative;
}
.search-box input {
  width: 100%;
  padding: 10px 30px 10px 34px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--ink);
  font-size: 0.9rem;
  font-family: inherit;
}
.search-box input:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
.search-box input:focus + .search-kbd { display: none; }
.search-box svg {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  width: 15px;
  height: 15px;
  color: var(--ink-faint);
  pointer-events: none;
}
.search-kbd {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  font-family: inherit;
  font-size: 0.7rem;
  color: var(--ink-faint);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 1px 6px;
  pointer-events: none;
}
.result-count {
  margin: -8px 4px 0;
  font-size: 0.72rem;
  color: var(--accent);
  min-height: 1em;
}
mark {
  background: var(--gold-soft);
  color: var(--ink);
  border-radius: 3px;
  padding: 0 1px;
}
.nav-list {
  list-style: none;
  margin: 0;
  padding: 0;
  overflow-y: auto;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.nav-list a {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  color: var(--ink-soft);
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 0.85rem;
  transition: background 0.12s ease, color 0.12s ease;
}
.nav-list a:hover { background: var(--surface-2); color: var(--ink); }
.nav-list a.active { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
.nav-count {
  font-size: 0.72rem;
  color: var(--ink-faint);
  background: var(--surface-2);
  border-radius: 999px;
  padding: 1px 7px;
  font-variant-numeric: tabular-nums;
}
.nav-list a.active .nav-count { background: var(--surface); }

.sidebar-footer {
  font-size: 0.72rem;
  color: var(--ink-faint);
  padding: 8px 4px 0;
  border-top: 1px solid var(--border);
}

/* ---- Main ---- */
.main {
  flex: 1;
  min-width: 0;
  padding: 40px clamp(20px, 4vw, 56px) 80px;
  max-width: 980px;
  transition: max-width 0.22s ease;
}
body.sidebar-collapsed .main {
  max-width: 1240px;
}
.hero {
  margin-bottom: 36px;
}
.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--gold);
  background: var(--gold-soft);
  padding: 4px 10px;
  border-radius: 999px;
  margin-bottom: 14px;
  font-family: "Noto Sans TC", sans-serif;
  font-weight: 600;
}
.hero h1 {
  font-size: clamp(1.5rem, 3vw, 2.1rem);
  margin: 0 0 10px;
  color: var(--ink);
  font-weight: 700;
}
.hero-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 20px;
  font-size: 0.85rem;
  color: var(--ink-soft);
  margin-bottom: 10px;
}
.hero-meta strong { color: var(--ink); font-weight: 600; }
.hero-note {
  font-size: 0.82rem;
  color: var(--ink-faint);
  border-left: 3px solid var(--border);
  padding-left: 12px;
  margin-top: 14px;
}

.category {
  margin-bottom: 44px;
  scroll-margin-top: 20px;
}
.category-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.category-num {
  font-family: "Noto Serif TC", serif;
  font-size: 0.85rem;
  color: var(--ink-faint);
}
.category h2 {
  font-size: 1.15rem;
  margin: 0;
  color: var(--ink);
  font-weight: 700;
}
.category-count {
  font-size: 0.72rem;
  color: var(--ink-faint);
  background: var(--surface-2);
  border-radius: 999px;
  padding: 2px 9px;
  font-variant-numeric: tabular-nums;
}

.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  box-shadow: var(--shadow);
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.88rem;
  min-width: 760px;
}
thead th {
  text-align: left;
  font-size: 0.72rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-faint);
  font-weight: 600;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-2);
  white-space: nowrap;
}
tbody td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
  color: var(--ink-soft);
}
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--surface-2); }
td.word {
  color: var(--ink);
  font-weight: 600;
  white-space: nowrap;
}
td.zh { white-space: nowrap; }
td.kk {
  color: var(--accent);
  font-family: "Noto Sans TC", "Doulos SIL", "Charis SIL", "Segoe UI", sans-serif;
  white-space: nowrap;
  font-size: 0.85rem;
}
td.example { font-style: italic; color: var(--ink-soft); min-width: 220px; }
td.colloc { color: var(--ink-faint); font-size: 0.83rem; }
td.colloc:empty::after { content: "—"; color: var(--border); font-style: normal; }
.speak-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  padding: 0;
  border: none;
  background: none;
  cursor: pointer;
  font-size: 0.85rem;
  color: var(--accent);
  opacity: 0.75;
  vertical-align: middle;
  border-radius: 6px;
}
.speak-btn:hover { opacity: 1; background: var(--accent-soft); }
.speak-btn.speak-btn-sm { font-size: 0.75rem; width: 18px; height: 18px; opacity: 0.55; }
.pos-tag {
  display: inline-block;
  font-size: 0.72rem;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 999px;
  white-space: nowrap;
  font-family: "Noto Sans TC", sans-serif;
}

/* Sentence bank */
.sentence-grid {
  display: grid;
  gap: 14px;
}
.sentence-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px 20px;
  box-shadow: var(--shadow);
}
.sentence-en {
  font-family: "Source Serif 4", "Noto Serif TC", serif;
  font-style: italic;
  font-size: 1.02rem;
  color: var(--ink);
  margin: 0 0 8px;
  line-height: 1.55;
}
.sentence-zh {
  font-size: 0.87rem;
  color: var(--ink-soft);
  margin: 0;
}

.empty-state {
  text-align: center;
  color: var(--ink-faint);
  padding: 60px 20px;
  font-size: 0.9rem;
  display: none;
}
.hidden { display: none !important; }

@media (max-width: 860px) {
  .layout { flex-direction: column; }
  .sidebar {
    width: 100%;
    height: auto;
    position: relative;
    border-right: none;
    border-bottom: 1px solid var(--border);
  }
  .nav-list { max-height: 200px; }
  .main { padding: 28px 18px 60px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* ---- Study mode toggle (sidebar) ---- */
.study-toggle-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  width: 100%;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--accent);
  background: var(--accent-soft);
  color: var(--accent-strong);
  font-family: "Noto Sans TC", sans-serif;
  font-size: 0.86rem;
  font-weight: 700;
  cursor: pointer;
}
.study-toggle-btn:hover { background: var(--accent); color: #fff; }
.study-toggle-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
.study-toggle-btn.active { background: var(--ink); border-color: var(--ink); color: var(--surface); }

/* ---- Study view shell ---- */
#studyView { max-width: 720px; }
.study-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: var(--shadow);
  padding: 22px clamp(16px, 3vw, 28px);
  margin-bottom: 20px;
}
.study-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 22px;
}
.study-head h2 {
  font-size: 1.3rem;
  margin: 0;
  color: var(--ink);
}
.study-back-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 0.8rem;
  color: var(--ink-soft);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 6px 13px;
  cursor: pointer;
  font-family: "Noto Sans TC", sans-serif;
}
.study-back-btn:hover { color: var(--accent-strong); border-color: var(--accent); }

.study-section { margin-bottom: 22px; }
.study-section:last-child { margin-bottom: 0; }
.study-section-title {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--ink-soft);
  margin: 0 0 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.study-section-title .mini-btn {
  font-size: 0.72rem;
  font-weight: 500;
  color: var(--accent);
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
}

.chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.82rem;
  padding: 7px 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--ink-soft);
  cursor: pointer;
  user-select: none;
  font-family: "Noto Sans TC", sans-serif;
}
.chip input { display: none; }
.chip.checked {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent-strong);
  font-weight: 600;
}
.chip .chip-count {
  font-size: 0.7rem;
  color: var(--ink-faint);
  background: var(--surface);
  border-radius: 999px;
  padding: 0 6px;
}
.chip.checked .chip-count { color: var(--accent-strong); }
.chip.disabled { opacity: 0.4; cursor: not-allowed; }

.radio-group { display: flex; flex-wrap: wrap; gap: 8px; }
.radio-pill {
  flex: 1;
  min-width: 130px;
  text-align: center;
  font-size: 0.83rem;
  padding: 10px 10px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--ink-soft);
  cursor: pointer;
  font-family: "Noto Sans TC", sans-serif;
}
.radio-pill input { display: none; }
.radio-pill.checked {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent-strong);
  font-weight: 700;
}
.radio-pill .pill-desc {
  display: block;
  font-size: 0.7rem;
  color: var(--ink-faint);
  font-weight: 400;
  margin-top: 2px;
}
.radio-pill.checked .pill-desc { color: var(--accent-strong); opacity: 0.85; }

.custom-count-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
}
.custom-count-row input {
  width: 100px;
  padding: 9px 12px;
  border-radius: 10px;
  border: 1px solid var(--accent);
  background: var(--accent-soft);
  color: var(--ink);
  font-size: 0.9rem;
  font-family: inherit;
}
.custom-count-row input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.custom-count-suffix { font-size: 0.82rem; color: var(--ink-soft); }

.study-pool-hint {
  font-size: 0.8rem;
  color: var(--ink-faint);
  margin: 4px 0 0;
}
.study-pool-hint strong { color: var(--accent-strong); }

.study-start-btn {
  width: 100%;
  padding: 13px;
  border-radius: 12px;
  border: none;
  background: var(--accent-strong);
  color: #fff;
  font-size: 0.95rem;
  font-weight: 700;
  font-family: "Noto Sans TC", sans-serif;
  cursor: pointer;
  margin-top: 6px;
}
.study-start-btn:hover { background: var(--accent); }
.study-start-btn:disabled { background: var(--border); color: var(--ink-faint); cursor: not-allowed; }

.study-reset-link {
  display: inline-block;
  margin-top: 14px;
  font-size: 0.75rem;
  color: var(--ink-faint);
  background: none;
  border: none;
  text-decoration: underline;
  cursor: pointer;
  padding: 0;
}

/* ---- Drill screen ---- */
.drill-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}
.drill-progress-text {
  font-size: 0.82rem;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.progress-track {
  flex: 1;
  height: 6px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 999px;
  transition: width 0.25s ease;
}
.drill-exit-btn {
  font-size: 0.78rem;
  color: var(--ink-faint);
  background: none;
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 5px 12px;
  cursor: pointer;
  white-space: nowrap;
}
.drill-exit-btn:hover { color: var(--accent-strong); border-color: var(--accent); }

.drill-mode-badge {
  display: inline-block;
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--gold);
  background: var(--gold-soft);
  border-radius: 999px;
  padding: 3px 10px;
  margin-bottom: 14px;
}

.flashcard {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: var(--shadow);
  min-height: 260px;

 creeping fear（漸生的恐懼）", "小男孩半夜躡手躡腳地溜進廚房，想偷吃一塊巧克力蛋糕。"], ["stumble", "/ˋstʌmbl/", "v.", "絆倒", "Looking at his phone while walking, he stumbled over a rock and nearly fell down.", "stumble over/upon + N／stumble across（無意間發現）", "他邊走邊看手機，被一塊石頭絆了一下，差點跌倒。"], ["stagger", "/ˋstægɚ/", "v.", "蹣跚", "Exhausted and dehydrated, the runner staggered to the finish line and collapsed.", "stagger to/toward + 地點／a staggering amount（誇飾：驚人的數量）", "筋疲力盡又脫水的跑者踉踉蹌蹌地走到終點線，隨即倒下。"], ["yank", "/jæŋk/", "v.", "猛拉", "Hearing his mother scream, he yanked the door open and rushed into the kitchen.", "yank + N + open/away／yank on the rope", "聽到媽媽的尖叫聲，他猛地拉開門衝進廚房。"], ["shove", "/ʃʌv/", "v.", "推", "The firefighter shoved the door open and pulled the old man out of the smoke-filled room.", "shove + N + open/aside／shove one's way through（強行擠過）", "消防員用力推開門，把老先生從滿是濃煙的房間拉出來。"], ["fling", "/flɪŋ/", "v.", "用力丟", "Furious about her low score, she crumpled the test paper and flung it into the trash can.", "fling + N + open/away/across the room", "她對自己的低分很生氣，把考卷揉成一團甩進垃圾桶。"], ["withdraw", "/wɪðˋdrɔ/", "v.", "撤回；退出", "He withdrew from the competition after injuring his knee during practice.", "withdraw from + N／withdraw money/support", "他在練習時弄傷了膝蓋，於是退出了比賽。"], ["devour", "/dɪˋvaʊɚ/", "v.", "狼吞虎嚥；沉迷閱讀", "She devoured the mystery novel in one night, unable to put it down until she found out who the killer was.", "devour a book/meal（廢寢忘食地讀/吃）", "她一個晚上就把那本推理小說看完，不知道兇手是誰之前根本放不下。"], ["gorge", "/gɔrdʒ/", "v.", "暴食", "After the final exam, we gorged ourselves on fried chicken and bubble tea to celebrate.", "gorge on/oneself on + food（語氣比 devour 更負面）", "期末考結束後，我們狂吃炸雞、狂喝珍奶來慶祝。"], ["sip", "/sɪp/", "v.", "啜飲", "Sitting by the window on a rainy afternoon, she slowly sipped her hot tea and read a novel.", "sip on + 飲料／take a sip of（與 gorge/devour 的『大口』相反，強調小口慢飲）", "下雨的午後，她坐在窗邊，慢慢啜飲熱茶、看著小說。"], ["sprint", "/sprɪnt/", "v.", "衝刺；全力奔跑", "With only ten meters left, he sprinted toward the finish line and won by a hair.", "sprint toward/for + 地點／a final sprint", "只剩十公尺時，他朝終點線衝刺，以些微之差獲勝。"], ["tiptoe", "/ˋtɪpto/", "v.", "踮腳走", "She tiptoed past the sleeping baby, careful not to make a single sound.", "tiptoe into/past/around + N（強調不出聲）", "她踮著腳尖走過熟睡的嬰兒身邊，小心不發出任何聲音。"], ["trudge", "/trʌdʒ/", "v.", "拖著沉重步伐走", "The hikers trudged through the deep snow for hours before they finally reached the cabin.", "trudge through/along + 地點（強調疲憊、吃力）", "登山客在深雪中艱難地跋涉了好幾個小時，才終於抵達小屋。"], ["plod", "/plɑd/", "v.", "跋涉；緩慢沉重地走", "The old man plodded up the hill.", "plod along/through/up + 地點（比 trudge 更強調緩慢單調）", "老人步履沉重地走上山坡。"], ["gulp", "/gʌlp/", "v.", "大口喝；（緊張地）吞嚥", "He gulped down his water after the race.", "gulp down + 飲料（大口喝）／gulp air／let out a gulp（緊張吞嚥一下，名詞用法，語氣近 swallow hard）", "比賽後他大口灌下水。"], ["trek", "/trɛk/", "v./n.", "跋涉；長途跋涉旅行", "They trekked through the mountains for three days.", "trek through/across + 地點／go on a trek（當名詞：一趟長途跋涉的旅程）", "他們在山裡健行了三天。"], ["expedition", "/ɛkspɪˋdɪʃən/", "n.", "遠征；探險（隊）", "The team organized an expedition to the South Pole.", "go on/lead an expedition to + 地點（純名詞，常與 trek 搭配描述冒險旅程；此類雖名為『動詞』，此字例外收錄於此以便主題配對）", "團隊組織了一支前往南極的探險隊。"], ["storm out / into", "/stɔrm/", "phrasal verb", "氣沖沖地衝出去／闖進", "After the argument, she stormed out of the room and slammed the door.", "storm out of + 地點（氣沖沖地離開）／storm into + 地點（怒氣沖沖地闖進）；比 rush、dash 多了「憤怒」的情緒，敘事文描寫衝突場面很生動", "吵完架後，她氣沖沖地衝出房間，用力甩上門。"]]}, {"name": "2. Body Language（肢體與細微動作）", "rows": [["glance", "/glæns/", "v.", "瞥一眼", "During the meeting, she kept glancing at her phone to see if her mother had replied.", "glance at/over/through + N／a quick glance", "開會時，她一直瞄手機，看媽媽有沒有回訊息。"], ["stare", "/stɛr/", "v.", "盯著看", "He stared at the screen for a long time, unable to believe that he had won first prize.", "stare at + N／stare blankly into space", "他盯著螢幕看了很久，不敢相信自己得了第一名。"], ["nod", "/nɑd/", "v.", "點頭", "When I suggested going to the beach, everyone nodded in agreement and started packing.", "nod in agreement/approval／nod off（打瞌睡）", "我提議去海邊時，大家都點頭同意，開始收拾行李。"], ["shrug", "/ʃrʌg/", "v.", "聳肩", "When I asked him why he was late again, he simply shrugged and walked away.", "shrug one's shoulders／shrug off + criticism（不以為意）", "我問他為什麼又遲到時，他只是聳聳肩就走開了。"], ["tap", "/tæp/", "v.", "輕敲", "Waiting for his name to be called, he nervously tapped his fingers on the desk.", "tap on/at + N／tap one's foot", "他等著被叫到名字時，緊張地用手指輕敲桌面。"], ["grip", "/grɪp/", "v.", "緊握", "As the roller coaster climbed to the top, she gripped the handle tightly and closed her eyes.", "grip + N + tightly／a firm grip on", "雲霄飛車爬到最高點時，她緊緊握住把手、閉上眼睛。"], ["clutch", "/klʌtʃ/", "v.", "抓緊", "She clutched her bag tightly as she walked through the dark alley alone.", "clutch at/onto + N／clutch one's chest（強調驚恐/緊張地抓）", "她獨自走過那條黑暗的小巷時，緊緊抓著自己的包包。"], ["tremble", "/ˋtrɛmbl/", "v.", "發抖", "His hands trembled as he opened the envelope containing his exam results.", "tremble with fear/excitement／one's voice trembled", "他打開裝著考試成績的信封時，雙手不停地發抖。"], ["fidget", "/ˋfɪdʒɪt/", "v.", "坐立不安", "The little boy fidgeted in his seat, eager for the bell to ring so he could go out and play.", "fidget with + N（把玩小物）／fidget nervously", "小男孩在座位上坐立不安，巴不得鐘聲趕快響起好出去玩。"], ["lean", "/lin/", "v.", "倚靠", "Exhausted after the long run, she leaned against the wall to catch her breath.", "lean against/on/over + N", "長跑完筋疲力盡的她，靠在牆上喘口氣。"], ["perspire", "/pɚˋspaɪr/", "v.", "流汗；出汗", "He was perspiring heavily after the intense workout.", "perspire heavily/profusely（比 sweat 正式、書面）", "激烈運動後他大量流汗。"], ["clench", "/klɛntʃ/", "v.", "握緊；咬緊", "He clenched his fists in anger when he saw the bully pushing his little brother.", "clench one's fist/teeth/jaw（常表憤怒或忍耐）", "看到惡霸推他弟弟時，他氣得握緊拳頭。"], ["flinch", "/flɪntʃ/", "v.", "畏縮；退縮", "She flinched at the loud noise of the firecrackers outside her window.", "flinch at + N／without flinching（毫不退縮）", "窗外鞭炮的巨響讓她嚇得縮了一下。"], ["twitch", "/twɪtʃ/", "v.", "抽動", "His left eyebrow twitched nervously as the teacher read out the exam scores one by one.", "one's + 身體部位 + twitched（不自主抽動）", "老師一個個念出考試成績時，他的左眉緊張地抽動著。"], ["acrobatic", "/ækrəˋbætɪk/", "adj.", "雜技般的；靈活敏捷的", "The gymnast performed an acrobatic flip that amazed the audience.", "an acrobatic move/leap/performance（形容『技巧高超、如雜技般』的身體動作，比 agile/nimble 更誇張生動）", "那位體操選手做了一個驚人的空翻，讓觀眾歎為觀止。"], ["yawn", "/jɔn/", "v.", "打哈欠", "He let out a loud yawn during the boring lecture, unable to hide his exhaustion.", "let out a yawn／stifle a yawn（強忍住哈欠）；也可作名詞 a yawn", "在無聊的課堂上他打了個大哈欠，藏不住疲憊。"]]}, {"name": "3. Emotion, Sound & Mental Verbs（情緒、聲音與心理動詞）", "rows": [["sigh", "/saɪ/", "v.", "嘆氣", "She sighed with relief when the doctor told her that her father would be fine.", "sigh with relief/frustration／heave a sigh", "醫生告訴她父親會沒事時，她鬆了一口氣。"], ["hesitate", "/ˋhɛzətet/", "v.", "猶豫", "He hesitated for a moment before admitting that he had broken the vase.", "hesitate to V／without hesitation", "他猶豫了一下，才承認花瓶是他打破的。"], ["frown", "/fraʊn/", "v.", "皺眉", "The teacher frowned when she noticed that half of the class had not done their homework.", "frown at/upon + N／frown in disapproval", "老師發現全班有一半的人沒寫作業時，皺起了眉頭。"], ["grin", "/grɪn/", "v.", "咧嘴笑", "He grinned from ear to ear when he heard that he had been accepted by his dream school.", "grin from ear to ear／grin at + N", "聽到自己被夢想的學校錄取時，他笑得合不攏嘴。"], ["murmur", "/ˋmɝmɚ/", "v.", "低聲說", "\"Don't worry, everything will be fine,\" she murmured as she held her crying son.", "murmur to oneself／a murmur of agreement", "她抱著哭泣的兒子，低聲說：「別擔心，一切都會沒事的。」"], ["whisper", "/ˋhwɪspɚ/", "v.", "耳語", "During the movie, two girls behind me kept whispering to each other, which annoyed everyone.", "whisper to + N／whisper in one's ear", "看電影時，我後面的兩個女生一直交頭接耳，惹得大家都很不耐煩。"], ["gasp", "/gæsp/", "v.", "倒吸氣", "The audience gasped in horror as the acrobat slipped and nearly fell from the rope.", "gasp in shock/surprise／gasp for air（喘氣）", "特技演員腳一滑、差點從繩索上摔下來時，觀眾驚恐地倒抽一口氣。"], ["groan", "/gron/", "v.", "呻吟；哀嘆（表不滿）", "Students groaned when extra homework was assigned.", "groan with pain／groan in protest（並非開口『抱怨』，而是發出不滿的哀嘆聲）", "多出作業時學生們哀嚎連連。"], ["chuckle", "/ˋtʃʌkl/", "v.", "輕笑", "Grandpa chuckled at the joke even though he had heard it a hundred times.", "chuckle to oneself／chuckle at + N（比 laugh 輕、比 grin 多了聲音）", "即使那個笑話已經聽了一百遍，爺爺還是咯咯地笑了。"], ["glare", "/glɛr/", "v.", "怒視", "She glared at her brother when he told everyone her embarrassing secret.", "glare at + N／a hostile glare", "弟弟把她的糗事告訴大家時，她狠狠地瞪著他。"], ["gossip", "/ˋgɑsɪp/", "v./n.", "聊八卦；八卦", "They loved to gossip about their classmates.", "gossip about + N／a piece of gossip", "他們很愛聊同學的八卦。"], ["procrastinate", "/proˋkræstənet/", "v.", "拖延；拖拖拉拉", "Stop procrastinating and start writing your essay.", "procrastinate on/about + N", "別再拖延了，開始寫你的作文吧。"], ["rehabilitate", "/riəˋbɪlətet/", "v.", "復原；康復；改過自新", "The center helps injured athletes rehabilitate so that they can return to competition safely.", "rehabilitate + offenders/patients（常用於機構『幫助…康復』）", "這個中心幫助受傷的運動員復健，讓他們能安全地重返賽場。"], ["ponder", "/ˋpɑndɚ/", "v.", "沉思；仔細考慮", "She pondered the question for a while.", "ponder over/on + N（比 think 正式、深入）", "她思考這個問題好一陣子。"], ["reminisce", "/rɛməˋnɪs/", "v.", "回想；追憶", "At the class reunion, we reminisced about our school days and laughed until midnight.", "reminisce about + N（帶懷舊情感）", "同學會上，我們聊起學生時代的往事，一直笑到半夜。"], ["dread", "/drɛd/", "v.", "害怕；恐懼", "He dreads speaking in public so much that his hands shake whenever he holds a microphone.", "dread + Ving／dread the thought of + N", "他非常害怕公開演講，每次拿起麥克風手就會發抖。"], ["scruple", "/ˋskrupl/", "n./v.", "顧忌；良心不安（常用複數 scruples）；對……感到遲疑", "He had no scruples about lying to protect his own interests.", "have no scruples about + Ving（毫無顧忌地做某事，常用於批判不道德行為）", "為了保護自己的利益，他說謊毫無顧忌。"], ["remorse", "/rɪˋmɔrs/", "n.", "懊悔；悔恨（比 regret 更強烈，常帶有罪惡感）", "He was filled with remorse after realizing how his words had hurt his best friend.", "feel/show remorse for + N／be filled with remorse（語氣比 regret 更沉重，常暗示『良心不安』）", "發現自己的話傷了最好的朋友後，他滿心懊悔。"]]}, {"name": "4. Emotion & Character Adjectives（情緒與人格特質形容詞）", "rows": [["sentimental", "/sɛntəˋmɛntl/", "adj.", "感傷的", "Looking through her grandmother's old letters, she felt sentimental and couldn't hold back her tears.", "feel sentimental about + N", "翻閱祖母的舊信件時，她感傷得忍不住落淚。"], ["eager", "/ˋigɚ/", "adj.", "渴望的", "The students were eager to learn more after the scientist's exciting talk about space.", "be eager to V／eager for + N", "聽完科學家精彩的太空演講後，學生們渴望知道更多。"], ["fond", "/fɑnd/", "adj.", "喜愛的", "She has been fond of classical music ever since her grandmother took her to a concert.", "be fond of + N", "自從祖母帶她去聽了一場音樂會，她就一直很喜歡古典音樂。"], ["jubilant", "/ˋdʒublənt/", "adj.", "歡欣鼓舞的", "The crowd was jubilant after the victory.", "jubilant about/at + N", "勝利後群眾歡欣鼓舞。"], ["overwhelmed", "/ovɚˋhwɛlmd/", "adj.", "不知所措的；被壓垮的", "She felt overwhelmed by the amount of homework.", "be overwhelmed by/with + N（注意與 overwhelming 不同：這個字描述『人的感受』）", "大量的作業讓她喘不過氣。"], ["anxious", "/ˋæŋkʃəs/", "adj.", "焦慮的", "He was anxious about the upcoming exam.", "be anxious about + N／anxious to V", "他對即將到來的考試感到焦慮。"], ["nostalgic", "/nɑsˋtældʒɪk/", "adj.", "懷舊的", "Looking at the old photos of her childhood home, she felt nostalgic for the simple days of the past.", "feel nostalgic about/for + N", "看著童年老家的舊照片，她懷念起過去那段單純的日子。"], ["relieved", "/rɪˋlivd/", "adj.", "鬆了一口氣的", "I was relieved to hear the good news.", "be relieved to V／relieved that...", "聽到好消息我鬆了一口氣。"], ["ashamed", "/əˋʃemd/", "adj.", "羞愧的", "He felt ashamed of his mistake and apologized to his teammates after the game.", "be ashamed of + N", "他為自己的失誤感到羞愧，賽後向隊友道歉。"], ["envious", "/ˋɛnvɪəs/", "adj.", "羨慕的；忌妒的", "She was envious of her friend's success.", "be envious of + N", "她嫉妒朋友的成功。"], ["grateful", "/ˋgretfəl/", "adj.", "感激的", "I am truly grateful for your help during the most difficult time of my life.", "be grateful for + N／grateful to + 人", "我真的很感激你在我人生最艱難的時候幫助我。"], ["apprehensive", "/æprɪˋhɛnsɪv/", "adj.", "憂慮不安的", "He felt apprehensive about the job interview, worrying that he might forget what to say.", "be apprehensive about + N（比 anxious 略正式）", "他對工作面試感到忐忑不安，擔心自己會忘詞。"], ["meticulous", "/məˋtɪkjələs/", "adj.", "一絲不苟的；極其細心的", "She is meticulous about every detail in her research.", "be meticulous about/in + N（強調做事態度嚴謹、講究細節，非情緒詞，而是人格特質，故此類名稱一併調整）", "她對研究中的每個細節都一絲不苟。"], ["eccentric", "/ɪkˋsɛntrɪk/", "adj.", "古怪的；異於常人的（形容人的性格）", "The eccentric professor was known for his unusual teaching methods.", "an eccentric personality/behavior（形容『特立獨行』的人格特質，語氣中性偏有趣）", "那位古怪的教授以不尋常的教學方式聞名。"], ["bizarre", "/bɪˋzɑr/", "adj.", "怪誕的；離奇的（形容事件而非人）", "It was a bizarre coincidence that they met again after so many years.", "a bizarre incident/coincidence/dream（常形容『詭異難解的事件』；與 eccentric 形容『人的性格古怪』不同，注意原字拼法為 bizarre 非 bizzare）", "多年後他們又再次相遇，真是不可思議的巧合。"], ["obliged", "/əˋblaɪdʒd/", "adj.", "感激的；感到有義務的", "I feel obliged to help my classmates whenever they are in need.", "feel obliged to V（感到有義務做某事）／be much obliged（十分感激，較正式、略帶古風）", "同學需要幫忙時，我覺得有義務幫助他們。"], ["dedicated", "/ˋdɛdɪketɪd/", "adj.", "專注的；奉獻的；盡心盡力的", "The dedicated volunteers spent their weekends cleaning up the beach.", "be dedicated to + N/V-ing（強調『全心投入、堅定不移』，常用於形容人格特質或工作態度）", "那些投入的志工利用週末清理海灘。"], ["amiable", "/ˋemɪəbl/", "adj.", "友善的；和藹可親的", "Her amiable personality made her popular among classmates.", "an amiable manner/personality（形容『待人親切隨和』，語氣比 friendly 更書面優雅）", "她和藹可親的個性讓她在同學間很受歡迎。"], ["peculiar", "/pɪˋkjuljɚ/", "adj.", "古怪的；奇特的（也可指『特有的』）", "There was something peculiar about the way he avoided eye contact during the interview.", "peculiar to + N（表『……所特有的』）／something peculiar about + N（跟 eccentric 相近但語氣更中性，可形容人事物）", "他在面試時迴避眼神接觸的樣子有點古怪。"], ["judicious", "/dʒuˋdɪʃəs/", "adj.", "明智的；審慎的", "A judicious leader carefully weighs both the risks and benefits before making a decision.", "a judicious decision/choice/leader（形容『經過深思熟慮、判斷力佳』，議論文評論決策品質時很好用，反義為 injudicious）", "明智的領導者在做決定前會仔細衡量風險與好處。"]]}, {"name": "5. Environment & Description（環境與氣氛描寫）", "rows": [["breeze", "/briz/", "n.", "微風", "A cool breeze blew gently across the field, carrying the sweet smell of rice flowers.", "a gentle/cool breeze／a breeze blew", "一陣涼風輕輕吹過田野，帶來稻花的香甜氣味。"], ["gale", "/gel/", "n.", "強風", "The small fishing boat was caught in a gale and had to return to the harbor.", "a gale blew/hit／gale-force winds", "那艘小漁船遇上強風，不得不返回港口。"], ["tranquil", "/ˋtræŋkwɪl/", "adj.", "寧靜的", "In the early morning, the lake was so tranquil that it reflected the mountains like a mirror.", "a tranquil atmosphere/setting", "清晨的湖面平靜得像一面鏡子，倒映著群山。"], ["gloomy", "/ˋglumɪ/", "adj.", "陰沉的", "The sky looked gloomy all morning, and by noon it had started to pour.", "a gloomy sky/mood", "整個早上天空陰沉沉的，到了中午就下起了大雨。"], ["vibrant", "/ˋvaɪbrənt/", "adj.", "充滿活力的", "At night, the city becomes vibrant with street performers, food stalls, and crowds of tourists.", "a vibrant city/atmosphere/color", "到了晚上，街頭藝人、小吃攤和成群的觀光客讓這座城市充滿活力。"], ["gorgeous", "/ˋgɔrdʒəs/", "adj.", "美麗的", "From the top of Alishan, the view of the sea of clouds at sunrise was simply gorgeous.", "absolutely gorgeous／a gorgeous view", "從阿里山頂望去，日出時的雲海景色美極了。"], ["serene", "/səˋrin/", "adj.", "寧靜安詳的", "At dawn, the lake looked serene, with mist rising slowly from the still water.", "a serene expression/atmosphere（比 tranquil 更強調『安詳感』）", "黎明時分，湖面看起來寧靜祥和，薄霧從平靜的水面緩緩升起。"], ["picturesque", "/pɪktʃəˋrɛsk/", "adj.", "風景如畫的", "The picturesque village, with its old stone houses and blooming flowers, attracts painters from all over the world.", "a picturesque view/village/scene", "那座風景如畫的村莊有古老的石屋和盛開的花朵，吸引了世界各地的畫家。"], ["desolate", "/ˋdɛsəlɪt/", "adj.", "荒涼的", "After the factory closed, the once busy town looked desolate, with empty streets and broken windows.", "a desolate landscape/place（與 gloomy 不同：強調『荒無人煙』）", "工廠關閉後，這座曾經熱鬧的小鎮看起來荒涼淒清，街道空蕩、窗戶破碎。"], ["lush", "/lʌʃ/", "adj.", "蒼翠茂密的", "The valley was covered in lush greenery.", "lush greenery/vegetation/fields", "山谷裡綠意盎然。"], ["breathtaking", "/ˋbrɛθtekɪŋ/", "adj.", "令人屏息的", "The view from the peak was breathtaking.", "a breathtaking view/scenery（比 gorgeous 語氣更強）", "從山頂望出去的景色令人屏息。"], ["crisp", "/krɪsp/", "adj.", "清新的；(空氣)涼爽乾淨的", "On the first morning of autumn, the air felt crisp and cool as we walked to school.", "crisp air/morning", "秋天的第一個早晨，我們走路上學時，空氣清新涼爽。"], ["humid", "/ˋhjumɪd/", "adj.", "潮濕悶熱的", "It was hot and humid in summer.", "hot and humid／humid weather", "夏天又熱又潮濕。"], ["perilous", "/ˋpɛrələs/", "adj.", "危險的（書面語，比 dangerous 正式、文學化）", "They embarked on a perilous journey across the desert.", "a perilous journey/situation/path", "他們踏上一段穿越沙漠的危險旅程。"], ["hazardous", "/ˋhæzɚdəs/", "adj.", "危險的；有害的（尤指對健康或環境）", "Working in such hazardous conditions requires special protective gear.", "hazardous conditions/waste/materials（強調『對健康或環境有害』；perilous 則偏重『冒險犯難』的情境）", "在如此危險的環境下工作需要特殊的防護裝備。"], ["lethal", "/ˋliθəl/", "adj.", "致命的（強調殺傷力）", "The venom of this snake is lethal to humans.", "a lethal weapon/dose/injection（強調『物質或武器本身的致死殺傷力』）", "這種蛇的毒液對人類是致命的。"], ["fatal", "/ˋfetl/", "adj.", "致命的（強調造成死亡的後果）", "The car accident proved fatal for two of the passengers.", "a fatal accident/mistake/disease（強調『導致死亡』的後果，與 lethal 著重『殺傷力本身』略有不同）", "那場車禍造成兩名乘客死亡。"]]}, {"name": "6. Color Vocabulary（精準色彩詞彙）", "rows": [["crimson", "/ˋkrɪmzn/", "adj./n.", "深紅", "As the sun went down behind the mountains, the whole sky turned crimson.", "turn crimson／a crimson sunset", "太陽沉入山後，整片天空變成了深紅色。"], ["scarlet", "/ˋskɑrlɪt/", "adj./n.", "鮮紅", "The bride's cheeks turned scarlet when the groom read his love letter in front of all the guests.", "a scarlet dress/ribbon", "新郎在所有賓客面前念出他的情書時，新娘的臉頰紅透了。"], ["emerald", "/ˋɛmərəld/", "adj./n.", "翡翠綠", "After the spring rain, the rice fields looked emerald under the bright sunshine.", "emerald green／emerald waters", "春雨過後，稻田在明亮的陽光下一片翠綠。"], ["sapphire", "/ˋsæfaɪr/", "adj./n.", "寶石藍", "The sapphire sea around Green Island is so clear that you can see fish swimming below.", "sapphire blue／a sapphire sea", "綠島周圍寶藍色的海水清澈到看得見魚在下面游。"], ["turquoise", "/ˋtɝkwɔɪz/", "adj./n.", "青綠", "We snorkeled in the turquoise water of Kenting, surrounded by colorful fish.", "turquoise water/sky", "我們在墾丁藍綠色的海水裡浮潛，身邊圍繞著五彩繽紛的魚。"], ["ivory", "/ˋaɪvərɪ/", "adj./n.", "象牙白", "The walls of the old hotel were painted ivory, which gave the lobby a warm and elegant feel.", "ivory white／ivory walls", "那間老飯店的牆壁漆成象牙白，讓大廳顯得溫暖又典雅。"], ["amber", "/ˋæmbɚ/", "adj./n.", "琥珀色", "The warm amber light from the lamp made the small café feel cozy on the rainy night.", "amber light/glow", "燈發出溫暖的琥珀色光線，讓下雨夜裡的小咖啡廳感覺很溫馨。"], ["azure", "/ˋæʒɚ/", "adj./n.", "蔚藍", "Lying on the grass, we gazed up at the azure sky without a single cloud in it.", "an azure sky/sea", "我們躺在草地上，仰望著萬里無雲的蔚藍天空。"], ["lavender", "/ˋlævəndɚ/", "adj./n.", "薰衣草紫", "The field was covered in lavender blossoms.", "a lavender field/hue", "田野開滿了薰衣草花。"], ["charcoal", "/ˋtʃɑrkol/", "adj./n.", "炭灰色", "He wore a charcoal suit and a dark tie to his grandfather's funeral.", "charcoal grey／a charcoal sky", "他穿著一套炭灰色的西裝、打著深色領帶去參加祖父的葬禮。"]]}, {"name": "7. Food & Culinary Descriptions（美食與飲食描寫）", "rows": [["scrumptious", "/ˋskrʌmpʃəs/", "adj.", "美味可口的（口語，語氣誇張生動）", "The bakery's cinnamon rolls are absolutely scrumptious.", "scrumptious food/meal/dessert（口語化且生動的『美味』說法，比 delicious 更活潑）", "這家麵包店的肉桂捲實在美味極了。"], ["delectable", "/dɪˋlɛktəbl/", "adj.", "美味的；令人愉悅的（書面語，較正式優雅）", "The chef prepared a delectable seven-course meal for the guests.", "a delectable dish/meal/flavor（比 scrumptious 更正式書面，常見於美食評論）", "主廚為賓客準備了一頓美味的七道菜大餐。"], ["delicate", "/ˋdɛləkɪt/", "adj.", "（味道）細緻的；（質地）精巧易碎的", "The soup has a delicate flavor that is easily overpowered by too much seasoning.", "a delicate flavor/texture/balance（強調『細緻、需要小心呵護』的特質，可用於味道或工藝；原字拼法為 delicate 非 dellicate）", "這道湯的味道很細緻，調味太多就很容易蓋過去。"], ["cuisine", "/kwɪˋzin/", "n.", "菜餚；（某地區或文化的）烹飪風格", "Taiwanese cuisine is renowned for its diverse night market snacks.", "Italian/Japanese/local cuisine（指『某地區或民族特有的烹飪風格』，為不可數名詞）", "台灣料理以多樣的夜市小吃聞名。"], ["delicacy", "/ˋdɛləkəsɪ/", "n.", "佳餚；珍饈（某地特有的精緻食物）", "Stinky tofu is considered a local delicacy in Taiwan, despite its polarizing smell.", "a local/regional delicacy（指『地方特色美食』；與 cuisine 指『整體烹飪風格』不同，delicacy 是單一珍饈食物）", "儘管氣味讓人愛恨分明，臭豆腐仍被視為台灣的在地美食。"], ["exquisite", "/ɪkˋskwɪzɪt/", "adj.", "精緻的；極其優美的", "The dessert was an exquisite blend of chocolate and sea salt.", "exquisite taste/craftsmanship/design（不限於食物，也常用於形容工藝或品味的『精緻優雅』）", "這道甜點是巧克力與海鹽的絕妙組合。"]]}, {"name": "8. Trend & Change Verbs（趨勢與變化動詞）", "rows": [["surge", "/sɝdʒ/", "v./n.", "激增", "As more people began working from home, demand for laptops surged by nearly 40 percent.", "surge in/to + N（強調快速大量增加）／a surge of anger", "隨著越來越多人開始在家工作，筆電的需求激增了將近四成。"], ["plunge", "/plʌndʒ/", "v./n.", "暴跌", "When too many farmers grew cabbages at the same time, cabbage prices plunged to just ten dollars each.", "plunge into/to + N", "太多農民同時種高麗菜，菜價暴跌到一顆只要十元。"], ["soar", "/sor/", "v.", "飆升", "Since the war broke out, the cost of imported energy has soared, putting pressure on small businesses.", "soar to/above + N（強調『飛快上升』，也可形容士氣）", "自從戰爭爆發，進口能源的成本飆升，讓小型企業壓力倍增。"], ["skyrocket", "/ˋskaɪrɑkɪt/", "v.", "暴漲", "After the singer posted a video wearing the brand's sneakers, its sales skyrocketed overnight.", "skyrocket to/by + N（口語感強，誇張式暴漲）", "那位歌手發了一支穿著該品牌球鞋的影片後，銷售量一夜之間直線上升。"], ["rise", "/raɪz/", "v.", "上升", "As housing prices continue to rise, many young people have given up hope of owning a home.", "rise by/to + N／a sharp rise in（中性、最常用的『上升』）", "隨著房價持續上漲，許多年輕人已經放棄擁有自己房子的希望。"], ["climb", "/klaɪm/", "v.", "上升", "The number of foreign tourists visiting Taiwan climbed steadily after the borders reopened.", "climb to/by + N steadily（強調緩慢穩定上升）", "邊境重新開放後，來台的外國觀光客人數穩定攀升。"], ["peak", "/pik/", "v./n.", "到達高峰", "The number of tourists usually peaks in July, when students are on summer vacation.", "peak at + N／reach a peak", "遊客人數通常在七月達到高峰，那時學生正在放暑假。"], ["plummet", "/ˋplʌmɪt/", "v.", "暴跌", "When the company admitted to falsifying its data, its stock price plummeted by half in a single day.", "plummet to/by + N（比 plunge 語氣更急遽）", "那家公司承認竄改數據後，股價在一天之內暴跌了一半。"], ["decline", "/dɪˋklaɪn/", "v./n.", "下降", "Taiwan's birth rate has declined so sharply that many schools have been forced to close.", "decline in/by + N／a steady decline（中性，常用於長期趨勢）", "台灣的出生率大幅下降，許多學校因此被迫關閉。"], ["dwindle", "/ˋdwɪndl/", "v.", "減少", "As young people move to the cities, the population of many rural villages has dwindled to only a few hundred.", "dwindle to/away／dwindling supplies（強調逐漸變少至匱乏）", "隨著年輕人移居城市，許多鄉村的人口已經減少到只剩幾百人。"], ["fluctuate", "/ˋflʌktʃuet/", "v.", "波動", "Vegetable prices tend to fluctuate sharply during the typhoon season.", "fluctuate between A and B", "颱風季期間，菜價往往波動劇烈。"], ["stabilize", "/ˋstebəlaɪz/", "v.", "穩定", "After months of sharp ups and downs, the housing market finally stabilized at the end of the year.", "stabilize at + N", "經過幾個月的劇烈起伏，房市終於在年底穩定下來。"], ["rebound", "/rɪˋbaʊnd/", "v.", "反彈", "After a difficult year, the economy rebounded quickly as tourists returned and exports increased.", "rebound from + N／a strong rebound", "經過艱難的一年，隨著觀光客回流和出口增加，經濟迅速反彈。"], ["trail", "/trel/", "v./n.", "落後；緊追在後；(n.)小徑", "Taiwan still trails other countries in renewable energy use.", "trail behind + N／trail by + 數量（原誤放在 Body Language，已移至此類）", "台灣在再生能源使用上仍落後其他國家。"], ["escalate", "/ˋɛskəlet/", "v.", "升級；惡化", "What began as a small argument between neighbors quickly escalated into a fistfight.", "escalate into + N／escalate rapidly", "原本只是鄰居之間的小爭執，很快就演變成一場鬥毆。"], ["outnumber", "/aʊtˋnʌmbɚ/", "v.", "數量上超過、比…多", "In Taiwan, the elderly will soon outnumber children.", "A outnumber B (by + 數量／倍數)／be outnumbered by + N；描述人口結構、供需比例變化時好用", "在台灣，老年人口很快就會比兒童還多。"]]}, {"name": "9. Argument Verbs（議論與因果論述動詞）", "rows": [["mitigate", "/ˋmɪtəget/", "v.", "緩解", "Taking short breaks between study sessions can mitigate the stress students feel before exams.", "mitigate the effects/risk/damage of + N（正式，多接負面名詞）", "讀書時中間穿插短暫休息，可以減輕學生考前感受到的壓力。"], ["enhance", "/ɪnˋhæns/", "v.", "提升", "Reading widely not only enhances our vocabulary but also broadens our view of the world.", "enhance one's ability/performance/experience（強調『提升品質』）", "廣泛閱讀不僅能增加我們的詞彙量，也能開闊我們的世界觀。"], ["promote", "/prəˋmot/", "v.", "促進", "The government launched a campaign to promote healthy eating habits among children.", "promote health/growth/equality（強調『推廣、助長』）", "政府發起一項活動，在兒童之間推廣健康的飲食習慣。"], ["boost", "/bust/", "v.", "提升", "A few words of sincere praise from a teacher can greatly boost a student's confidence.", "boost one's confidence/morale/sales（語氣較強、常指『瞬間拉抬』，與 enhance 的『漸進提升品質』不同）", "老師幾句真誠的讚美，就能大大提升學生的自信。"], ["cultivate", "/ˋkʌltəvet/", "v.", "培養", "Schools should cultivate students' creativity instead of simply asking them to memorize facts.", "cultivate a habit/skill/relationship", "學校應該培養學生的創造力，而不是只要求他們背誦知識。"], ["foster", "/ˋfɔstɚ/", "v.", "促進；培養", "A supportive family environment fosters a child's sense of security and self-worth.", "foster a sense of + N（常接抽象名詞，如 belonging）", "一個給予支持的家庭環境，能培養孩子的安全感與自我價值感。"], ["highlight", "/ˋhaɪlaɪt/", "v.", "強調", "The recent earthquake highlights the importance of building safer schools and hospitals.", "highlight the need/importance of + N（客觀點出重點）", "最近的地震凸顯了興建更安全的學校和醫院的重要性。"], ["underscore", "/ʌndɚˋskɔr/", "v.", "凸顯", "The rising number of traffic accidents underscores the need for stricter drunk-driving laws.", "underscore the importance/urgency of + N（比 highlight 語氣更正式強烈）", "車禍數量不斷增加，凸顯出需要更嚴格的酒駕法規。"], ["illustrate", "/ˋɪləstret/", "v.", "說明；闡明", "The graph clearly illustrates how the number of smartphone users has grown over the past ten years.", "illustrate + how/that子句（常搭配圖表、例子）", "這張圖表清楚地呈現過去十年智慧型手機使用者人數的成長。"], ["demonstrate", "/ˋdɛmənstret/", "v.", "證明", "The experiment clearly demonstrates that plants grow faster when they are exposed to music.", "demonstrate that.../demonstrate a skill", "這個實驗清楚地證明，植物在有音樂的環境下長得比較快。"], ["reveal", "/rɪˋvil/", "v.", "顯示", "The survey revealed that more than half of high school students sleep less than six hours a night.", "reveal that.../reveal the truth", "調查顯示，超過一半的高中生每晚睡不到六小時。"], ["spark", "/spɑrk/", "v.", "引發", "The proposal to ban motorcycles from the city center sparked a heated debate among residents.", "spark controversy/debate/interest（強調『引爆』討論或情緒）", "禁止機車進入市中心的提案在居民之間引發了激烈的辯論。"], ["trigger", "/ˋtrɪgɚ/", "v.", "觸發", "Long-term stress can trigger serious health problems such as insomnia and heart disease.", "trigger a reaction/response（較中性，常指『機制式』反應）", "長期的壓力可能引發失眠和心臟病等嚴重的健康問題。"], ["fuel", "/ˋfjuəl/", "v.", "助長", "Constant media coverage of crimes fuels public anxiety, even when crime rates are falling.", "fuel speculation/fear/growth", "即使犯罪率在下降，媒體不斷報導犯罪新聞仍加劇了大眾的焦慮。"], ["shape", "/ʃep/", "v.", "形塑", "The books we read as children often shape our values and the way we see the world.", "shape one's character/future/values", "我們小時候讀的書，往往塑造了我們的價值觀和看世界的方式。"], ["transform", "/trænsˋfɔrm/", "v.", "改變", "Artificial intelligence is transforming the way doctors diagnose and treat diseases.", "transform A into B", "人工智慧正在改變醫生診斷和治療疾病的方式。"], ["revolutionize", "/rɛvəˋluʃənaɪz/", "v.", "革命性改變", "The invention of the smartphone revolutionized the way we communicate, shop, and learn.", "revolutionize the way we + V", "智慧型手機的發明徹底改變了我們溝通、購物和學習的方式。"], ["alleviate", "/əˋlivɪet/", "v.", "減輕", "Volunteers delivered food and blankets to alleviate the suffering of the flood victims.", "alleviate the burden/pain/pressure（強調『減輕』負面感受）", "志工們送來食物和毛毯，減輕水災災民的苦難。"], ["empower", "/ɪmˋpaʊɚ/", "v.", "賦權；使有能力", "Education empowers people to change their lives.", "empower + 人 + to V", "教育賦予人們改變人生的力量。"], ["erode", "/ɪˋrod/", "v.", "侵蝕", "Endless exams and constant comparisons can gradually erode students' motivation to learn.", "erode trust/confidence/motivation", "沒完沒了的考試和不斷的比較，會逐漸削弱學生的學習動力。"], ["forge", "/fɔrdʒ/", "v.", "塑造；鍛造", "The hardships he faced as a child forged a strong character that helped him succeed later in life.", "forge a bond/relationship/character", "他小時候經歷的苦難鍛鍊出堅強的性格，幫助他日後成功。"], ["suffocate", "/ˋsʌfəket/", "v.", "壓迫；使窒息", "Too many rules and too much pressure can suffocate a child's creativity and curiosity.", "suffocate creativity/growth（比喻用法）", "太多規定和太大的壓力，可能會扼殺孩子的創造力和好奇心。"], ["streamline", "/ˋstrimlaɪn/", "v.", "精簡；簡化", "The city streamlined the application process, so citizens can now apply for permits online in minutes.", "streamline the process/procedure", "市政府簡化了申請流程，民眾現在幾分鐘內就能在網路上申請許可。"], ["captivate", "/ˋkæptəvet/", "v.", "吸引", "The young author's first novel captivated readers with its touching story and vivid characters.", "captivate the audience/readers", "這位年輕作家的第一本小說以動人的故事和生動的角色深深吸引了讀者。"], ["prevail", "/prɪˋvel/", "v.", "勝過；戰勝；盛行", "Although the investigation took years, the truth finally prevailed and the innocent man was released.", "prevail over + N（戰勝）／prevail in/among + 地點（盛行）", "雖然調查花了好幾年，真相終究勝出，那名無辜的男子也獲釋了。"], ["undermine", "/ʌndɚˋmaɪn/", "v.", "削弱；損害", "Constant criticism from parents can undermine a child's confidence and willingness to try new things.", "undermine confidence/trust/efforts", "父母不斷的批評，可能削弱孩子的自信和嘗試新事物的意願。"], ["safeguard", "/ˋsefgɑrd/", "v.", "保障；保護", "Strict privacy laws are needed to safeguard our personal information from being misused.", "safeguard the rights/interests of + N", "我們需要嚴格的隱私法來保護個人資料不被濫用。"], ["necessitate", "/nəˋsɛsətet/", "v.", "使成為必要", "The sudden outbreak of the disease necessitated the closure of all schools in the area.", "necessitate + N/Ving（正式，常用於被動語境）", "疾病突然爆發，使得該地區所有學校不得不停課。"], ["counteract", "/kaʊntɚˋrækt/", "v.", "抵消；抗衡", "Regular exercise helps counteract the effects of stress.", "counteract the effects of + N", "規律運動有助於抵消壓力帶來的影響。"], ["orchestrate", "/ˋɔrkɪstret/", "v.", "精心策劃；統籌安排", "The committee orchestrated a series of events to raise public awareness.", "orchestrate a campaign/an event/a plan（強調『精心且有系統地』佈局安排，語氣比 organize 更講究巧妙）", "委員會策劃了一系列活動來提升大眾意識。"], ["speculate", "/ˋspɛkjəlet/", "v.", "推測；臆測", "Experts speculate that the trend will continue into next year.", "speculate that.../speculate about + N（常用於引入『各方揣測』的論點）", "專家推測這個趨勢會延續到明年。"], ["synchronize", "/ˋsɪŋkrənaɪz/", "v.", "使同步；協調一致", "The team worked hard to synchronize their schedules for the project.", "synchronize + efforts/schedules/movements（強調『協調一致、同步進行』）", "團隊努力協調大家的時間來配合這個專案。"], ["endeavor", "/ɪnˋdɛvɚ/", "v.", "努力；致力於", "She endeavored to complete the project before the deadline despite numerous setbacks.", "endeavor to V（正式書面用語，比 try to 更正式，強調『竭力嘗試』；也可作名詞，如 a noble endeavor 崇高的事業）", "儘管遭遇許多挫折，她仍努力在期限前完成專案。"], ["advocate", "/ˋædvəket/", "v.", "提倡；主張", "Many experts advocate for stricter regulations on social media use.", "advocate for + N／advocate + Ving（常接 for，強調『公開倡議、大力支持』）", "許多專家主張對社群媒體的使用制定更嚴格的規範。"], ["contend", "/kənˋtɛnd/", "v.", "主張；聲稱（常用於引入對立論點）", "Critics contend that the policy does more harm than good.", "contend that...（引入『對立方的主張』，語氣正式，比 argue 更書面）", "批評者主張這項政策弊大於利。"], ["refute", "/rɪˋfjut/", "v.", "反駁；駁斥", "The study refutes the common belief that video games cause violence.", "refute a claim/argument/belief（強調『提出證據推翻』，比 disagree 更有力）", "這項研究駁斥了電玩會導致暴力的普遍看法。"], ["concede", "/kənˋsid/", "v.", "讓步；承認", "While I concede that the plan has flaws, I still believe it is worth pursuing.", "concede that.../concede a point（讓步句型必備，常接 while/although）", "雖然我承認這個計畫有缺點，但我仍然認為值得一試。"], ["substantiate", "/səbˋstænʃɪet/", "v.", "證實", "The claim is not substantiated by any credible evidence.", "substantiate a claim/allegation（常用被動語態，強調『用證據支持』）", "這項說法沒有任何可信的證據支持。"], ["justify", "/ˋdʒʌstəfaɪ/", "v.", "證明……正當；為……辯護", "Such drastic measures cannot be justified without solid evidence.", "justify + N/Ving（評估手段是否『站得住腳』時常用）", "沒有確鑿的證據，這種激烈的手段是站不住腳的。"], ["warrant", "/ˋwɔrənt/", "v.", "使有正當理由；證明……有必要", "The severity of the issue warrants immediate government intervention.", "warrant + N/Ving（主詞通常是『情況的嚴重性』，強調『足以構成理由』）", "這個問題的嚴重性需要政府立即介入。"], ["outweigh", "/aʊtˋwe/", "v.", "勝過；超過", "The benefits of remote work outweigh its drawbacks for many employees.", "A outweigh(s) B（利弊比較句型的核心動詞，比 be better than 更精準有力）", "對許多員工來說，遠距工作的好處大於壞處。"], ["exacerbate", "/ɪgˋzæsɚbet/", "v.", "使惡化", "Ignoring the problem will only exacerbate the situation.", "exacerbate the situation/problem/tension（正式書面，比 worsen 更精準）", "忽視這個問題只會讓情況更加惡化。"], ["perpetuate", "/pɚˋpɛtʃuet/", "v.", "使延續；助長（負面現象）", "Such stereotypes only perpetuate inequality in the workplace.", "perpetuate a stereotype/cycle/inequality（強調『使負面現象持續存在』）", "這類刻板印象只會讓職場上的不平等延續下去。"], ["rectify", "/ˋrɛktəfaɪ/", "v.", "糾正；矯正", "The government must take action to rectify the situation.", "rectify the situation/mistake/problem（比 fix 更正式，常見於政策討論）", "政府必須採取行動來導正這個情況。"], ["endorse", "/ɪnˋdɔrs/", "v.", "背書；公開支持；認可", "Many celebrities endorse environmental campaigns to raise public awareness.", "endorse a product/policy/candidate（可指『代言』商品，也可指『公開支持』政策或候選人，議論文中常用於『支持某立場』）", "許多名人代言環保活動以提升大眾意識。"]]}, {"name": "10. Intensity & Necessity Adjectives（程度、強度與必要性形容詞）", "rows": [["tremendous", "/trɪˋmɛndəs/", "adj.", "巨大的", "Moving to a foreign country brought tremendous changes to her daily life and way of thinking.", "a tremendous amount/impact", "搬到國外為她的日常生活和思考方式帶來了巨大的改變。"], ["substantial", "/səbˋstænʃəl/", "adj.", "可觀的", "The new policy led to a substantial increase in the number of students studying abroad.", "a substantial increase/amount", "新政策使出國留學的學生人數大幅增加。"], ["remarkable", "/rɪˋmɑrkəbl/", "adj.", "顯著的", "After practicing English with native speakers every day, she made remarkable progress in just three months.", "remarkable progress/achievement", "每天和母語人士練習英文後，她在短短三個月內就有了顯著的進步。"], ["significant", "/sɪgˋnɪfəkənt/", "adj.", "重要的", "Social media has had a significant impact on how teenagers see themselves and others.", "a significant impact/role/difference", "社群媒體對青少年如何看待自己和他人產生了重大的影響。"], ["profound", "/prəˋfaʊnd/", "adj.", "深遠的", "My grandmother had a profound influence on my decision to become a doctor.", "a profound effect/impact on + N", "我祖母對我決定當醫生有深遠的影響。"], ["overwhelming", "/ovɚˋhwɛlmɪŋ/", "adj.", "壓倒性的", "The response to the charity concert was overwhelming, with all 5,000 tickets sold out in an hour.", "overwhelming support/evidence（描述『事物』程度，注意與 overwhelmed 描述『人的感受』不同）", "慈善音樂會的反應非常熱烈，五千張票一小時內就賣光了。"], ["immense", "/ɪˋmɛns/", "adj.", "巨大的", "The internet gives students access to an immense amount of information that was unavailable to earlier generations.", "immense pressure/potential", "網路讓學生能取得大量以前世代無法取得的資訊。"], ["dramatic", "/drəˋmætɪk/", "adj.", "劇烈的", "There has been a dramatic change in the way young people spend their free time over the past decade.", "a dramatic increase/shift", "過去十年來，年輕人運用空閒時間的方式發生了劇烈的變化。"], ["extraordinary", "/ɪkˋstrɔrdnɛrɪ/", "adj.", "非凡的", "The firefighter showed extraordinary courage when he ran into the burning building to save a child.", "extraordinary talent/courage", "那位消防員衝進失火的大樓救出一個孩子，展現了非凡的勇氣。"], ["staggering", "/ˋstægərɪŋ/", "adj.", "驚人的（誇張語氣）", "The cost of repairing the damage caused by the typhoon was staggering, reaching nearly ten billion dollars.", "a staggering amount/number", "修復颱風造成的損害所需的費用高得驚人，將近一百億元。"], ["considerable", "/kənˋsɪdərəbl/", "adj.", "相當大的", "Learning a new language as an adult requires considerable effort and patience.", "considerable effort/attention/time", "成年後學一種新語言需要相當大的努力和耐心。"], ["marginal", "/ˋmɑrdʒɪnl/", "adj.", "些微的；邊際的", "Despite the huge investment, there was only a marginal improvement in students' test scores.", "a marginal increase/difference（原本此類全是『大程度』形容詞，補上這個表示『小程度』，寫作時對比更有層次）", "儘管投入了大量資金，學生的考試成績只有些微的進步。"], ["formidable", "/ˋfɔrmədəbl/", "adj.", "令人敬畏的；強大難以對付的", "The team faced a formidable opponent in the final round.", "a formidable opponent/challenge/task（強調『強大到令人畏懼』，比 tremendous 更聚焦於威懾感）", "決賽中這支隊伍遇上了強勁的對手。"], ["daunting", "/ˋdɔntɪŋ/", "adj.", "令人畏懼的；令人卻步的（形容任務或挑戰艱鉅）", "Learning a new language can be a daunting task for many adults.", "a daunting task/challenge/prospect（強調『光用想的就令人卻步』，常與 formidable 互換，但 daunting 更著重『使人心生畏懼』的心理感受）", "對許多成年人來說，學習一門新語言可能是一項令人卻步的任務。"], ["inevitable", "/ɪnˋɛvətəbl/", "adj.", "不可避免的；必然的", "Given the current trends, a rise in living costs seems inevitable.", "it is inevitable that.../an inevitable consequence(outcome)（議論文中常用來加強『必然發生』的語氣，前面常接 seem/prove/become）", "就目前的趨勢來看，生活成本上升似乎無可避免。"], ["indispensable", "/ɪndɪsˋpɛnsəbl/", "adj.", "不可或缺的；必要的", "Technology has become indispensable to modern education.", "be indispensable to/for + N（比 essential/necessary 更強調『少了它就無法運作』，用於強調某事物的關鍵重要性）", "科技已成為現代教育不可或缺的一部分。"], ["feasible", "/ˋfizəbl/", "adj.", "可行的；行得通的", "Given the budget constraints, building a new library may not be feasible this year.", "a feasible plan/solution/option（強調『理論上可執行』，議論文評估方案可行性時常用，反義為 unfeasible/infeasible）", "考量到預算限制，今年蓋新圖書館可能不可行。"], ["controversial", "/kɑntrəˋvɝʃəl/", "adj.", "有爭議的", "The proposal remains a controversial topic among lawmakers.", "a controversial issue/topic/decision", "這項提案在立法者之間仍是具爭議性的話題。"], ["detrimental", "/dɛtrəˋmɛntl/", "adj.", "有害的", "Excessive screen time can be detrimental to children's development.", "be detrimental to + N（比 harmful 更正式書面）", "螢幕時間過長可能對兒童的發展有害。"], ["paramount", "/ˋpærəmaʊnt/", "adj.", "至關重要的", "Safety should be of paramount importance in any workplace.", "of paramount importance（固定搭配，比 extremely important 更高級）", "在任何職場，安全都應該是最重要的。"], ["viable", "/ˋvaɪəbl/", "adj.", "可行的；能存續運作的", "Renewable energy is becoming an increasingly viable alternative to fossil fuels.", "a viable option/alternative/solution（與本類的 feasible 相近但更強調『能長久維持運作』，feasible 則強調『做得到』）", "再生能源正逐漸成為取代化石燃料的可行選擇。"], ["prevalent", "/ˋprɛvələnt/", "adj.", "普遍的；盛行的", "Obesity has become increasingly prevalent among teenagers.", "become prevalent among + N（比 common 更正式，常用於描述社會現象的普及程度）", "肥胖在青少年之間越來越普遍。"], ["obsolete", "/ˋɑbsəlit/", "adj.", "過時的；淘汰的", "Many traditional skills have become obsolete with the rise of automation.", "become/render obsolete（常用於科技、技能被時代淘汰的語境，render obsolete 為正式被動搭配）", "隨著自動化興起，許多傳統技能已經過時。"], ["tedious", "/ˋtidɪəs/", "adj.", "冗長乏味的；令人厭煩的", "Filling out the same form repeatedly can be a tedious process.", "a tedious task/process/journey（強調『因冗長重複而令人厭煩』，比 boring 更正式書面）", "一再填寫同樣的表格可能是個乏味的過程。"], ["feeble", "/ˋfibl/", "adj.", "虛弱無力的；（比喻）站不住腳的", "His feeble excuse failed to convince the teacher of his innocence.", "a feeble argument/excuse/attempt（形容論點、藉口或嘗試軟弱無力，議論文中常用來批評對方論述薄弱）", "他薄弱的藉口無法讓老師相信他是無辜的。"], ["irreversible", "/ɪrɪˋvɝsəbl/", "adj.", "不可逆轉的；無法挽回的", "Deforestation on this scale could cause irreversible damage to the ecosystem.", "irreversible damage/consequences/harm（強調『後果一旦發生就無法回復』，議論文中常用來強化事態嚴重性）", "如此大規模的森林砍伐可能對生態系統造成無法挽回的破壞。"], ["monotonous", "/məˋnɑtənəs/", "adj.", "單調的；一成不變的", "Repeating the same drills every day can make training feel monotonous.", "a monotonous routine/job/life（強調『缺乏變化、令人乏味』，常與 tedious 替換使用，但更強調『重複性』）", "每天重複同樣的練習會讓訓練感覺很單調。"]]}, {"name": "11. Adverbs（程度與修飾副詞）", "rows": [["slightly", "/ˋslaɪtlɪ/", "adv.", "稍微", "Although the new menu is only slightly different from the old one, customers noticed right away.", "slightly + adj./v.／a slight increase", "雖然新菜單和舊菜單只有些微不同，顧客還是馬上就注意到了。"], ["gradually", "/ˋgrædʒʊəlɪ/", "adv.", "逐漸地", "With the help of a patient tutor, his English gradually improved over the semester.", "gradually + v. over time", "在一位耐心的家教幫助下，他的英文在這學期裡逐漸進步。"], ["dramatically", "/drəˋmætɪklɪ/", "adv.", "劇烈地", "The way we shop has changed dramatically since online stores became popular.", "change/increase dramatically", "自從網路商店普及之後，我們購物的方式就徹底改變了。"], ["barely", "/ˋbɛrlɪ/", "adv.", "幾乎不", "He had stayed up playing games all night, so he barely passed the math test.", "barely + v.／barely any + N", "他整晚熬夜打電動，所以數學考試勉強及格。"], ["deeply", "/ˋdiplɪ/", "adv.", "深深地", "She was deeply moved when her students gave her a handmade card on Teachers' Day.", "deeply moved/affected/rooted", "教師節時學生送她一張手作卡片，讓她深受感動。"], ["strongly", "/ˋstrɔŋlɪ/", "adv.", "強烈地", "I strongly believe that schools should teach students how to manage their money.", "strongly agree/believe/recommend", "我堅決認為學校應該教學生如何理財。"], ["gently", "/ˋdʒɛntlɪ/", "adv.", "輕柔地", "So as not to wake the baby, she gently closed the door and tiptoed down the stairs.", "gently + v.", "為了不吵醒寶寶，她輕輕地關上門，踮著腳尖走下樓。"], ["rapidly", "/ˋræpɪdlɪ/", "adv.", "快速地", "As technology develops rapidly, many jobs that exist today may disappear in the future.", "grow/increase/change rapidly", "隨著科技迅速發展，許多現在存在的工作未來可能會消失。"], ["rather", "/ˋræðɚ/", "adv.", "相當", "The math test was rather difficult, so only a few students finished it on time.", "rather + adj.／would rather V", "那次數學考試相當難，所以只有少數學生準時寫完。"], ["relatively", "/ˋrɛlətɪvlɪ/", "adv.", "相對地", "Compared with other foreign languages, English is relatively easy for many Taiwanese students to learn.", "relatively + adj.", "和其他外語相比，英文對許多台灣學生來說相對容易學。"], ["briefly", "/ˋbriflɪ/", "adv.", "簡要地", "Briefly put, the plan worked because everyone knew exactly what they had to do.", "put briefly／briefly explain", "簡單來說，這個計畫之所以成功，是因為每個人都清楚知道自己該做什麼。"]]}, {"name": "12. Transition Adverbs（轉承副詞）", "rows": [["likewise", "/ˋlaɪkwaɪz/", "adv.", "同樣地", "Exercise strengthens the body. Likewise, reading regularly helps keep the mind sharp.", "Likewise, + S + V（句首承接『同類』論點）", "運動能強健身體；同樣地，經常閱讀有助於保持頭腦敏銳。"], ["moreover", "/morˋovɚ/", "adv.", "此外；再者", "Moreover, the plan saves both time and money.", "Moreover, + S + V（句首，補充『更進一步』的論點）", "此外，這個計畫既省時又省錢。"], ["furthermore", "/ˋfɝðɚmor/", "adv.", "此外", "Team sports teach students how to cooperate. Furthermore, they help build lasting friendships.", "Furthermore, + S + V（與 moreover 幾乎同義，可交替使用避免重複）", "團隊運動教學生如何合作；再者，它們也有助於建立長久的友誼。"], ["nevertheless", "/nɛvɚðəˋlɛs/", "adv.", "然而；儘管如此", "Nevertheless, she decided to give it another try.", "Nevertheless, + S + V（句首，強調『轉折』）", "儘管如此，她還是決定再試一次。"], ["consequently", "/ˋkɑnsəkwɛntlɪ/", "adv.", "因此；結果", "He skipped class; consequently, he failed the test.", "..., consequently, + S + V（強調『因果』）", "他翹課，結果考試不及格。"], ["meanwhile", "/ˋminhwaɪl/", "adv.", "與此同時", "The rescue team rushed to the village. Meanwhile, the rain grew heavier and the river kept rising.", "Meanwhile, + S + V（句首，強調『同時發生』）", "救援隊趕往村莊。在此同時，雨越下越大，河水也不斷上漲。"], ["admittedly", "/ədˋmɪtɪdlɪ/", "adv.", "誠然；不可否認地", "Admittedly, online classes are convenient; however, they cannot replace face-to-face interaction.", "Admittedly, + 對方論點（讓步 concession）; however／but + 自己的論點（反駁 rebuttal）：議論文的「讓步—反駁」句型，先承認對方有理再推翻，論證顯得周延；同義 It is true that…, but…", "誠然，線上課程很方便；然而，它們無法取代面對面的互動。"], ["arguably", "/ˋɑrgjuəblɪ/", "adv.", "可以說是", "It is arguably the best solution available.", "arguably the + 最高級（緩和『絕對化』語氣）", "這可以說是現有最好的解決辦法。"], ["however", "/haʊˋɛvɚ/", "adv.", "然而", "The plan looked perfect on paper; however, it failed in practice.", "However, + S + V（句首，是使用頻率最高的轉折詞）", "這個計畫紙上看起來很完美；然而，實際執行卻失敗了。"], ["therefore", "/ˋðɛrfor/", "adv.", "因此", "He didn't study at all; therefore, he failed the exam.", "..., therefore, + S + V（強調『邏輯上必然的結果』，比 so 正式）", "他完全沒讀書，因此考試不及格。"], ["thus", "/ðʌs/", "adv.", "因此；如此", "The company cut costs and thus increased its profit margin.", "thus + Ving／thus, + S + V（比 therefore 更精簡、書面）", "這家公司削減成本，因而提高了利潤率。"], ["additionally", "/əˋdɪʃənlɪ/", "adv.", "此外", "Additionally, the program offers free tutoring for struggling students.", "Additionally, + S + V（與 moreover/furthermore 同義，可交替使用避免重複）", "此外，這個計畫還為學習落後的學生提供免費課業輔導。"], ["indeed", "/ɪnˋdid/", "adv.", "的確；事實上", "The results were, indeed, better than expected.", "..., indeed, ...（插入語，用於加強語氣或補充說明）", "結果確實比預期的好。"], ["similarly", "/ˋsɪmələrlɪ/", "adv.", "同樣地", "Similarly, students who read regularly tend to write better.", "Similarly, + S + V（用於承接『類似』的論點）", "同樣地，經常閱讀的學生往往寫作能力比較好。"], ["accordingly", "/əˋkɔrdɪŋlɪ/", "adv.", "因此；相應地", "The rules have changed; students must adjust their study plans accordingly.", "..., accordingly（句尾，強調『依此』調整）／Accordingly, + S + V（句首）", "規定改了，學生必須相應地調整讀書計畫。"], ["eventually", "/ɪˋvɛntʃʊəlɪ/", "adv.", "最終", "After months of practice, she eventually mastered the skill.", "eventually + V（強調『經過一段過程後』的結果，常用於敘事或結論）", "經過幾個月的練習，她終於掌握了這項技能。"], ["subsequently", "/ˋsʌbsɪkwəntlɪ/", "adv.", "隨後；其後", "The company launched the product in March; subsequently, sales exceeded all expectations.", "..., subsequently, + S + V（強調『按時間順序接續發生』，比 then 更正式書面）", "這家公司在三月推出產品，隨後銷售量超出了所有人的預期。"]]}, {"name": "13. Health & Emergency Vocabulary（醫療與緊急狀況字彙）", "rows": [["contract", "/kənˋtrækt/", "v.", "染上；罹患（疾病）", "She contracted a rare disease during her trip abroad.", "contract an illness/a disease/a virus（正式，比 get/catch sick 高級）", "她在國外旅行時染上了一種罕見疾病。"], ["ailment", "/ˋelmənt/", "n.", "疾病；病痛（多指輕微或慢性）", "Regular exercise can help prevent common ailments.", "suffer from/a minor ailment（比 sickness 正式）", "規律運動有助於預防常見的小病痛。"], ["malady", "/ˋmælədɪ/", "n.", "疾病；（比喻）弊病", "Loneliness is often described as a modern malady.", "a social/modern malady（常用於比喻『社會通病』，文學語氣濃厚）", "孤獨常被形容為一種現代病。"], ["affliction", "/əˋflɪkʃən/", "n.", "病痛；苦難", "He has lived with a chronic affliction since childhood.", "be afflicted with + 疾病／a chronic affliction", "他從小就飽受一種慢性疾病之苦。"], ["recuperate", "/rɪˋkjupəret/", "v.", "康復；療養", "He is recuperating at home after the operation.", "recuperate from + 疾病/手術（比 recover 正式、書面）", "手術後他正在家休養。"]]}, {"name": "14. Everyday Life Vocabulary（日常生活情境字彙）", "rows": [["botch", "/bɑtʃ/", "v.", "搞砸（較正式，語氣近 mess up）", "He botched the interview by arriving twenty minutes late.", "botch a job/an attempt/an interview（比 mess up 稍正式書面）", "他面試遲到二十分鐘，把面試搞砸了。"], ["bungle", "/ˋbʌŋgl/", "v.", "笨手笨腳地搞砸", "The team bungled the project due to poor communication.", "bungle a plan/an operation（強調『因笨拙、缺乏能力』而搞砸）", "由於溝通不良，團隊把專案搞砸了。"], ["dilemma", "/dɪˋlɛmə/", "n.", "困境；進退兩難的處境", "She found herself in a moral dilemma when she discovered her best friend had cheated on the exam.", "face/be in a dilemma／a moral dilemma（常搭配 face, be in, resolve 等動詞，強調『左右為難』的抉擇困境，可與 at a crossroads 搭配使用）", "發現最好的朋友考試作弊時，她陷入了道德兩難。"], ["affair", "/əˋfɛr/", "n.", "事務；事情（常用複數指時事、局勢）", "Keeping up with current affairs is essential for writing a well-informed argumentative essay.", "current affairs（時事，議論文審題常用）／a state of affairs（事態、局面）", "掌握時事對於寫出一篇論據充分的論說文至關重要。"]]}, {"name": "15. Precise Human Subject Nouns（精準人稱主詞，避免濫用 people／individual）", "rows": [["urban dweller", "/ˋɝbən ˋdwɛlɚ/", "n.", "都市居民", "Urban dwellers often suffer from chronic stress due to noise and overcrowding.", "urban dwellers vs. rural residents（都市居民 vs. 鄉村居民，都市化／環境議題的精準主詞）", "都市居民常因噪音和擁擠而承受長期壓力。"], ["commuter", "/kəˋmjutɚ/", "n.", "通勤者", "Commuters spend hours stuck in traffic every day.", "daily commuters／rush-hour commuters（交通議題常用主詞）", "通勤族每天花好幾個小時塞在車陣中。"], ["adolescent", "/ædlˋɛsnt/", "n./adj.", "青少年", "Adolescents are particularly vulnerable to peer pressure on social media.", "adolescents（比 teenagers 更正式書面，議論文常用，可替換過度使用的 young people）", "青少年在社群媒體上特別容易受到同儕壓力的影響。"], ["the elderly", "elderly /ˋɛldɚlɪ/", "n.", "老年人（集合稱呼，動詞用複數）", "The elderly are often left behind in the rapid digitalization of society.", "the elderly／senior citizens（the + 形容詞表『某一類人』的集合用法，取代籠統的 old people）", "在社會快速數位化的過程中，長者常被拋在後頭。"], ["pedestrian", "/pəˋdɛstrɪən/", "n.", "行人", "Pedestrians are increasingly at risk on streets dominated by delivery scooters.", "pedestrian safety／a pedestrian crossing（交通安全議題的精準主詞）", "在外送機車充斥的街道上，行人的處境越來越危險。"], ["policymaker", "/ˋpɑləsimekɚ/", "n.", "政策制定者", "Policymakers must weigh economic growth against environmental protection.", "policymakers vs. the general public（政策類議論文的關鍵對照主詞）", "政策制定者必須權衡經濟成長與環境保護。"], ["the underprivileged", "underprivileged /ʌndɚˋprɪvəlɪdʒd/", "n.", "弱勢族群（集合稱呼，動詞用複數）", "Scholarship programs aim to give the underprivileged equal access to education.", "the underprivileged／the disadvantaged（取代籠統的 poor people，語氣更正式中性）", "獎學金計畫旨在讓弱勢族群有平等的受教機會。"], ["bystander", "/ˋbaɪstændɚ/", "n.", "旁觀者", "Many bystanders filmed the accident instead of calling for help.", "an innocent bystander／bystander apathy（旁觀者冷漠效應，社會議題常用詞組）", "許多旁觀者拍下了事故，而不是打電話求助。"], ["proponent", "/prəˋponənt/", "n.", "支持者；提倡者", "Proponents of remote work argue that it boosts productivity and morale.", "proponents of + N（比 supporters 正式，常與 critics/opponents 成對使用，構成正反對照句型）", "遠距工作的支持者主張它能提升生產力和士氣。"], ["critic", "/ˋkrɪtɪk/", "n.", "批評者", "Critics of the policy warn that it could widen the wealth gap.", "critics of + N（常與 proponents/advocates 對照，議論文正反論述必備主詞）", "這項政策的批評者警告，它可能會擴大貧富差距。"], ["taxpayer", "/ˋtækspeɚ/", "n.", "納稅人", "Taxpayers ultimately bear the cost of the government's new subsidy program.", "taxpayer money／ordinary taxpayers（政策成本、公共支出議題的精準主詞）", "最終要由納稅人負擔政府新補助計畫的費用。"], ["caregiver", "/ˋkɛrgɪvɚ/", "n.", "照顧者", "Caregivers often sacrifice their own careers to look after aging parents.", "family caregivers／unpaid caregivers（高齡化、家庭議題常用主詞）", "照顧者常犧牲自己的事業來照顧年邁的父母。"], ["opponent", "/əˋponənt/", "n.", "反對者；對手", "Opponents of the reform argue that it would place an unfair burden on small businesses.", "opponents of + N（常與 proponents 成對出現，構成議論文正反對照句型，如 Proponents argue that..., while opponents contend that...）", "這項改革的反對者主張，它會對小型企業造成不公平的負擔。"]]}, {"name": "16. Phrases（實用高分片語）", "rows": [["take a deep breath", "—", "phrase", "深呼吸", "Before stepping onto the stage, she took a deep breath and told herself to stay calm.", "take a deep breath before Ving", "走上台前，她深吸了一口氣，告訴自己要保持冷靜。"], ["in tears", "—", "phrase", "流著淚", "She was in tears when she finally saw her family again after five years abroad.", "be in tears／burst into tears", "在國外五年後終於再次見到家人時，她淚流滿面。"], ["in panic", "panic /ˋpænɪk/", "phrase", "驚慌地", "When the fire alarm went off, students ran out of the building in panic.", "in a state of panic", "火災警報響起時，學生們驚慌地跑出大樓。"], ["swallow hard", "—", "phrase", "緊張地吞口水", "He swallowed hard before stepping onto the stage to give his first English speech.", "swallow hard before Ving", "他在走上台發表第一次英文演講之前，緊張地吞了吞口水。"], ["gear up for", "gear /gɪr/", "phrasal verb", "為……做準備", "As the entrance exam approaches, students across the country are gearing up for the final challenge.", "gear up for + N", "隨著升學考試逼近，全國的學生都在為最後的挑戰做準備。"], ["suffer from burnout", "burnout /ˋbɝnaʊt/", "phrase", "遭受身心過勞", "Working twelve hours a day for months, many young engineers suffer from burnout.", "suffer from + 疾病/burnout", "連續好幾個月每天工作十二小時，許多年輕工程師都深受過勞之苦。"], ["heave a sigh", "heave /hiv/", "phrase", "嘆氣", "She heaved a sigh of relief after passing the exam.", "heave a sigh of relief", "考試通過後她鬆了一口氣。"], ["make matters worse", "—", "phrase", "使情況更糟", "To make matters worse, it started to rain.", "To make matters worse, ...（句首，銜接『雪上加霜』的情節）", "更糟的是，開始下雨了。"], ["on the verge of", "verge /vɝdʒ/", "phrase", "瀕臨；接近", "She was on the verge of tears.", "on the verge of + Ving/N", "她快要哭出來了。"], ["keep one's cool", "—", "phrase", "保持冷靜", "He managed to keep his cool under pressure.", "keep/lose one's cool", "他在壓力下設法保持冷靜。"], ["throw in the towel", "—", "phrase", "放棄；認輸", "Despite the setback, she refused to throw in the towel.", "throw in the towel（源自拳擊『丟毛巾』認輸）", "儘管遭遇挫折，她仍拒絕認輸。"], ["shed light on", "shed /ʃɛd/", "phrase", "闡明；使人了解", "The report sheds light on the causes of the problem.", "shed light on + N", "這份報告闡明了這個問題的成因。"], ["come to terms with", "—", "phrase", "接受；認清（現實）", "It took him years to come to terms with the loss.", "come to terms with + N", "他花了好幾年才接受那份失落。"], ["when it comes to", "—", "phrase", "當談到……時", "When it comes to studying, consistency matters most.", "When it comes to + N/Ving, ...（句首破題常用）", "說到讀書，持之以恆最重要。"], ["at the end of the day", "—", "phrase", "說到底；歸根究底", "At the end of the day, effort matters more than talent.", "At the end of the day, ...（常用於結論段）", "說到底，努力比天分更重要。"], ["turn a blind eye to", "—", "phrase", "對……視而不見", "We should not turn a blind eye to bullying.", "turn a blind eye to + N", "我們不應該對霸凌視而不見。"], ["burst into laughter", "burst /bɝst/", "phrase", "突然大笑", "When the principal tripped over the microphone cord, the whole class burst into laughter.", "burst into laughter/tears", "校長被麥克風線絆了一下時，全班哄堂大笑。"], ["sink into frustration", "frustration /frʌsˋtreʃən/", "phrase", "陷入沮喪；意志消沉", "After failing the exam again, he sank into frustration.", "sink into + despair/depression/frustration（陷入負面情緒的萬用句型，注意 sink 為不規則動詞：sink-sank-sunk）", "再次考試不及格後，他陷入了挫折之中。"], ["be trapped in the vicious cycle", "vicious /ˋvɪʃəs/", "phrase", "陷入惡性循環", "Many students are trapped in the vicious cycle of procrastination and stress.", "be trapped/caught in a vicious cycle／break the vicious cycle（打破惡性循環）", "許多學生陷入拖延和壓力的惡性循環。"], ["hail as", "hail /hel/", "phrase", "譽為；稱頌為", "She was hailed as a pioneer in the field of renewable energy.", "be hailed as + a hero/pioneer/legend（常用被動語態，語氣正式，常見於新聞或傳記）", "她被譽為再生能源領域的先驅。"], ["legendary figure", "legendary /ˋlɛdʒəndɛrɪ/", "phrase", "傳奇人物", "Steve Jobs is often regarded as a legendary figure in the tech industry.", "a legendary figure/hero/status（常搭配 regard as/be seen as，強調『傳奇地位』；可與 hail as 連用）", "賈伯斯常被視為科技業的傳奇人物。"], ["be eligible to", "eligible /ˋɛlɪdʒəbl/", "phrase", "有資格（做某事）", "Students who maintain a high GPA are eligible to apply for the scholarship.", "be eligible to V／be eligible for + N（強調『符合資格』，常用於獎學金、投票、申請等正式情境）", "維持高平均成績的學生有資格申請這項獎學金。"], ["on behalf of", "behalf /bɪˋhæf/", "phrase", "代表；以……的名義", "On behalf of the entire team, I would like to thank you for your continuous support.", "on behalf of + N／on somebody's behalf（正式場合代表發言、致謝或致歉時常用，介系詞固定搭配 of）", "我謹代表整個團隊，感謝您一直以來的支持。"], ["indulge in", "indulge /ɪnˋdʌldʒ/", "phrase", "沉溺於；耽溺於（做某件享受的事，帶有『放縱自己』的意味）", "On weekends, she likes to indulge in a good book and a cup of coffee.", "indulge in + N/V-ing（強調『放縱自己享受』，語氣比 enjoy 更強調耽溺感；注意此片語習慣用主動語態 indulge in，而非 be indulged in）", "週末時，她喜歡享受一本好書和一杯咖啡。"], ["be immersed in", "immersed /ɪˋmɝst/", "phrase", "沉浸於；全神貫注於", "He was so immersed in the novel that he didn't notice the time passing.", "be immersed in + N（強調『全神貫注、渾然忘我』的投入狀態，常用於閱讀、工作、文化情境）", "他沉浸在小說中，連時間過去了都沒察覺。"], ["be obsessed with", "obsessed /əbˋsɛst/", "phrase", "對……著迷；沉迷於", "Many teenagers are obsessed with social media nowadays.", "be obsessed with + N（強調『著迷到近乎無法自拔』，語氣比 be interested in 更強烈）", "現在許多青少年都沉迷於社群媒體。"], ["under the veil of", "veil /vel/", "phrase", "在……的掩飾下；假借……之名", "The corrupt official carried out illegal transactions under the veil of charity work.", "under the veil of + N（強調『表面掩飾、實則另有目的』，常用於揭露虛偽或掩蓋真相的語境，也可作 under the guise of 的同義替換）", "那名貪污的官員打著慈善工作的幌子進行非法交易。"], ["to the utmost", "utmost /ˋʌtmost/", "phrase", "盡全力；達到極致", "He tried to the utmost to make the presentation flawless.", "try/do something to the utmost／to the utmost of one's ability（強調『竭盡所能』，語氣比 as much as possible 更強烈有力）", "他竭盡全力讓簡報完美無瑕。"], ["beacon of hope", "beacon /ˋbikən/", "phrase", "希望的燈塔；希望的象徵", "Despite the chaos, the volunteer center stood as a beacon of hope for the flood victims.", "a beacon of hope/light（比喻『在困境中帶來希望的人事物』，語氣正向、文學感強，適合用於作文結論或勵志敘事段落）", "儘管一片混亂，志工中心仍是水災災民的希望燈塔。"], ["out of breath", "breath /brɛθ/", "phrase", "上氣不接下氣；喘不過氣", "She was completely out of breath after sprinting to catch the bus.", "be out of breath／gasp for breath（gasp for breath 更強調『大口喘氣的動作』）", "衝刺追公車之後，她完全上氣不接下氣。"], ["reflect on", "reflect /rɪˋflɛkt/", "phrasal verb", "反思；反省（回顧並仔細思考過去的事）", "Before writing her college essay, she took time to reflect on the challenges she had overcome.", "reflect on + N/V-ing（強調『回顧並深入思考』，常用於作文結尾段回顧成長或經驗；與 ponder 相近，但 reflect on 更常用於『回顧過去經驗』的語境）", "寫大學申請文章之前，她花時間反思自己克服過的挑戰。"], ["in peril", "peril /ˋpɛrəl/", "phrase", "處於危險中", "The hikers' lives were in peril when the storm suddenly hit.", "be in peril／put sb's life in peril（peril 為名詞，語氣比 danger 正式）", "暴風雨突然來襲時，登山客的性命陷入危險。"], ["level off", "—", "phrasal v.", "趨於平穩", "After years of rapid growth, the number of convenience stores in Taiwan has finally leveled off.", "level off at + N", "經過多年的快速成長，台灣便利商店的數量終於趨於平穩。"], ["bottom out", "—", "phrasal v.", "觸底", "After falling for six months in a row, housing prices seem to have bottomed out.", "bottom out at + N", "連續下跌六個月後，房價似乎已經觸底。"], ["broaden one's horizons", "horizons /həˋraɪzənz/", "phrase", "拓展視野", "Studying abroad allowed her to broaden her horizons and embrace different cultures.", "broaden/widen one's horizons（常用於教育、旅行、閱讀等『增廣見聞』的語境）", "出國留學讓她開闊了眼界，也擁抱了不同的文化。"], ["be occupied with", "occupied /ˋɑkjəpaɪd/", "phrase", "忙於；被……佔據", "She has been so occupied with work lately that she barely has time for her family.", "be occupied with + N/Ving（語氣比 be busy with 稍正式）／keep oneself occupied（讓自己保持忙碌）", "她最近工作非常忙，幾乎沒時間陪家人。"], ["bit by bit", "—", "phrase", "一點一點地；逐漸地", "Bit by bit, she rebuilt her confidence after the setback.", "bit by bit（等同 gradually／little by little，強調『以極小的增量逐步進行』，可放句首或句尾）", "經過挫折後，她一點一點地重建了自信。"], ["wash over", "wash /wɑʃ/", "phrasal verb", "（情緒）湧上；席捲", "A wave of relief washed over her when she heard the test results.", "a wave of + emotion + wash over + 人（常與 a wave of relief/guilt/nostalgia 搭配，生動描寫情緒驟然湧現）", "聽到考試結果時，一股安心感湧上她心頭。"], ["out of the blue", "—", "phrase", "突然地；出乎意料地", "Out of the blue, an old friend called me after ten years of silence.", "out of the blue（注意要有 the，不是 out of blue；= all of a sudden，敘事文製造情節轉折很好用）", "十年沒聯絡的老朋友突然打電話給我。"], ["fritter away", "fritter /ˋfrɪtɚ/", "phrasal verb", "（一點一點地）浪費（時間、金錢）", "He frittered away his summer vacation playing mobile games.", "fritter away + time/money/opportunity（+ on N／V-ing）；比 waste 更強調「零零碎碎、不知不覺地揮霍掉」", "他把整個暑假都浪費在玩手機遊戲上。"], ["go wild", "—", "phrase", "（群眾）陷入瘋狂、欣喜若狂；（人）失控", "The crowd went wild when the home team scored in the final second.", "go wild（with joy / excitement）；描寫比賽、演唱會的歡騰場面很好用；也可指情緒失控、胡鬧", "地主隊在最後一秒得分時，全場觀眾都瘋狂了。"]]}, {"name": "17. Argument Phrases（議論文常用片語）", "rows": [["rein in", "rein /ren/", "phrasal verb", "抑制；控制（原指拉緊韁繩讓馬停下）", "The government introduced new policies to rein in inflation.", "rein in + inflation/spending/emotions（易與同音的 reign in 拼錯，注意 rein 才是『韁繩』）", "政府推出新政策來抑制通貨膨脹。"], ["resort to", "resort /rɪˋzɔrt/", "phrasal verb", "訴諸於；採取（通常指不得已採取激烈手段）", "When negotiations failed, the two countries resorted to military action.", "resort to violence/cheating/drastic measures（強調『不得已採取的手段』，語氣中性偏負面）", "談判破裂後，兩國訴諸軍事行動。"], ["fall short of", "—", "phrasal verb", "未達到（標準、期望等）；不如預期", "The outcomes fell short of the committee's expectations.", "fall short of + expectations/standards/target（強調『結果與預期之間的落差』，議論文評論表現或成效時很好用）", "結果未達委員會的期望。"], ["shoulder the load", "shoulder /ˋʃoldɚ/", "phrasal verb", "承擔重擔；扛起責任", "As the eldest child, she had to shoulder the load of caring for her younger siblings after their parents passed away.", "shoulder the load/burden/responsibility（shoulder 作動詞時比 carry 更強調『主動、堅毅地承擔』的意味）", "身為長女，父母過世後她必須扛起照顧弟妹的重擔。"], ["cater to", "cater /ˋketɚ/", "phrasal verb", "迎合；滿足（某群體的需求）", "The new policy aims to cater to the needs of low-income families.", "cater to the needs/demands of + N（常用於議論文分析政策或市場策略，強調『針對特定族群量身設計』）", "這項新政策旨在滿足低收入家庭的需求。"], ["play a pivotal role in", "pivotal /ˋpɪvətl/", "phrase", "扮演關鍵角色", "Education plays a pivotal role in shaping one's future.", "play a pivotal/crucial/key role in + N（比 play an important role 更高級）", "教育對塑造一個人的未來扮演關鍵角色。"], ["give rise to", "—", "phrase", "導致；引發", "Rapid urbanization has given rise to numerous environmental problems.", "give rise to + N（比 cause/lead to 更書面，主詞常是抽象現象）", "快速的都市化引發了許多環境問題。"], ["at the heart of", "—", "phrase", "是……的核心", "Trust lies at the heart of every successful relationship.", "lie at the heart of + N（強調『核心本質』，常搭配 lie 動詞）", "信任是每段成功關係的核心。"], ["in light of", "—", "phrase", "鑑於", "In light of recent events, the company revised its policy.", "In light of + N, ...（句首，引入『考量的依據』，正式書面）", "鑑於最近發生的事件，公司修改了政策。"], ["with regard to", "—", "phrase", "關於", "With regard to funding, the committee has yet to reach a decision.", "With regard to + N, ...（比 about 更正式，常用於轉換話題或聚焦特定面向）", "關於經費，委員會尚未做出決定。"], ["take into account", "—", "phrase", "將……納入考量", "Policymakers should take the long-term effects into account.", "take + N + into account／take into account + N（也可說 take into consideration，語意相同）", "政策制定者應該把長期影響納入考量。"], ["there is no denying that", "—", "phrase", "不可否認", "There is no denying that technology has transformed the way we communicate.", "There is no denying that + S + V（強調『事實不容反駁』，常用於段落開頭建立共識）", "不可否認，科技已經改變了我們溝通的方式。"], ["strike a balance between A and B", "—", "phrase", "在 A 與 B 之間取得平衡", "It's essential to strike a balance between work and personal life.", "strike a balance between A and B（比 balance A and B 更生動，常用於議論兩難情境）", "在工作與個人生活之間取得平衡非常重要。"], ["a double-edged sword", "—", "phrase", "雙面刃", "Social media is a double-edged sword, offering connection but also fostering isolation.", "be a double-edged sword（比喻『利弊並存』，常用於評論科技或政策）", "社群媒體是一把雙面刃，帶來連結，卻也助長孤立。"], ["more often than not", "—", "phrase", "通常；多半", "More often than not, the root cause lies in poor communication.", "More often than not, + S + V（句首，比 usually 更生動、語氣更強）", "往往根本原因在於溝通不良。"], ["a case in point", "—", "phrase", "一個恰當的例子", "A case in point is the recent rise in remote work adoption.", "a case in point（常用於舉例句型，比 for example 更正式、更適合放在句首當主詞）", "一個明顯的例子是最近遠距工作的普及。"], ["bear in mind that", "—", "phrase", "謹記；別忘了", "We must bear in mind that not everyone has equal access to resources.", "bear in mind that + S + V（提醒讀者『別忽略的前提』，常用於論證中段）", "我們必須記住，並非每個人都能平等地取得資源。"], ["in the wake of", "wake /wek/", "phrase", "在……（尤指負面事件）之後", "In the wake of the scandal, public trust in the institution plummeted.", "in the wake of + N（強調『事件發生後的連鎖影響』；wake 在此非『醒來』而是『餘波』）", "醜聞爆發後，大眾對該機構的信任一落千丈。"], ["a slippery slope", "slippery /ˋslɪpərɪ/", "phrase", "滑坡效應（一旦讓步，情況將每況愈下）", "Allowing this exception could lead to a slippery slope of further violations.", "a slippery slope argument（邏輯論證用語，警示『一步退讓、步步退讓』的風險）", "允許這個例外可能會引發一連串更多違規的連鎖效應。"], ["lie in", "—", "phrase", "在於；存在於", "The real challenge lies in changing people's deep-rooted habits, not in raising awareness.", "the problem/challenge/key lies in + N/Ving（指出『問題或關鍵的根源』，議論文常用句型，可與 at the heart of 換用）", "真正的挑戰在於改變人們根深蒂固的習慣，而不是提升意識。"], ["under no circumstances", "circumstances /ˈsɝkəmˌstænsɪz/", "phrase", "無論如何都不；絕不", "Under no circumstances should students be allowed to cheat during exams.", "Under no circumstances + should/will/can + S + V（否定副詞片語置於句首引導倒裝，語氣強烈，議論文中用於堅定表態）", "學生在任何情況下都不應該被允許在考試中作弊。"], ["reach a consensus", "consensus /kənˋsɛnsəs/", "phrase", "達成共識", "After hours of debate, the committee finally reached a consensus on the new policy.", "reach
