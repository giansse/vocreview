't study at all; therefore, he failed the exam.", "..., therefore, + S + V（強調『邏輯上必然的結果』，比 so 正式）"], ["thus", "/ðʌs/", "adv.", "因此；如此", "The company cut costs and thus increased its profit margin.", "thus + Ving／thus, + S + V（比 therefore 更精簡、書面）"], ["additionally", "/əˋdɪʃənlɪ/", "adv.", "此外", "Additionally, the program offers free tutoring for struggling students.", "Additionally, + S + V（與 moreover/furthermore 同義，可交替使用避免重複）"], ["indeed", "/ɪnˋdid/", "adv.", "的確；事實上", "The results were, indeed, better than expected.", "..., indeed, ...（插入語，用於加強語氣或補充說明）"], ["similarly", "/ˋsɪmələrlɪ/", "adv.", "同樣地", "Similarly, students who read regularly tend to write better.", "Similarly, + S + V（用於承接『類似』的論點）"], ["accordingly", "/əˋkɔrdɪŋlɪ/", "adv.", "因此；相應地", "The rules have changed; students must adjust their study plans accordingly.", "..., accordingly（句尾，強調『依此』調整）／Accordingly, + S + V（句首）"], ["eventually", "/ɪˋvɛntʃʊəlɪ/", "adv.", "最終", "After months of practice, she eventually mastered the skill.", "eventually + V（強調『經過一段過程後』的結果，常用於敘事或結論）"], ["subsequently", "/ˋsʌbsɪkwəntlɪ/", "adv.", "隨後；其後", "The company launched the product in March; subsequently, sales exceeded all expectations.", "..., subsequently, + S + V（強調『按時間順序接續發生』，比 then 更正式書面）"]]}, {"name": "13. Health & Emergency Vocabulary（醫療與緊急狀況字彙）", "rows": [["contract", "/kənˋtrækt/", "v.", "染上；罹患（疾病）", "She contracted a rare disease during her trip abroad.", "contract an illness/a disease/a virus（正式，比 get/catch sick 高級）"], ["ailment", "/ˋelmənt/", "n.", "疾病；病痛（多指輕微或慢性）", "Regular exercise can help prevent common ailments.", "suffer from/a minor ailment（比 sickness 正式）"], ["malady", "/ˋmælədɪ/", "n.", "疾病；（比喻）弊病", "Loneliness is often described as a modern malady.", "a social/modern malady（常用於比喻『社會通病』，文學語氣濃厚）"], ["affliction", "/əˋflɪkʃən/", "n.", "病痛；苦難", "He has lived with a chronic affliction since childhood.", "be afflicted with + 疾病／a chronic affliction"], ["recuperate", "/rɪˋkjupəret/", "v.", "康復；療養", "He is recuperating at home after the operation.", "recuperate from + 疾病/手術（比 recover 正式、書面）"]]}, {"name": "14. Everyday Life Vocabulary（日常生活情境字彙）", "rows": [["botch", "/bɑtʃ/", "v.", "搞砸（較正式，語氣近 mess up）", "He botched the interview by arriving twenty minutes late.", "botch a job/an attempt/an interview（比 mess up 稍正式書面）"], ["bungle", "/ˋbʌŋgl/", "v.", "笨手笨腳地搞砸", "The team bungled the project due to poor communication.", "bungle a plan/an operation（強調『因笨拙、缺乏能力』而搞砸）"], ["dilemma", "/dɪˋlɛmə/", "n.", "困境；進退兩難的處境", "She found herself in a moral dilemma when she discovered her best friend had cheated on the exam.", "face/be in a dilemma／a moral dilemma（常搭配 face, be in, resolve 等動詞，強調『左右為難』的抉擇困境，可與 at a crossroads 搭配使用）"], ["affair", "/əˋfɛr/", "n.", "事務；事情（常用複數指時事、局勢）", "Keeping up with current affairs is essential for writing a well-informed argumentative essay.", "current affairs（時事，議論文審題常用）／a state of affairs（事態、局面）"]]}, {"name": "15. Precise Human Subject Nouns（精準人稱主詞，避免濫用 people／individual）", "rows": [["urban dweller", "/ˋɝbən ˋdwɛlɚ/", "n.", "都市居民", "Urban dwellers often suffer from chronic stress due to noise and overcrowding.", "urban dwellers vs. rural residents（都市居民 vs. 鄉村居民，都市化／環境議題的精準主詞）"], ["commuter", "/kəˋmjutɚ/", "n.", "通勤者", "Commuters spend hours stuck in traffic every day.", "daily commuters／rush-hour commuters（交通議題常用主詞）"], ["adolescent", "/ædlˋɛsnt/", "n./adj.", "青少年", "Adolescents are particularly vulnerable to peer pressure on social media.", "adolescents（比 teenagers 更正式書面，議論文常用，可替換過度使用的 young people）"], ["the elderly", "elderly /ˋɛldɚlɪ/", "n.", "老年人（集合稱呼，動詞用複數）", "The elderly are often left behind in the rapid digitalization of society.", "the elderly／senior citizens（the + 形容詞表『某一類人』的集合用法，取代籠統的 old people）"], ["pedestrian", "/pəˋdɛstrɪən/", "n.", "行人", "Pedestrians are increasingly at risk on streets dominated by delivery scooters.", "pedestrian safety／a pedestrian crossing（交通安全議題的精準主詞）"], ["policymaker", "/ˋpɑləsimekɚ/", "n.", "政策制定者", "Policymakers must weigh economic growth against environmental protection.", "policymakers vs. the general public（政策類議論文的關鍵對照主詞）"], ["the underprivileged", "underprivileged /ʌndɚˋprɪvəlɪdʒd/", "n.", "弱勢族群（集合稱呼，動詞用複數）", "Scholarship programs aim to give the underprivileged equal access to education.", "the underprivileged／the disadvantaged（取代籠統的 poor people，語氣更正式中性）"], ["bystander", "/ˋbaɪstændɚ/", "n.", "旁觀者", "Many bystanders filmed the accident instead of calling for help.", "an innocent bystander／bystander apathy（旁觀者冷漠效應，社會議題常用詞組）"], ["proponent", "/prəˋponənt/", "n.", "支持者；提倡者", "Proponents of remote work argue that it boosts productivity and morale.", "proponents of + N（比 supporters 正式，常與 critics/opponents 成對使用，構成正反對照句型）"], ["critic", "/ˋkrɪtɪk/", "n.", "批評者", "Critics of the policy warn that it could widen the wealth gap.", "critics of + N（常與 proponents/advocates 對照，議論文正反論述必備主詞）"], ["taxpayer", "/ˋtækspeɚ/", "n.", "納稅人", "Taxpayers ultimately bear the cost of the government's new subsidy program.", "taxpayer money／ordinary taxpayers（政策成本、公共支出議題的精準主詞）"], ["caregiver", "/ˋkɛrgɪvɚ/", "n.", "照顧者", "Caregivers often sacrifice their own careers to look after aging parents.", "family caregivers／unpaid caregivers（高齡化、家庭議題常用主詞）"]]}, {"name": "16. Phrases（實用高分片語）", "rows": [["take a deep breath", "—", "phrase", "深呼吸", "She took a deep breath.", "take a deep breath before Ving"], ["in tears", "—", "phrase", "流著淚", "She was in tears.", "be in tears／burst into tears"], ["in panic", "panic /ˋpænɪk/", "phrase", "驚慌地", "Students ran in panic.", "in a state of panic"], ["swallow hard", "—", "phrase", "緊張地吞口水", "He swallowed hard.", "swallow hard before Ving"], ["gear up for", "gear /gɪr/", "phrasal verb", "為……做準備", "Students gear up for exams.", "gear up for + N"], ["suffer from burnout", "burnout /ˋbɝnaʊt/", "phrase", "遭受身心過勞", "Many suffer from burnout.", "suffer from + 疾病/burnout"], ["heave a sigh", "heave /hiv/", "phrase", "嘆氣", "She heaved a sigh of relief after passing the exam.", "heave a sigh of relief"], ["make matters worse", "—", "phrase", "使情況更糟", "To make matters worse, it started to rain.", "To make matters worse, ...（句首，銜接『雪上加霜』的情節）"], ["on the verge of", "verge /vɝdʒ/", "phrase", "瀕臨；接近", "She was on the verge of tears.", "on the verge of + Ving/N"], ["keep one's cool", "—", "phrase", "保持冷靜", "He managed to keep his cool under pressure.", "keep/lose one's cool"], ["throw in the towel", "—", "phrase", "放棄；認輸", "Despite the setback, she refused to throw in the towel.", "throw in the towel（源自拳擊『丟毛巾』認輸）"], ["shed light on", "shed /ʃɛd/", "phrase", "闡明；使人了解", "The report sheds light on the causes of the problem.", "shed light on + N"], ["come to terms with", "—", "phrase", "接受；認清（現實）", "It took him years to come to terms with the loss.", "come to terms with + N"], ["when it comes to", "—", "phrase", "當談到……時", "When it comes to studying, consistency matters most.", "When it comes to + N/Ving, ...（句首破題常用）"], ["at the end of the day", "—", "phrase", "說到底；歸根究底", "At the end of the day, effort matters more than talent.", "At the end of the day, ...（常用於結論段）"], ["turn a blind eye to", "—", "phrase", "對……視而不見", "We should not turn a blind eye to bullying.", "turn a blind eye to + N"], ["burst into laughter", "burst /bɝst/", "phrase", "突然大笑", "The whole class burst into laughter.", "burst into laughter/tears"], ["sink into frustration", "frustration /frʌsˋtreʃən/", "phrase", "陷入沮喪；意志消沉", "After failing the exam again, he sank into frustration.", "sink into + despair/depression/frustration（陷入負面情緒的萬用句型，注意 sink 為不規則動詞：sink-sank-sunk）"], ["be trapped in the vicious cycle", "vicious /ˋvɪʃəs/", "phrase", "陷入惡性循環", "Many students are trapped in the vicious cycle of procrastination and stress.", "be trapped/caught in a vicious cycle／break the vicious cycle（打破惡性循環）"], ["hail as", "hail /hel/", "phrase", "譽為；稱頌為", "She was hailed as a pioneer in the field of renewable energy.", "be hailed as + a hero/pioneer/legend（常用被動語態，語氣正式，常見於新聞或傳記）"], ["legendary figure", "legendary /ˋlɛdʒəndɛrɪ/", "phrase", "傳奇人物", "Steve Jobs is often regarded as a legendary figure in the tech industry.", "a legendary figure/hero/status（常搭配 regard as/be seen as，強調『傳奇地位』；可與 hail as 連用）"], ["be eligible to", "eligible /ˋɛlɪdʒəbl/", "phrase", "有資格（做某事）", "Students who maintain a high GPA are eligible to apply for the scholarship.", "be eligible to V／be eligible for + N（強調『符合資格』，常用於獎學金、投票、申請等正式情境）"], ["on behalf of", "behalf /bɪˋhæf/", "phrase", "代表；以……的名義", "On behalf of the entire team, I would like to thank you for your continuous support.", "on behalf of + N／on somebody's behalf（正式場合代表發言、致謝或致歉時常用，介系詞固定搭配 of）"], ["indulge in", "indulge /ɪnˋdʌldʒ/", "phrase", "沉溺於；耽溺於（做某件享受的事，帶有『放縱自己』的意味）", "On weekends, she likes to indulge in a good book and a cup of coffee.", "indulge in + N/V-ing（強調『放縱自己享受』，語氣比 enjoy 更強調耽溺感；注意此片語習慣用主動語態 indulge in，而非 be indulged in）"], ["be immersed in", "immersed /ɪˋmɝst/", "phrase", "沉浸於；全神貫注於", "He was so immersed in the novel that he didn't notice the time passing.", "be immersed in + N（強調『全神貫注、渾然忘我』的投入狀態，常用於閱讀、工作、文化情境）"], ["be obsessed with", "obsessed /əbˋsɛst/", "phrase", "對……著迷；沉迷於", "Many teenagers are obsessed with social media nowadays.", "be obsessed with + N（強調『著迷到近乎無法自拔』，語氣比 be interested in 更強烈）"], ["under the veil of", "veil /vel/", "phrase", "在……的掩飾下；假借……之名", "The corrupt official carried out illegal transactions under the veil of charity work.", "under the veil of + N（強調『表面掩飾、實則另有目的』，常用於揭露虛偽或掩蓋真相的語境，也可作 under the guise of 的同義替換）"], ["to the utmost", "utmost /ˋʌtmost/", "phrase", "盡全力；達到極致", "He tried to the utmost to make the presentation flawless.", "try/do something to the utmost／to the utmost of one's ability（強調『竭盡所能』，語氣比 as much as possible 更強烈有力）"], ["beacon of hope", "beacon /ˋbikən/", "phrase", "希望的燈塔；希望的象徵", "Despite the chaos, the volunteer center stood as a beacon of hope for the flood victims.", "a beacon of hope/light（比喻『在困境中帶來希望的人事物』，語氣正向、文學感強，適合用於作文結論或勵志敘事段落）"], ["out of breath", "breath /brɛθ/", "phrase", "上氣不接下氣；喘不過氣", "She was completely out of breath after sprinting to catch the bus.", "be out of breath／gasp for breath（gasp for breath 更強調『大口喘氣的動作』）"], ["reflect on", "reflect /rɪˋflɛkt/", "phrasal verb", "反思；反省（回顧並仔細思考過去的事）", "Before writing her college essay, she took time to reflect on the challenges she had overcome.", "reflect on + N/V-ing（強調『回顧並深入思考』，常用於作文結尾段回顧成長或經驗；與 ponder 相近，但 reflect on 更常用於『回顧過去經驗』的語境）"], ["in peril", "peril /ˋpɛrəl/", "phrase", "處於危險中", "The hikers' lives were in peril when the storm suddenly hit.", "be in peril／put sb's life in peril（peril 為名詞，語氣比 danger 正式）"], ["level off", "—", "phrasal v.", "趨於平穩", "Growth finally leveled off.", "level off at + N"], ["bottom out", "—", "phrasal v.", "觸底", "Prices seem to have bottomed out.", "bottom out at + N"], ["broaden one's horizons", "horizons /həˋraɪzənz/", "phrase", "拓展視野", "Studying abroad allowed her to broaden her horizons and embrace different cultures.", "broaden/widen one's horizons（常用於教育、旅行、閱讀等『增廣見聞』的語境）"], ["be occupied with", "occupied /ˋɑkjəpaɪd/", "phrase", "忙於；被……佔據", "She has been so occupied with work lately that she barely has time for her family.", "be occupied with + N/Ving（語氣比 be busy with 稍正式）／keep oneself occupied（讓自己保持忙碌）"]]}, {"name": "17. Argument Phrases（議論文常用片語）", "rows": [["rein in", "rein /ren/", "phrasal verb", "抑制；控制（原指拉緊韁繩讓馬停下）", "The government introduced new policies to rein in inflation.", "rein in + inflation/spending/emotions（易與同音的 reign in 拼錯，注意 rein 才是『韁繩』）"], ["resort to", "resort /rɪˋzɔrt/", "phrasal verb", "訴諸於；採取（通常指不得已採取激烈手段）", "When negotiations failed, the two countries resorted to military action.", "resort to violence/cheating/drastic measures（強調『不得已採取的手段』，語氣中性偏負面）"], ["fall short of", "—", "phrasal verb", "未達到（標準、期望等）；不如預期", "The outcomes fell short of the committee's expectations.", "fall short of + expectations/standards/target（強調『結果與預期之間的落差』，議論文評論表現或成效時很好用）"], ["shoulder the load", "shoulder /ˋʃoldɚ/", "phrasal verb", "承擔重擔；扛起責任", "As the eldest child, she had to shoulder the load of caring for her younger siblings after their parents passed away.", "shoulder the load/burden/responsibility（shoulder 作動詞時比 carry 更強調『主動、堅毅地承擔』的意味）"], ["cater to", "cater /ˋketɚ/", "phrasal verb", "迎合；滿足（某群體的需求）", "The new policy aims to cater to the needs of low-income families.", "cater to the needs/demands of + N（常用於議論文分析政策或市場策略，強調『針對特定族群量身設計』）"], ["play a pivotal role in", "pivotal /ˋpɪvətl/", "phrase", "扮演關鍵角色", "Education plays a pivotal role in shaping one's future.", "play a pivotal/crucial/key role in + N（比 play an important role 更高級）"], ["give rise to", "—", "phrase", "導致；引發", "Rapid urbanization has given rise to numerous environmental problems.", "give rise to + N（比 cause/lead to 更書面，主詞常是抽象現象）"], ["at the heart of", "—", "phrase", "是……的核心", "Trust lies at the heart of every successful relationship.", "lie at the heart of + N（強調『核心本質』，常搭配 lie 動詞）"], ["in light of", "—", "phrase", "鑑於", "In light of recent events, the company revised its policy.", "In light of + N, ...（句首，引入『考量的依據』，正式書面）"], ["with regard to", "—", "phrase", "關於", "With regard to funding, the committee has yet to reach a decision.", "With regard to + N, ...（比 about 更正式，常用於轉換話題或聚焦特定面向）"], ["take into account", "—", "phrase", "將……納入考量", "Policymakers should take the long-term effects into account.", "take + N + into account／take into account + N（也可說 take into consideration，語意相同）"], ["there is no denying that", "—", "phrase", "不可否認", "There is no denying that technology has transformed the way we communicate.", "There is no denying that + S + V（強調『事實不容反駁』，常用於段落開頭建立共識）"], ["strike a balance between A and B", "—", "phrase", "在 A 與 B 之間取得平衡", "It's essential to strike a balance between work and personal life.", "strike a balance between A and B（比 balance A and B 更生動，常用於議論兩難情境）"], ["a double-edged sword", "—", "phrase", "雙面刃", "Social media is a double-edged sword, offering connection but also fostering isolation.", "be a double-edged sword（比喻『利弊並存』，常用於評論科技或政策）"], ["more often than not", "—", "phrase", "通常；多半", "More often than not, the root cause lies in poor communication.", "More often than not, + S + V（句首，比 usually 更生動、語氣更強）"], ["a case in point", "—", "phrase", "一個恰當的例子", "A case in point is the recent rise in remote work adoption.", "a case in point（常用於舉例句型，比 for example 更正式、更適合放在句首當主詞）"], ["bear in mind that", "—", "phrase", "謹記；別忘了", "We must bear in mind that not everyone has equal access to resources.", "bear in mind that + S + V（提醒讀者『別忽略的前提』，常用於論證中段）"], ["in the wake of", "wake /wek/", "phrase", "在……（尤指負面事件）之後", "In the wake of the scandal, public trust in the institution plummeted.", "in the wake of + N（強調『事件發生後的連鎖影響』；wake 在此非『醒來』而是『餘波』）"], ["a slippery slope", "slippery /ˋslɪpərɪ/", "phrase", "滑坡效應（一旦讓步，情況將每況愈下）", "Allowing this exception could lead to a slippery slope of further violations.", "a slippery slope argument（邏輯論證用語，警示『一步退讓、步步退讓』的風險）"], ["lie in", "—", "phrase", "在於；存在於", "The real challenge lies in changing people's deep-rooted habits, not in raising awareness.", "the problem/challenge/key lies in + N/Ving（指出『問題或關鍵的根源』，議論文常用句型，可與 at the heart of 換用）"], ["under no circumstances", "circumstances /ˈsɝkəmˌstænsɪz/", "phrase", "無論如何都不；絕不", "Under no circumstances should students be allowed to cheat during exams.", "Under no circumstances + should/will/can + S + V（否定副詞片語置於句首引導倒裝，語氣強烈，議論文中用於堅定表態）"], ["reach a consensus", "consensus /kənˋsɛnsəs/", "phrase", "達成共識", "After hours of debate, the committee finally reached a consensus on the new policy.", "reach a consensus on + N（議論文常用於描述多方討論後的結果）／a general consensus（普遍共識）"]]}, {"name": "18. Health & Emergency Phrases（醫療與緊急狀況片語）", "rows": [["fall ill", "—", "phrase", "患病", "He fell ill just days before the competition.", "fall ill with + 疾病（比 get sick 稍正式）"], ["come down with", "—", "phrasal verb", "染上；患上（較輕微疾病）", "He came down with a bad cold over the weekend.", "come down with + a cold/flu/fever（比 get sick 正式一些，但仍算口語，常接輕症）"], ["be afflicted with", "afflicted /əˋflɪktɪd/", "phrase", "罹患；受……所苦", "The region was afflicted with severe drought.", "be afflicted with + 疾病/災難（正式書面用語，也可用於疾病以外的苦難）"], ["seek medical attention", "seek /sik/", "phrase", "尋求醫療協助", "If symptoms persist, one should seek medical attention immediately.", "seek medical attention/advice/treatment（比 see a doctor 正式）"], ["consult a physician", "physician /fəˋzɪʃən/", "phrase", "就診；請教醫師", "It is advisable to consult a physician before taking any medication.", "consult a physician/specialist（physician 比 doctor 正式）"], ["be hospitalized", "hospitalized /ˋhɑspɪtəlaɪzd/", "phrase", "住院", "He was hospitalized for a week due to pneumonia.", "be hospitalized for/with + 疾病"], ["undergo treatment", "undergo /ʌndɚˋgo/", "phrase", "接受治療（亦可說 undergo surgery/an operation）", "She had to undergo surgery after the accident.", "undergo treatment/surgery/an operation"], ["alert the authorities", "authorities /əˋθɔrətɪz/", "phrase", "通知當局；報警", "Witnesses immediately alerted the authorities after the incident.", "alert the authorities/the police（比 call the police 正式）"], ["report the incident to the police", "incident /ˋɪnsədənt/", "phrase", "向警方報案", "She reported the incident to the police right away.", "report + 事件 + to the police/authorities"], ["summon emergency assistance", "summon /ˋsʌmən/", "phrase", "呼叫緊急救援", "Bystanders quickly summoned emergency assistance for the injured man.", "summon + help/assistance/emergency services（summon 比 call 正式、書面）"], ["law enforcement officers", "enforcement /ɪnˋfɔrsmənt/", "n. phrase", "執法人員（警察的正式說法）", "Law enforcement officers arrived at the scene within minutes.", "law enforcement officers/agencies（比 police 正式，常用於新聞或議論文）"], ["dial the emergency hotline", "emergency /ɪˋmɝdʒənsɪ/", "phrase", "撥打緊急專線", "In case of fire, one should dial the emergency hotline immediately.", "在台灣：110（報警）／119（消防、救護）；作文中可泛稱 dial the emergency hotline"]]}, {"name": "19. Everyday Life Phrases（日常生活情境片語）", "rows": [["mess up", "—", "phrasal verb", "搞砸；出差錯", "He messed up the final presentation due to nerves.", "mess up + N／mess things up（口語但很常用；較正式可換成 botch/bungle）"], ["in a catastrophic mess", "catastrophic /kætəˋstrɑfɪk/", "phrase", "陷入極度混亂；一團糟", "After the storm, the entire city was left in a catastrophic mess.", "leave sth in a mess → a complete mess → a catastrophic mess（混亂程度依序遞增）"], ["at a crossroads", "crossroads /ˋkrɔsrodz/", "phrase", "面臨抉擇；站在人生的十字路口", "After graduation, she found herself at a crossroads, unsure which career path to choose.", "be/stand at a crossroads（常用於人生重大抉擇的情境）"], ["weigh the pros and cons", "weigh /we/", "phrase", "權衡利弊", "Before making a decision, it is wise to weigh the pros and cons.", "weigh the pros and cons of + N/Ving"], ["make a snap decision", "snap /snæp/", "phrase", "倉促做決定", "He regretted making a snap decision without consulting his family.", "make a snap decision／a snap judgment（強調『未經思考』）"], ["patch things up", "patch /pætʃ/", "phrase", "和好；修補關係", "The two friends finally patched things up after months of silence.", "patch things up with + 人（常用於『和好』的情境）"], ["drift apart", "drift /drɪft/", "phrase", "（感情、友情）漸行漸遠", "The two of them gradually drifted apart after moving to different cities.", "drift apart from + 人（強調『非刻意、逐漸』疏遠）"], ["see eye to eye", "—", "phrase", "意見一致", "The siblings rarely see eye to eye on financial matters.", "see eye to eye on/with + N（常用否定句：don't see eye to eye）"], ["rack one's brains", "rack /ræk/", "phrase", "絞盡腦汁", "She racked her brains trying to solve the math problem.", "rack one's brains for/over + N"], ["race against time", "—", "phrase", "與時間賽跑", "Rescuers raced against time to save the trapped miners.", "race against time to V（強調『時間緊迫』）"], ["against all odds", "odds /ɑdz/", "phrase", "克服萬難；不畏艱難", "Against all odds, the team won the championship.", "Against all odds, + S + V（句首，常用於逆轉勝的情境）"], ["a blessing in disguise", "disguise /dɪsˋgaɪz/", "phrase", "因禍得福；塞翁失馬", "Losing that job turned out to be a blessing in disguise.", "turn out to be a blessing in disguise"], ["learn something the hard way", "—", "phrase", "從慘痛經驗中學到教訓", "He learned the importance of saving money the hard way.", "learn + N + the hard way（常用於結論段，帶出『領悟』）"], ["tuition fee", "tuition /tjuˋɪʃən/", "n. phrase", "學費", "Many students take up part-time jobs to help cover their tuition fees.", "pay/cover/afford tuition fees（也可單用 tuition 表示學費，如 tuition assistance／此條為實用詞彙而非慣用語，先併入本類方便查找）"]]}, {"name": "20. Transition Phrases（轉承片語）", "rows": [["as a result", "—", "phrase", "因此；結果", "He skipped every class; as a result, he failed the course.", "as a result of + N（介系詞用法）／..., as a result, + S + V"], ["on the other hand", "—", "phrase", "另一方面", "On the other hand, some argue that technology isolates people.", "On the one hand..., on the other hand...（常成對使用以呈現對比觀點）"], ["in other words", "—", "phrase", "換句話說", "He wasn't invited; in other words, he was excluded on purpose.", "..., in other words, ...（用於重新詮釋前句，幫助讀者理解）"], ["for instance", "instance /ˋɪnstəns/", "phrase", "舉例來說", "Many hobbies can relieve stress; reading, for instance, is both calming and enriching.", "..., for instance, ...（與 for example 同義，可交替使用避免重複）"], ["that said", "—", "phrase", "話雖如此", "The plan has risks; that said, it is still worth trying.", "That said, + S + V（句首讓步轉折，語氣比 however 稍委婉）"], ["all in all", "—", "phrase", "總而言之", "All in all, the trip was a memorable experience despite the rain.", "All in all, + S + V（常用於結論段，總結整體評價）"], ["needless to say", "—", "phrase", "不用說；不言而喻", "Needless to say, hard work is the key to success.", "Needless to say, + S + V（強調『顯而易見』的道理，常用於破題或呼應主題句）"], ["in a nutshell", "nutshell /ˋnʌtʃɛl/", "phrase", "簡而言之", "In a nutshell, the project failed due to poor planning.", "In a nutshell, + S + V（比 in short 更生動口語化，但仍適用於一般寫作）"], ["by the same token", "token /ˋtokən/", "phrase", "同樣地；基於同樣的道理", "She respects her teachers; by the same token, she expects respect from her students.", "By the same token, + S + V（比 similarly 更強調『邏輯上同理』）"], ["on top of that", "—", "phrase", "除此之外（更進一步，語氣較強）", "He lost his job; on top of that, his car broke down the same week.", "On top of that, + S + V（比 moreover 更口語，強調『雪上加霜』式的累加）"], ["judge from", "—", "phrase", "從……判斷；依據……推斷", "Judging from his tone, he was clearly upset about the decision.", "Judging from + N, S + V（句首推斷句型，實際使用時多為 Judging from，等同 based on/according to）"], ["from then on", "—", "phrase", "從那時起；從此以後", "He failed the exam once during his first year; from then on, he studied harder than anyone else in class.", "From then on, + S + V（常用於敘事文標記『轉折後持續改變』的時間點，比 since then 更口語敘事化）"], ["last but not least", "—", "phrase", "最後一點但同樣重要", "Last but not least, effective communication is essential for teamwork.", "Last but not least, + S + V（常用於列點的最後一項，強調『雖列在最後但同樣重要』）"]]}], "sentenceBank": [{"en": "He couldn’t fall asleep, tossing and turning on the bed overnight. He suffered from insomnia.", "zh": "他整夜在床上輾轉反側無法入睡，深受失眠之苦。"}, {"en": "He murdered the song off key just like a chicken being choked. A burst of neighing laughter erupted from the crowd, wild and untamed.", "zh": "他唱歌唱得走音且極其難聽，簡直就像一隻被掐住脖子的雞。人群中爆發出一陣馬嘶般的狂笑，野性而放蕩不羈。"}, {"en": "Upon feasting my eyes on the lucid air, the magnificent scenery and the sapphire sea, I forgot all the fatigue and frustration accumulated from the monthly examinations.", "zh": "一看到清澈的空氣、壯麗的景色與寶石藍的大海，我便忘卻了月考累積的所有疲憊與挫折。"}, {"en": "Life, for others, is a bed of roses and a bowl of cherries; however, for me, it is a bumpy road with numerous twists and turns.", "zh": "對其他人而言，生活是一床順遂的玫瑰與一碗甜美的櫻桃（順風順水）；然而對我來說，卻是一條充滿曲折與坎坷的崎嶇之路。"}, {"en": "Life is like a box of chocolate as well; you will never know which flavor you will pick.", "zh": "人生就像一盒巧克力，你永遠不會知道你會挑到哪種口味。"}, {"en": "Life is like ECG; without ups and downs, you are not living.", "zh": "人生就像心電圖；沒有起伏跌宕，你就等於沒有活過。"}, {"en": "Spring has transformed the outskirts of the metropolis into paradise.", "zh": "春天將這座大都會的郊區蛻變成了天堂。"}, {"en": "Sunlight shone upon the earth, and the breeze sang softly.", "zh": "陽光撒在大地上，微風輕聲吟唱。"}, {"en": "She burst into tears with her eyes blurred by teardrops.", "zh": "她潸然淚下，雙眼被淚水所模糊。"}, {"en": "The lush green meadow spread across hills and valleys just like a tremendous carpet.", "zh": "蒼翠茂密的草地如同一塊巨大的地毯，綿延覆蓋了山丘與山谷。"}, {"en": "Radiant and brilliant flowers of all sorts were in full blossom in the garden.", "zh": "花園裡繁花盛開，各式各樣璀璨奪目的花朵爭奇鬥艷。"}, {"en": "He sprained his arm, strained his muscle and scratched his skin. He got severely injured.", "zh": "他扭傷了手臂、拉傷了肌肉，還劃破了皮膚，受了極為嚴重的傷。"}, {"en": "She unzipped her lips as if to say something but remained silent.", "zh": "她張開雙唇彷彿想說些什麼，卻依然保持沉默。"}, {"en": "We began to strike up a conversation, sharing the bitterness and sweetness of our lives with one another.", "zh": "我們開始攀談起來，彼此分享著各自生活中的酸甜苦辣。"}, {"en": "Fatigued and exhausted, they ultimately reached the destination, only to find the area outside the building packed with a sea of faces to a degree that they could not see the contour.", "zh": "他們筋疲力竭地終於抵達了目的地，卻發現大樓外早已擠滿了茫茫人海，甚至連建築物的輪廓都看不清。"}, {"en": "Upon hearing the devastating shipwreck, my eyeballs popped out of my head.", "zh": "一聽到那起毀滅性的船難訊息，我震驚得目瞪口呆（眼睛差點掉出來）。"}, {"en": "Upon hearing the devastating shipwreck, my eye sockets turned into a wide-open faucet, tears gushing out of control.", "zh": "一聽到那起毀滅性的船難訊息，我的眼眶就像開了的水龍頭一樣，淚水完全失控流下。"}, {"en": "The children laughed and hopped around joyfully, their little hands waving in the air like untamed leaves in the wind.", "zh": "孩子們歡笑著快樂地到處蹦蹦跳跳，他們的小手在空中揮舞，宛如隨風飛揚的野性落葉。"}, {"en": "When we were on the brink of defeat with [Project Name / The Game], everyone thought it was over. But we refused to be counted out. Through sheer grit, we turned the tide and snatched victory from the jaws of defeat.", "zh": "當 [專案/比賽] 面臨失敗邊緣時，所有人都以為結束了。但我們拒絕認輸。憑藉著純粹的毅力，我們扭轉了局勢，從失敗的虎口中奪回了勝利。"}, {"en": "The crowd erupted into thunderous applause and cheers.", "zh": "群眾爆發出雷鳴般的掌聲與歡呼聲。"}, {"en": "With a face beaming with joy, she rushed to hug her parents at the airport.", "zh": "帶著洋溢喜悅的臉龐，她衝上前擁抱在機場等候的父母。"}, {"en": "The two of them clashed like thunder meeting lightning, their fists flying in a blur of raw fury, until at last both collapsed to the ground, breathless and battered.", "zh": "兩人交鋒恰如雷電相擊，拳頭在狂怒中翻飛成一片模糊，直到最後雙雙癱倒在地，氣喘吁吁、遍體鱗傷。"}, {"en": "The veil of mystery surrounded the government's new policy.", "zh": "神秘的面紗籠罩著政府的新政策。"}, {"en": "While proponents argue that social media fosters global connectivity, critics contend that it exacerbates feelings of isolation among young people.", "zh": "支持者主張社群媒體促進全球連結，批評者則認為它加劇了年輕人的孤立感。"}, {"en": "The rising rate of academic burnout can largely be attributed to excessive competition, which in turn undermines students' overall well-being.", "zh": "學業倦怠率上升很大程度上可歸因於過度競爭，而這反過來又損害了學生的整體福祉。"}, {"en": "Rather than viewing artificial intelligence as either a blessing or a curse, we should recognize the complexity of its impact on society.", "zh": "與其將人工智慧視為單純的福音或詛咒，我們應該認清它對社會影響的複雜性。"}, {"en": "His face flushed crimson with rage, and his clenched fists trembled as he fought to hold back the urge to scream.", "zh": "他的臉因盛怒而漲得通紅，緊握的拳頭顫抖著，強忍住想放聲怒吼的衝動。"}, {"en": "A cold shiver ran down her spine as the footsteps grew closer, her heart pounding so violently she thought it might burst from her chest.", "zh": "一陣寒意順著她的背脊竄下，腳步聲越來越近，她的心臟猛烈地跳動，彷彿隨時都會從胸口迸裂。"}, {"en": "Staring blankly at the rejection letter, he felt as though the last flicker of hope within him had been extinguished for good.", "zh": "他茫然地盯著那封拒絕信，感覺內心最後一絲希望的火光已徹底熄滅。"}, {"en": "Her palms grew clammy and her mind went blank the moment she stepped onto the stage, every pair of eyes in the audience pressing down on her like a physical weight.", "zh": "她一踏上舞台，手心就開始冒汗，腦中一片空白，觀眾的目光如同實質的重量般壓在她身上。"}, {"en": "Heat crept up his neck and flushed across his cheeks as the entire classroom burst into laughter at his mistake.", "zh": "當全班因他的失誤而爆出笑聲時，一股熱意從他的頸部竄升，蔓延至臉頰。"}, {"en": "A pang of envy twisted in her chest as she watched her classmate proudly hold up the trophy she had once dreamed of winning.", "zh": "看著同學驕傲地舉起她曾夢寐以求的獎盃，一陣忌妒感在她胸口糾結。"}, {"en": "Gulping down her water and perspiring profusely in the scorching heat, she leaned against the wall, utterly out of breath.", "zh": "她大口灌下水，在酷熱中汗流浹背，接著疲憊地靠在牆上直喘氣。"}], "lastUpdated": "2026-10-02（修正：句子朗讀改用自然語速、挑選較佳語音；修正側欄標題與條目數重疊的排版問題）"}</script>
<script>
(function () {
  // ---- Sidebar collapse/expand ----
  const sidebar = document.getElementById('sidebar');
  const collapseBtn = document.getElementById('collapseBtn');
  const expandBtn = document.getElementById('expandBtn');
  const SIDEBAR_KEY = 'vocabBankSidebarCollapsed';

  function setSidebarCollapsed(collapsed) {
    sidebar.classList.toggle('collapsed', collapsed);
    document.body.classList.toggle('sidebar-collapsed', collapsed);
    expandBtn.hidden = !collapsed;
    sidebar.setAttribute('aria-hidden', collapsed ? 'true' : 'false');
    try { localStorage.setItem(SIDEBAR_KEY, collapsed ? '1' : '0'); } catch (e) {}
  }

  collapseBtn.addEventListener('click', () => setSidebarCollapsed(true));
  expandBtn.addEventListener('click', () => {
    setSidebarCollapsed(false);
    document.getElementById('searchInput').focus();
  });

  let startCollapsed = false;
  try { startCollapsed = localStorage.getItem(SIDEBAR_KEY) === '1'; } catch (e) {}
  setSidebarCollapsed(startCollapsed);

  const data = JSON.parse(document.getElementById('vocab-data').textContent);
  const content = document.getElementById('content');
  const navList = document.getElementById('navList');
  const emptyState = document.getElementById('emptyState');

  document.getElementById('docTitle').textContent = '英文作文單字與句型庫';
  document.getElementById('lastUpdated').textContent = data.lastUpdated;

  const totalWords = data.categories.reduce((s, c) => s + c.rows.length, 0);
  document.getElementById('entryCount').textContent = (totalWords + data.sentenceBank.length) + ' 個條目';

  const metaEl = document.getElementById('heroMeta');
  data.meta.slice(0, 3).forEach(m => {
    const parts = m.split('：');
    const span = document.createElement('span');
    if (parts.length > 1) {
      span.innerHTML = '<strong>' + parts[0] + '：</strong>' + parts.slice(1).join('：');
    } else {
      span.textContent = m;
    }
    metaEl.appendChild(span);
  });
  document.getElementById('heroNote').textContent = data.meta[3] || '';

  function posClass(pos) {
    const p = (pos || '').toLowerCase();
    if (p.startsWith('v')) return 'v';
    if (p.startsWith('adj')) return 'adj';
    if (p.startsWith('adv')) return 'adv';
    if (p.startsWith('n')) return 'n';
    if (p.includes('phrase')) return 'phrase';
    return 'default';
  }

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---- Text-to-speech (read aloud) ----
  // Uses the browser's built-in Web Speech API — no network/API key needed,
  // so it works the same on a published Artifact page. Buttons carry the
  // text to read in a data-speak attribute (not inline onclick) so we never
  // have to worry about escaping quotes into JS string literals.
  // Cache available voices and prefer a higher-quality en-US voice when the
  // browser offers one (e.g. "Google US English" on Chrome). Voice lists can
  // load asynchronously, so we also refresh the cache on 'voiceschanged'.
  let _voiceCache = null;
  function pickVoice() {
    try {
      const voices = _voiceCache || window.speechSynthesis.getVoices();
      if (!voices || !voices.length) return null;
      _voiceCache = voices;
      const prefs = [
        v => /en-US/i.test(v.lang) && /google/i.test(v.name),
        v => /en-US/i.test(v.lang) && /natural/i.test(v.name),
        v => /en-US/i.test(v.lang) && v.localService === false,
        v => /en-US/i.test(v.lang),
        v => /^en/i.test(v.lang),
      ];
      for (const test of prefs) {
        const found = voices.find(test);
        if (found) return found;
      }
    } catch (e) {}
    return null;
  }
  if ('speechSynthesis' in window) {
    try {
      _voiceCache = window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => { _voiceCache = window.speechSynthesis.getVoices(); };
    } catch (e) {}
  }
  // A flat slow rate sounds natural for a single word (helps pronunciation
  // drilling) but makes a full sentence sound robotic/clipped, since the
  // synthesizer's prosody is tuned around its default rate. So: short
  // word/phrase text is read slightly slower, longer sentence text is read
  // at a natural pace.
  function speakEn(text) {
    try {
      if (!('speechSynthesis' in window) || !text) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      const wordCount = text.trim().split(/\s+/).length;
      u.rate = wordCount <= 4 ? 0.88 : 1.0;
      const voice = pickVoice();
      if (voice) u.voice = voice;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  window.speakEn = speakEn;
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.speak-btn');
    if (!btn) return;
    e.stopPropagation();
    speakEn(btn.dataset.speak || '');
  });
  function speakBtnHtml(text, extraClass) {
    return `<button type="button" class="speak-btn${extraClass ? ' ' + extraClass : ''}" title="朗讀英文" data-speak="${escapeHtml(text)}">🔊</button>`;
  }
  // Exposed globally so the separate study-mode script (below) can reuse the
  // same helpers instead of duplicating them.
  window.speakBtnHtml = speakBtnHtml;

  // Build nav
  data.categories.forEach((cat, i) => {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = '#cat-' + i;
    a.dataset.target = 'cat-' + i;
    a.innerHTML = '<span>' + escapeHtml(cat.name) + '</span><span class="nav-count">' + cat.rows.length + '</span>';
    li.appendChild(a);
    navList.appendChild(li);
  });
  const sbLi = document.createElement('li');
  sbLi.innerHTML = '<a href="#cat-sentence-bank" data-target="cat-sentence-bank"><span>Sentence Bank（高分句型）</span><span class="nav-count">' + data.sentenceBank.length + '</span></a>';
  navList.appendChild(sbLi);

  // Build content
  data.categories.forEach((cat, i) => {
    const section = document.createElement('section');
    section.className = 'category';
    section.id = 'cat-' + i;

    const numMatch = cat.name.match(/^(\d+)\.\s*(.*)$/);
    const num = numMatch ? numMatch[1] : (i + 1);
    const restName = numMatch ? numMatch[2] : cat.name;

    section.innerHTML = `
      <div class="category-head">
        <span class="category-num">${num.toString().padStart(2, '0')}</span>
        <h2>${escapeHtml(restName)}</h2>
        <span class="category-count">${cat.rows.length} 筆</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>${/phrase/i.test(cat.name) ? 'Phrase' : 'Word'}</th>
            <th>KK音標</th>
            <th>POS</th>
            <th>中文</th>
            <th>Example</th>
            <th>常見搭配</th>
          </tr></thead>
          <tbody>
            ${cat.rows.map((r, j) => `
              <tr class="row" data-idx="c${i}-${j}" data-search="${escapeHtml((r[0]+' '+r[3]+' '+r[4]+' '+(r[5]||'')).toLowerCase())}">
                <td class="word"><span data-field="word">${escapeHtml(r[0])}</span> ${speakBtnHtml(r[0])}</td>
                <td class="kk" data-field="kk">${escapeHtml(r[1])}</td>
                <td><span class="pos-tag" style="color:var(--pos-${posClass(r[2])});background:var(--pos-${posClass(r[2])}-bg)">${escapeHtml(r[2])}</span></td>
                <td class="zh" data-field="zh">${escapeHtml(r[3])}</td>
                <td class="example"><span data-field="example">${escapeHtml(r[4])}</span> ${speakBtnHtml(r[4], 'speak-btn-sm')}</td>
                <td class="colloc" data-field="colloc">${escapeHtml(r[5] || '')}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    `;
    content.appendChild(section);
  });

  // Sentence bank
  const sbSection = document.createElement('section');
  sbSection.className = 'category';
  sbSection.id = 'cat-sentence-bank';
  sbSection.innerHTML = `
    <div class="category-head">
      <span class="category-num">${(data.categories.length + 1).toString().padStart(2, '0')}</span>
      <h2>Sentence Bank（考場必背高分句型）</h2>
      <span class="category-count">${data.sentenceBank.length} 句</span>
    </div>
    <div class="sentence-grid">
      ${data.sentenceBank.map((s, k) => `
        <div class="sentence-card row" data-idx="s${k}" data-search="${escapeHtml((s.en + ' ' + s.zh).toLowerCase())}">
          <p class="sentence-en"><span data-field="en">${escapeHtml(s.en)}</span> ${speakBtnHtml(s.en)}</p>
          <p class="sentence-zh" data-field="zh">${escapeHtml(s.zh)}</p>
        </div>`).join('')}
    </div>
  `;
  content.appendChild(sbSection);

  // Scroll spy
  const navLinks = Array.from(navList.querySelectorAll('a'));
  const sections = Array.from(document.querySelectorAll('.category'));
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const link = navLinks.find(l => l.dataset.target === entry.target.id);
      if (!link) return;
      if (entry.isIntersecting) {
        navLinks.forEach(l => l.classList.remove('active'));
        link.classList.add('active');
      }
    });
  }, { rootMargin: '-10% 0px -70% 0px' });
  sections.forEach(s => io.observe(s));

  // ---- Search ----
  const searchInput = document.getElementById('searchInput');
  const resultCount = document.getElementById('resultCount');
  const allRows = Array.from(document.querySelectorAll('.row'));

  function rawFieldsFor(row) {
    const idx = row.dataset.idx;
    if (idx[0] === 'c') {
      const [ci, ri] = idx.slice(1).split('-').map(Number);
      const r = data.categories[ci].rows[ri];
      return { word: r[0], kk: r[1], zh: r[3], example: r[4], colloc: r[5] || '' };
    }
    const s = data.sentenceBank[Number(idx.slice(1))];
    return { en: s.en, zh: s.zh };
  }

  function escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  function markedHtml(text, q) {
    const safe = escapeHtml(text || '');
    if (!q) return safe;
    const re = new RegExp(escapeRegExp(escapeHtml(q)), 'ig');
    return safe.replace(re, m => '<mark>' + m + '</mark>');
  }

  function applyHighlight(row, q) {
    const raw = rawFieldsFor(row);
    row.querySelectorAll('[data-field]').forEach(el => {
      const key = el.dataset.field;
      el.innerHTML = markedHtml(raw[key], q);
    });
  }

  function runSearch() {
    const q = searchInput.value.trim().toLowerCase();
    let anyVisible = false;
    let total = 0;
    sections.forEach(sec => {
      let sectionHasMatch = false;
      sec.querySelectorAll('.row').forEach(row => {
        const match = !q || row.dataset.search.includes(q);
        row.classList.toggle('hidden', !match);
        if (match) {
          sectionHasMatch = true;
          total++;
          applyHighlight(row, q);
        }
      });
      sec.classList.toggle('hidden', !sectionHasMatch);
      if (sectionHasMatch) anyVisible = true;
    });
    emptyState.style.display = anyVisible ? 'none' : 'block';
    resultCount.textContent = q ? `找到 ${total} 筆符合「${searchInput.value.trim()}」` : '';
  }

  searchInput.addEventListener('input', runSearch);

  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      searchInput.value = '';
      runSearch();
      searchInput.blur();
    }
  });

  // "/" focuses the search box from anywhere (unless already typing in a field);
  // also re-opens the sidebar first if it's collapsed
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== searchInput &&
        !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
      e.preventDefault();
      if (sidebar.classList.contains('collapsed')) setSidebarCollapsed(false);
      searchInput.focus();
    }
  });
})();
</script>


<script>
(function () {
  const data = JSON.parse(document.getElementById('vocab-data').textContent);
  const studyModeBtn = document.getElementById('studyModeBtn');
  const studyModeBtnLabel = document.getElementById('studyModeBtnLabel');
  const browseView = document.getElementById('browseView');
  const studyView = document.getElementById('studyView');
  const studyPanel = document.getElementById('studyPanel');

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pick(arr, n) { return shuffle(arr).slice(0, n); }
  function simpleHash(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return (h >>> 0).toString(36);
  }

  // ---------- Build card pool ----------
  const CARDS = [];
  data.categories.forEach((cat) => {
    const isPhrase = /phrase/i.test(cat.name);
    cat.rows.forEach((r) => {
      CARDS.push({
        id: 'w:' + r[0].toLowerCase(),
        type: isPhrase ? 'phrase' : 'word',
        category: cat.name,
        word: r[0], kk: r[1], pos: r[2], zh: r[3], example: r[4], colloc: r[5] || ''
      });
    });
  });
  data.sentenceBank.forEach((s) => {
    CARDS.push({
      id: 's:' + simpleHash(s.en),
      type: 'sentence',
      category: 'Sentence Bank（考場必背高分句型）',
      word: s.en, zh: s.zh, example: '', colloc: '', kk: '', pos: ''
    });
  });
  const CATEGORY_NAMES = data.categories.map(c => c.name);
  const WORD_ONLY = CARDS.filter(c => c.type === 'word');

  function catShort(name) {
    const m = name.match(/^\d+\.\s*(.*)$/);
    return m ? m[1] : name;
  }

  // ---------- Blank matching for sentence-context modes (word/phrase only) ----------
  // Tries an exact match of the headword/phrase first (works for most phrases,
  // which are usually quoted verbatim in their example), then falls back to a
  // stem match on the first token (handles inflected single words like
  // "gulp" -> "Gulping").
  function escapeRegExpBlank(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  const blankCache = new Map();
  function findBlank(card) {
    if (card.type === 'sentence') return null;
    if (blankCache.has(card.id)) return blankCache.get(card.id);
    let result = null;
    const exactRe = new RegExp('\\b' + escapeRegExpBlank(card.word) + '\\b', 'i');
    let m = card.example.match(exactRe);
    if (m) {
      result = { matched: m[0], index: m.index };
    } else {
      const firstToken = card.word.split(/\s+/)[0].replace(/[^a-zA-Z]/g, '');
      const stemLen = Math.min(5, firstToken.length);
      const stem = firstToken.slice(0, stemLen);
      if (stem) {
        const stemRe = new RegExp('\\b' + stem + "[a-zA-Z']*", 'i');
        m = card.example.match(stemRe);
        if (m) result = { matched: m[0], index: m.index };
      }
    }
    blankCache.set(card.id, result);
    return result;
  }

  // Builds a "hangman"-style hint: reveals a short prefix of the word/phrase
  // and blanks out the rest with underscores (non-letters like spaces and
  // apostrophes are always shown as-is).
  function hintPattern(word) {
    const letterCount = word.replace(/[^a-zA-Z]/g, '').length;
    const prefixLen = letterCount <= 4 ? 1 : letterCount <= 8 ? 2 : letterCount <= 14 ? 3 : 4;
    let shown = 0, out = '';
    for (const ch of word) {
      if (/[a-zA-Z]/.test(ch)) {
        out += shown < prefixLen ? ch.toUpperCase() : '_';
        shown++;
      } else {
        out += ch;
      }
    }
    return out;
  }
  function normAnswer(s) { return s.trim().toLowerCase().replace(/[.,!?;:'"’‘`]/g, '').replace(/\s+/g, ' '); }

  // ---------- Sentence dictation (默寫) helpers ----------
  // Per-word hint used for whole-sentence dictation: short/common words (<=3
  // letters, e.g. "a", "the", "of") get NO revealed letters at all — only
  // longer, harder words get a short prefix hint. This is a lighter touch
  // than hintPattern() (used for the single-word cloze mode), which always
  // reveals at least one letter.
  // Strip ALL apostrophe variants (straight ' and curly ’) rather than keeping
  // them — otherwise a user typing a plain ' for "couldn't" would never match
  // the source text's curly "couldn't", producing a false "wrong" verdict.
  function normalizeWord(w) { return (w || '').toLowerCase().replace(/[’'‘`]/g, '').replace(/[^a-z]/g, ''); }
  function wordHint(token) {
    const letterCount = token.replace(/[^a-zA-Z]/g, '').length;
    const prefixLen = letterCount <= 3 ? 0 : letterCount <= 6 ? 1 : letterCount <= 10 ? 2 : 3;
    let shown = 0, out = '';
    for (const ch of token) {
      if (/[a-zA-Z]/.test(ch)) {
        out += shown < prefixLen ? ch.toUpperCase() : '_';
        shown++;
      } else {
        out += ch;
      }
    }
    return out;
  }
  // Word-level LCS diff between the target sentence and what the user typed,
  // so a single missed/extra word doesn't misalign every word after it.
  // Returns which target-word positions were matched (in order) and the
  // longest-common-subsequence length (used as the "score").
  function lcsWordDiff(targetWords, userWords) {
    const nt = targetWords.map(normalizeWord);
    const nu = userWords.map(normalizeWord);
    const n = nt.length, m = nu.length;
    const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
    for (let i = 1; i <= n; i++) {
      for (let j = 1; j <= m; j++) {
        dp[i][j] = (nt[i - 1] && nt[i - 1] === nu[j - 1]) ? dp[i - 1][j - 1] + 1 : Math.max(dp[i - 1][j], dp[i][j - 1]);
      }
    }
    const matchedTarget = new Array(n).fill(false);
    let i = n, j = m;
    while (i > 0 && j > 0) {
      if (nt[i - 1] && nt[i - 1] === nu[j - 1]) { matchedTarget[i - 1] = true; i--; j--; }
      else if (dp[i - 1][j] >= dp[i][j - 1]) i--;
      else j--;
    }
    return { matchedTarget, lcsLen: dp[n][m] };
  }

  // ---------- Progress storage (Leitner-style) ----------
  const PROG_KEY = 'vocabStudyProgress_v1';
  const INTERVALS = [0, 1, 3, 7, 16, 30];
  let progress = {};
  try { progress = JSON.parse(localStorage.getItem(PROG_KEY) || '{}'); } catch (e) { progress = {}; }
  function saveProgress() {
    try { localStorage.setItem(PROG_KEY, JSON.stringify(progress)); } catch (e) {}
  }
  function getProg(id) {
    return progress[id] || { box: 0, dueAt: 0, seen: 0, wrong: 0 };
  }
  function setProg(id, box, wasWrong) {
    const p = getProg(id);
    p.box = Math.max(0, Math.min(5, box));
    p.seen = (p.seen || 0) + 1;
    if (wasWrong) p.wrong = (p.wrong || 0) + 1;
    p.dueAt = Date.now() + INTERVALS[p.box] * 86400000;
    p.lastSeen = Date.now();
    progress[id] = p;
    saveProgress();
  }

  // ---------- Mode switch ----------
  let inStudyMode = false;
  function setStudyMode(on) {
    inStudyMode = on;
    browseView.hidden = on;
    studyView.hidden = !on;
    studyModeBtn.classList.toggle('active', on);
    studyModeBtnLabel.textContent = on ? '返回瀏覽' : '背誦模式';
    if (on) renderSetup();
  }
  studyModeBtn.addEventListener('click', () => setStudyMode(!inStudyMode));

  // ---------- Setup state ----------
  const cfg = {
    types: { word: true, phrase: true, sentence: true },
    cats: new Set(CATEGORY_NAMES),
    mode: 'flashcard',
    scope: 'due',
    count: 20,
    countIsCustom: false
  };

  function computePool() {
    const needsBlank = cfg.mode === 'mc' || cfg.mode === 'cloze';
    return CARDS.filter(c => {
      if (!cfg.types[c.type]) return false;
      if (c.type !== 'sentence' && !cfg.cats.has(c.category)) return false;
      if (needsBlank && c.type === 'sentence') return false;
      if (needsBlank && !findBlank(c)) return false;
      return true;
    });
  }

  function renderSetup() {
    if (cfg.mode === 'dictation') {
      cfg.types.word = false; cfg.types.phrase = false; cfg.types.sentence = true;
    } else if (cfg.mode !== 'flashcard') {
      cfg.types.sentence = false;
    }

    const pool = computePool();
    const duePool = pool.filter(c => getProg(c.id).dueAt <= Date.now());

    const modeInfo = {
      flashcard: '看正面回想中文意思／英文句子，翻面自評熟悉度',
      mc: '看例句克漏字，從 4 個單字／片語選項中選出正確答案',
      spelling: '看中文意思，親自拼出英文單字或片語（無提示）',
      cloze: '看例句克漏字＋字首字母提示，自己拼出正確答案',
      dictation: '看中文默寫整句英文，會顯示單字數，較難的字給字首提示（僅限句庫）'
    };
    const sentenceOnlyMode = cfg.mode === 'flashcard' || cfg.mode === 'dictation';

    studyPanel.innerHTML = `
      <div class="study-card">
        <div class="study-head">
          <h2>🧠 背誦模式</h2>
          <button class="study-back-btn" id="studyBackBtn" type="button">← 回到瀏覽</button>
        </div>

        <div class="study-section">
          <p class="study-section-title">練習模式</p>
          <div class="radio-group" id="modeGroup">
            ${['flashcard','mc','spelling','cloze','dictation'].map(m => `
              <label class="radio-pill ${cfg.mode === m ? 'checked' : ''}" data-mode="${m}">
                <input type="radio" name="mode" value="${m}" ${cfg.mode === m ? 'checked' : ''}>
                ${{flashcard:'🗂️ 單字卡', mc:'🔘 選擇題', spelling:'⌨️ 拼寫測驗', cloze:'✂️ 克漏字', dictation:'📝 句子默寫'}[m]}
                <span class="pill-desc">${modeInfo[m]}</span>
              </label>`).join('')}
          </div>
        </div>

        <div class="study-section">
          <p class="study-section-title">內容類型</p>
          <div class="chip-group" id="typeGroup">
            <label class="chip ${cfg.types.word ? 'checked' : ''} ${cfg.mode === 'dictation' ? 'disabled' : ''}" data-type="word">
              <input type="checkbox" ${cfg.types.word ? 'checked' : ''} ${cfg.mode === 'dictation' ? 'disabled' : ''}>單字<span class="chip-count">${CARDS.filter(c=>c.type==='word').length}</span>
            </label>
            <label class="chip ${cfg.types.phrase ? 'checked' : ''} ${cfg.mode === 'dictation' ? 'disabled' : ''}" data-type="phrase">
              <input type="checkbox" ${cfg.types.phrase ? 'checked' : ''} ${cfg.mode === 'dictation' ? 'disabled' : ''}>片語<span class="chip-count">${CARDS.filter(c=>c.type==='phrase').length}</span>
            </label>
            <label class="chip ${cfg.types.sentence ? 'checked' : ''} ${!sentenceOnlyMode ? 'disabled' : ''}" data-type="sentence">
              <input type="checkbox" ${cfg.types.sentence ? 'checked' : ''} ${!sentenceOnlyMode ? 'disabled' : ''}>句子（單字卡／句子默寫模式）<span class="chip-count">${CARDS.filter(c=>c.type==='sentence').length}</span>
            </label>
          </div>
        </div>

        <div class="study-section">
          <p class="study-section-title">分類範圍
            <span>
              <button class="mini-btn" id="catAllBtn" type="button">全選</button> /
              <button class="mini-btn" id="catNoneBtn" type="button">全不選</button>
            </span>
          </p>
          <div class="chip-group" id="catGroup">
            ${CATEGORY_NAMES.map(name => `
              <label class="chip ${cfg.cats.has(name) ? 'checked' : ''}" data-cat="${escapeHtml(name)}">
                <input type="checkbox" ${cfg.cats.has(name) ? 'checked' : ''}>${escapeHtml(catShort(name))}
              </label>`).join('')}
          </div>
        </div>

        <div class="study-section">
          <p class="study-section-title">複習範圍</p>
          <div class="radio-group" id="scopeGroup">
            <label class="radio-pill ${cfg.scope === 'due' ? 'checked' : ''}" data-scope="due">
              <input type="radio" name="scope" value="due" ${cfg.scope === 'due' ? 'checked' : ''}>
              優先複習<span class="pill-desc">還不熟／到期的優先出現</span>
            </label>
            <label class="radio-pill ${cfg.scope === 'all' ? 'checked' : ''}" data-scope="all">
              <input type="radio" name="scope" value="all" ${cfg.scope === 'all' ? 'checked' : ''}>
              全部隨機<span class="pill-desc">不分熟悉度，隨機出題</span>
            </label>
          </div>
        </div>

        <div class="study-section">
          <p class="study-section-title">題數</p>
          <div class="radio-group" id="countGroup">
            ${[10,20,30,50,'all'].map(n => `
              <label class="radio-pill ${!cfg.countIsCustom && cfg.count === n ? 'checked' : ''}" data-count="${n}">
                <input type="radio" name="count" value="${n}" ${!cfg.countIsCustom && cfg.count === n ? 'checked' : ''}>
                ${n === 'all' ? '全部' : n + ' 題'}
              </label>`).join('')}
            <label class="radio-pill ${cfg.countIsCustom ? 'checked' : ''}" data-count="custom">
              <input type="radio" name="count" value="custom" ${cfg.countIsCustom ? 'checked' : ''}>
              ✏️ 自訂
            </label>
          </div>
          ${cfg.countIsCustom ? `
            <div class="custom-count-row">
              <input type="number" id="customCountInput" min="1" step="1" inputmode="numeric"
                     value="${typeof cfg.count === 'number' ? cfg.count : ''}" placeholder="輸入題數…">
              <span class="custom-count-suffix">題</span>
            </div>` : ''}
        </div>

        <p class="study-pool-hint" id="poolHint"></p>
        <button class="study-start-btn" id="startBtn" type="button">開始背誦</button>
        <button class="study-reset-link" id="resetProgBtn" type="button">清除本機學習紀錄</button>
      </div>
    `;

    function updateHint() {
      const p = computePool();
      const due = p.filter(c => getProg(c.id).dueAt <= Date.now());
      const hint = document.getElementById('poolHint');
      const startBtn = document.getElementById('startBtn');
      if (p.length === 0) {
        hint.innerHTML = '目前條件下沒有符合的項目，請調整內容類型或分類範圍。';
        startBtn.disabled = true;
      } else if (cfg.scope === 'due' && due.length === 0) {
        hint.innerHTML = `符合條件共 <strong>${p.length}</strong> 筆，目前沒有到期複習項目，將改為從全部項目中練習。`;
        startBtn.disabled = false;
      } else {
        const useCount = cfg.scope === 'due' ? due.length : p.length;
        hint.innerHTML = `符合條件共 <strong>${p.length}</strong> 筆，本次將練習 <strong>${cfg.count === 'all' ? useCount : Math.min(cfg.count, useCount)}</strong> 題。`;
        startBtn.disabled = false;
      }
    }
    updateHint();

    document.getElementById('studyBackBtn').addEventListener('click', () => setStudyMode(false));

    // Use 'change' on the actual <input> (not 'click' on the wrapping <label>) —
    // clicking a label that contains its input fires a click on both the label
    // and the input (event bubbles through), so a 'click' listener on the label
    // double-fires and the toggle cancels itself out. 'change' fires exactly
    // once per real state change regardless of how it was triggered.
    document.querySelectorAll('#modeGroup .radio-pill input').forEach(inp => {
      inp.addEventListener('change', () => { cfg.mode = inp.closest('.radio-pill').dataset.mode; renderSetup(); });
    });
    document.querySelectorAll('#typeGroup .chip input').forEach(inp => {
      inp.addEventListener('change', (e) => {
        const el = inp.closest('.chip');
        if (el.classList.contains('disabled')) { e.preventDefault(); inp.checked = !inp.checked; return; }
        cfg.types[el.dataset.type] = inp.checked;
        renderSetup();
      });
    });
    document.getElementById('catAllBtn').addEventListener('click', () => { cfg.cats = new Set(CATEGORY_NAMES); renderSetup(); });
    document.getElementById('catNoneBtn').addEventListener('click', () => { cfg.cats = new Set(); renderSetup(); });
    document.querySelectorAll('#catGroup .chip input').forEach(inp => {
      inp.addEventListener('change', () => {
        const name = inp.closest('.chip').dataset.cat;
        if (inp.checked) cfg.cats.add(name); else cfg.cats.delete(name);
        renderSetup();
      });
    });
    document.querySelectorAll('#scopeGroup .radio-pill input').forEach(inp => {
      inp.addEventListener('change', () => { cfg.scope = inp.closest('.radio-pill').dataset.scope; renderSetup(); });
    });
    document.querySelectorAll('#countGroup .radio-pill input').forEach(inp => {
      inp.addEventListener('change', () => {
        const v = inp.closest('.radio-pill').dataset.count;
        if (v === 'custom') {
          cfg.countIsCustom = true;
          if (typeof cfg.count !== 'number') cfg.count = 20;
        } else {
          cfg.countIsCustom = false;
          cfg.count = v === 'all' ? 'all' : Number(v);
        }
        renderSetup();
      });
    });
    const customCountInput = document.getElementById('customCountInput');
    if (customCountInput) {
      customCountInput.focus();
      customCountInput.addEventListener('input', () => {
        // Update cfg + the hint/start-button in place (no renderSetup() here —
        // a full re-render would rebuild the input and steal focus mid-type).
        const n = parseInt(customCountInput.value, 10);
        const valid = Number.isFinite(n) && n > 0;
        if (valid) cfg.count = Math.min(n, 9999);
        updateHint();
        document.getElementById('startBtn').disabled = !valid || computePool().length === 0;
      });
    }
    document.getElementById('startBtn').addEventListener('click', startSession);
    document.getElementById('resetProgBtn').addEventListener('click', () => {
      if (confirm('確定要清除所有本機學習紀錄嗎？此動作無法復原。')) {
        progress = {};
        saveProgress();
        renderSetup();
      }
    });
  }

  // ---------- Session / Drill ----------
  let session = null;

  function startSession() {
    const pool = computePool();
    if (pool.length === 0) return;
    let list;
    if (cfg.scope === 'due') {
      const due = pool.filter(c => getProg(c.id).dueAt <= Date.now());
      list = due.length > 0 ? due : pool.slice();
      list.sort((a, b) => (getProg(a.id).dueAt - getProg(b.id).dueAt) || (getProg(a.id).box - getProg(b.id).box));
    } else {
      list = shuffle(pool);
    }
    const n = cfg.count === 'all' ? list.length : Math.min(cfg.count, list.length);
    session = { cards: list.slice(0, n), idx: 0, mode: cfg.mode, results: [] };
    renderDrill();
  }

  function drillTopbar() {
    const total = session.cards.length;
    const doneCount = session.idx;
    const pct = total ? Math.round((doneCount / total) * 100) : 0;
    const modeLabel = {flashcard:'單字卡', mc:'選擇題', spelling:'拼寫測驗', cloze:'克漏字', dictation:'句子默寫'}[session.mode];
    return `
      <div class="drill-mode-badge">${modeLabel}</div>
      <div class="drill-topbar">
        <span class="drill-progress-text">第 ${Math.min(doneCount + 1, total)} / ${total} 題</span>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <button class="drill-exit-btn" id="exitBtn" type="button">結束</button>
      </div>
    `;
  }

  function recordResult(card, correct, box) {
    session.results.push({ card, correct });
    setProg(card.id, box, !correct);
  }

  function advance() {
    session.idx++;
    if (session.idx >= session.cards.length) renderSummary();
    else renderDrill();
  }

  function renderDrill() {
    const card = session.cards[session.idx];
    let body = '';
    if (session.mode === 'flashcard') body = flashcardHtml(card);
    else if (session.mode === 'mc') body = mcHtml(card);
    else if (session.mode === 'spelling') body = spellingHtml(card);
    else if (session.mode === 'cloze') body = clozeHtml(card);
    else if (session.mode === 'dictation') body = dictationHtml(card);

    studyPanel.innerHTML = `<div class="study-card">${drillTopbar()}${body}</div>`;
    document.getElementById('exitBtn').addEventListener('click', () => {
      if (session.results.length > 0) renderSummary(); else renderSetup();
    });
    wireDrillMode(card);
  }

  function flashcardHtml(card) {
    if (card.type === 'sentence') {
      return `
        <div class="flashcard" id="fcCard">
          <div class="fc-word" style="font-size:1.15rem">${escapeHtml(card.zh)}</div>
          <p class="fc-hint" id="fcHint">點擊卡片，試著回想這句英文</p>
          <div class="fc-back-block hidden" id="fcBack">
            <p class="fc-sentence-en">${escapeHtml(card.word)} ${speakBtnHtml(card.word)}</p>
          </div>
          <div class="rate-btns hidden" id="rateBtns">
            <button class="rate-btn" data-rate="0" type="button">😵 還不熟</button>
            <button class="rate-btn" data-rate="1" type="button">🙂 有印象</button>
            <button class="rate-btn" data-rate="2" type="button">😎 記得</button>
          </div>
        </div>`;
    }
    return `
      <div class="flashcard" id="fcCard">
        <div class="fc-cat">${escapeHtml(catShort(card.category))}</div>
        <div class="fc-word">${escapeHtml(card.word)} ${speakBtnHtml(card.word)}</div>
        <div class="fc-kk">${escapeHtml(card.kk)} ${card.pos ? '· ' + escapeHtml(card.pos) : ''}</div>
        <p class="fc-hint" id="fcHint">點擊卡片，回想中文意思</p>
        <div class="fc-back-block hidden" id="fcBack">
          <p class="fc-back-row"><strong>中文：</strong>${escapeHtml(card.zh)}</p>
          <p class="fc-back-row fc-example">${escapeHtml(card.example)}</p>
          ${card.colloc ? `<p class="fc-back-row">${escapeHtml(card.colloc)}</p>` : ''}
        </div>
        <div class="rate-btns hidden" id="rateBtns">
          <button class="rate-btn" data-rate="0" type="button">😵 還不熟</button>
          <button class="rate-btn" data-rate="1" type="button">🙂 有印象</button>
          <button class="rate-btn" data-rate="2" type="button">😎 記得</button>
        </div>
      </div>`;
  }

  // 選擇題：例句克漏字，從 4 個單字／片語選項中選出正確答案
  function mcHtml(card) {
    const m = findBlank(card);
    const before = card.example.slice(0, m.index);
    const after = card.example.slice(m.index + m.matched.length);
    let distractorPool = CARDS.filter(c => c.type === card.type && c.id !== card.id && c.word !== card.word);
    if (distractorPool.length < 3) distractorPool = CARDS.filter(c => c.type !== 'sentence' && c.id !== card.id && c.word !== card.word);
    const distractors = pick(distractorPool, 3).map(c => c.word);
    const options = shuffle([card.word, ...distractors]);
    return `
      <div class="cloze-question">
        <p class="cloze-sentence">${escapeHtml(before)}<span class="cloze-blank">＿＿＿＿＿</span>${escapeHtml(after)}</p>
        <p class="cloze-zh-hint">提示：${escapeHtml(card.zh)}</p>
        <div class="mc-options" id="mcOptions">
          ${options.map(o => `<button class="mc-option" data-val="${escapeHtml(o)}" type="button">${escapeHtml(o)}</button>`).join('')}
        </div>
        <div class="next-btn-row hidden" id="nextRow"><button class="next-btn" id="nextBtn" type="button">下一題 →</button></div>
      </div>`;
  }

  function spellingHtml(card) {
    return `
      <div class="spelling-block">
        <div class="spelling-zh">${escapeHtml(card.zh)}</div>
        <div class="spelling-pos">${card.pos ? escapeHtml(card.pos) : ''}</div>
        <div class="spelling-input-row">
          <input type="text" id="spellInput" autocomplete="off" placeholder="請輸入英文單字或片語…">
          <button class="spelling-submit-btn" id="spellSubmit" type="button">送出</button>
        </div>
        <div id="spellFeedback"></div>
        <div class="next-btn-row hidden" id="nextRow"><button class="next-btn" id="nextBtn" type="button">下一題 →</button></div>
      </div>`;
  }

  // 克漏字：例句挖空 + 字首字母提示，自己打出正確答案
  function clozeHtml(card) {
    const m = findBlank(card);
    const before = card.example.slice(0, m.index);
    const after = card.example.slice(m.index + m.matched.length);
    return `
      <div class="cloze-question">
        <p class="cloze-sentence">${escapeHtml(before)}<span class="cloze-blank">＿＿＿＿＿</span>${escapeHtml(after)}</p>
        <p class="hint-pattern" id="hintPattern">${escapeHtml(hintPattern(card.word))}</p>
        <div class="spelling-input-row">
          <input type="text" id="spellInput" autocomplete="off" placeholder="請輸入完整答案…">
          <button class="spelling-submit-btn" id="spellSubmit" type="button">送出</button>
        </div>
        <div id="spellFeedback"></div>
        <div class="next-btn-row hidden" id="nextRow"><button class="next-btn" id="nextBtn" type="button">下一題 →</button></div>
      </div>`;
  }

  // 句子默寫：給中文＋單字數＋（較難的字給字首），默寫出整句英文
  function dictationHtml(card) {
    const words = card.word.split(/\s+/).filter(Boolean);
    const hintLine = words.map(w => `<span class="dict-word">${escapeHtml(wordHint(w))}</span>`).join(' ');
    return `
      <div class="cloze-question">
        <p class="dictation-zh">${escapeHtml(card.zh)}</p>
        <p class="cloze-zh-hint">共 ${words.length} 個單字（部分較長的字已給字首提示）</p>
        <p class="hint-pattern dictation-hint">${hintLine}</p>
        <textarea id="dictInput" class="dictation-textarea" rows="3" placeholder="請完整打出這句英文…"></textarea>
        <div class="next-btn-row" style="justify-content:flex-start;margin-top:10px;">
          <button class="spelling-submit-btn" id="spellSubmit" type="button">送出</button>
        </div>
        <div id="spellFeedback"></div>
        <div class="next-btn-row hidden" id="nextRow"><button class="next-btn" id="nextBtn" type="button">下一題 →</button></div>
      </div>`;
  }

  function wireDrillMode(card) {
    if (session.mode === 'flashcard') {
      const fcCard = document.getElementById('fcCard');
      let flipped = false;
      function flip(e) {
        if (flipped) return;
        if (e && e.target.closest('.speak-btn')) return; // tapping 🔊 shouldn't flip the card
        flipped = true;
        document.getElementById('fcBack').classList.remove('hidden');
        document.getElementById('rateBtns').classList.remove('hidden');
        document.getElementById('fcHint').textContent = '請選擇熟悉程度';
      }
      fcCard.addEventListener('click', flip);
      document.querySelectorAll('.rate-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (!flipped) return;
          const rate = Number(btn.dataset.rate);
          const curBox = getProg(card.id).box;
          let newBox;
          if (rate === 0) newBox = 0;
          else if (rate === 1) newBox = curBox;
          else newBox = curBox + 1;
          recordResult(card, rate > 0, newBox);
          advance();
        });
      });
    } else if (session.mode === 'mc') {
      // 選擇題：例句克漏字，點選正確的單字／片語選項
      const opts = document.querySelectorAll('#mcOptions .mc-option');
      opts.forEach(btn => {
        btn.addEventListener('click', () => {
          opts.forEach(b => b.disabled = true);
          const correct = btn.dataset.val === card.word;
          opts.forEach(b => {
            if (b.dataset.val === card.word) b.classList.add('correct');
            else if (b === btn) b.classList.add('wrong');
          });
          const curBox = getProg(card.id).box;
          recordResult(card, correct, correct ? curBox + 1 : 0);
          const nextRow = document.getElementById('nextRow');
          nextRow.insertAdjacentHTML('beforebegin',
            `<p class="cloze-zh-hint">${speakBtnHtml(card.example)} ${escapeHtml(card.example)}</p>`);
          nextRow.classList.remove('hidden');
          document.getElementById('nextBtn').addEventListener('click', advance);
        });
      });
    } else if (session.mode === 'spelling') {
      const input = document.getElementById('spellInput');
      const submit = document.getElementById('spellSubmit');
      input.focus();
      function doSubmit() {
        if (input.disabled) return;
        const correct = normAnswer(input.value) === normAnswer(card.word);
        input.disabled = true;
        submit.disabled = true;
        input.classList.add(correct ? 'correct' : 'wrong');
        const fb = document.getElementById('spellFeedback');
        fb.innerHTML = `
          <div class="spelling-feedback ${correct ? 'correct' : 'wrong'}">
            ${correct ? '✅ 正確！' : '❌ 正確答案：' + escapeHtml(card.word)} ${speakBtnHtml(card.word)}
            <div class="fb-example">${escapeHtml(card.example)}</div>
          </div>`;
        const curBox = getProg(card.id).box;
        recordResult(card, correct, correct ? curBox + 1 : 0);
        document.getElementById('nextRow').classList.remove('hidden');
        document.getElementById('nextBtn').addEventListener('click', advance);
      }
      submit.addEventListener('click', doSubmit);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSubmit(); });
    } else if (session.mode === 'cloze') {
      // 克漏字（拼寫版）：例句挖空 + 字首字母提示，親自打出答案
      const input = document.getElementById('spellInput');
      const submit = document.getElementById('spellSubmit');
      input.focus();
      function doSubmit() {
        if (input.disabled) return;
        const correct = normAnswer(input.value) === normAnswer(card.word);
        input.disabled = true;
        submit.disabled = true;
        input.classList.add(correct ? 'correct' : 'wrong');
        const fb = document.getElementById('spellFeedback');
        fb.innerHTML = `
          <div class="spelling-feedback ${correct ? 'correct' : 'wrong'}">
            ${correct ? '✅ 正確！' : '❌ 正確答案：' + escapeHtml(card.word)} ${speakBtnHtml(card.word)}
            <div class="fb-example">${escapeHtml(card.zh)}</div>
            <div class="fb-example">${speakBtnHtml(card.example)} ${escapeHtml(card.example)}</div>
            ${card.colloc ? `<div class="fb-example">${escapeHtml(card.colloc)}</div>` : ''}
          </div>`;
        const curBox = getProg(card.id).box;
        recordResult(card, correct, correct ? curBox + 1 : 0);
        document.getElementById('nextRow').classList.remove('hidden');
        document.getElementById('nextBtn').addEventListener('click', advance);
      }
      submit.addEventListener('click', doSubmit);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSubmit(); });
    } else if (session.mode === 'dictation') {
      // 句子默寫：中文 + 單字數 + 部分字首提示，默寫出整句英文
      const input = document.getElementById('dictInput');
      const submit = document.getElementById('spellSubmit');
      input.focus();
      function doSubmit() {
        if (input.disabled) return;
        const targetWords = card.word.split(/\s+/).filter(Boolean);
        const userWords = input.value.split(/\s+/).filter(Boolean);
        const { matchedTarget, lcsLen } = lcsWordDiff(targetWords, userWords);
        const n = targetWords.length;
        const correct = n > 0 && lcsLen / n >= 0.9;
        input.disabled = true;
        submit.disabled = true;
        const diffHtml = targetWords.map((w, idx) =>
          `<span class="diff-word ${matchedTarget[idx] ? 'correct' : 'missing'}">${escapeHtml(w)}</span>`
        ).join(' ');
        const fb = document.getElementById('spellFeedback');
        fb.innerHTML = `
          <div class="spelling-feedback ${correct ? 'correct' : 'wrong'}">
            <span class="dictation-score">${correct ? '✅' : '❌'} ${lcsLen} / ${n} 字正確</span>
            ${speakBtnHtml(card.word)}
            <p class="dictation-diff">${diffHtml}</p>
          </div>`;
        recordResult(card, correct, correct ? getProg(card.id).box + 1 : 0);
        document.getElementById('nextRow').classList.remove('hidden');
        document.getElementById('nextBtn').addEventListener('click', advance);
      }
      submit.addEventListener('click', doSubmit);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) doSubmit();
      });
    }
  }

  function renderSummary() {
    const total = session.results.length;
    const correct = session.results.filter(r => r.correct).length;
    const missed = session.results.filter(r => !r.correct);
    const rate = total ? Math.round((correct / total) * 100) : 0;

    studyPanel.innerHTML = `
      <div class="study-card">
        <div class="study-head"><h2>📊 本次結果</h2></div>
        <div class="summary-stats">
          <div class="summary-stat"><div class="num">${total}</div><div class="lbl">已練習</div></div>
          <div class="summary-stat"><div class="num">${correct}</div><div class="lbl">答對／記得</div></div>
          <div class="summary-stat"><div class="num">${rate}%</div><div class="lbl">正確率</div></div>
        </div>
        ${missed.length > 0 ? `
          <p class="study-section-title">還需加強（${missed.length}）</p>
          <ul class="missed-list">
            ${missed.map(r => `<li><strong>${escapeHtml(r.card.word)}</strong><span>${escapeHtml(r.card.zh)}</span></li>`).join('')}
          </ul>` : '<p class="study-pool-hint">🎉 全部答對，太棒了！</p>'}
        <div class="summary-btn-row">
          ${missed.length > 0 ? '<button class="summary-btn" id="retryMissedBtn" type="button">只複習剛剛還不熟的</button>' : ''}
          <button class="summary-btn primary" id="restartBtn" type="button">再練一輪</button>
          <button class="summary-btn" id="backSetupBtn" type="button">回到設定</button>
        </div>
      </div>
    `;
    if (missed.length > 0) {
      document.getElementById('retryMissedBtn').addEventListener('click', () => {
        session = { cards: shuffle(missed.map(r => r.card)), idx: 0, mode: session.mode, results: [] };
        renderDrill();
      });
    }
    document.getElementById('restartBtn').addEventListener('click', startSession);
    document.getElementById('backSetupBtn').addEventListener('click', renderSetup);
  }
})();
</script>

</body></html>
