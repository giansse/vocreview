<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>學測作文單字庫</title>
<style>
:root {
  --bg: #eef1f3;
  --surface: #ffffff;
  --surface-2: #f5f7f8;
  --ink: #1c2430;
  --ink-soft: #56606d;
  --ink-faint: #8993a1;
  --accent: #2f5d8a;
  --accent-strong: #1f4569;
  --accent-soft: #dce8f2;
  --gold: #a8781f;
  --gold-soft: #f3e6cd;
  --border: #dde2e6;
  --shadow: 0 1px 2px rgba(28,36,48,0.06), 0 8px 24px -12px rgba(28,36,48,0.12);
  --pos-v: #2f5d8a;      --pos-v-bg: #dce8f2;
  --pos-adj: #3f7a4e;    --pos-adj-bg: #dcefe0;
  --pos-adv: #6a4c93;    --pos-adv-bg: #e7dff2;
  --pos-n: #a8781f;      --pos-n-bg: #f3e6cd;
  --pos-phrase: #1f7a72; --pos-phrase-bg: #dbefec;
  --pos-default: #56606d; --pos-default-bg: #e7eaed;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161b;
    --surface: #1a1f26;
    --surface-2: #20262e;
    --ink: #e7eaee;
    --ink-soft: #a3adb8;
    --ink-faint: #6d7885;
    --accent: #7db1e0;
    --accent-strong: #9cc6ec;
    --accent-soft: #223447;
    --gold: #e0b768;
    --gold-soft: #3a3018;
    --border: #2b323b;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    --pos-v: #7db1e0;      --pos-v-bg: #1f3348;
    --pos-adj: #8fca9d;    --pos-adj-bg: #1e3324;
    --pos-adv: #b9a0dd;    --pos-adv-bg: #2c2440;
    --pos-n: #e0b768;      --pos-n-bg: #3a3018;
    --pos-phrase: #7fd0c6; --pos-phrase-bg: #1a3532;
    --pos-default: #a3adb8; --pos-default-bg: #262c34;
  }
}
:root[data-theme="dark"] {
  --bg: #12161b;
  --surface: #1a1f26;
  --surface-2: #20262e;
  --ink: #e7eaee;
  --ink-soft: #a3adb8;
  --ink-faint: #6d7885;
  --accent: #7db1e0;
  --accent-strong: #9cc6ec;
  --accent-soft: #223447;
  --gold: #e0b768;
  --gold-soft: #3a3018;
  --border: #2b323b;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  --pos-v: #7db1e0;      --pos-v-bg: #1f3348;
  --pos-adj: #8fca9d;    --pos-adj-bg: #1e3324;
  --pos-adv: #b9a0dd;    --pos-adv-bg: #2c2440;
  --pos-n: #e0b768;      --pos-n-bg: #3a3018;
  --pos-phrase: #7fd0c6; --pos-phrase-bg: #1a3532;
  --pos-default: #a3adb8; --pos-default-bg: #262c34;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Noto Sans TC", "Noto Sans", system-ui, sans-serif;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, .display {
  font-family: "Noto Serif TC", "Noto Serif", serif;
  text-wrap: balance;
}
::selection { background: var(--accent-soft); }

.layout {
  display: flex;
  min-height: 100vh;
}

/* ---- Sidebar ---- */
.sidebar {
  width: 280px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 20px 16px;
  gap: 16px;
  overflow: hidden;
  transition: width 0.22s ease, padding 0.22s ease, opacity 0.15s ease, border-color 0.22s ease;
}
.sidebar.collapsed {
  width: 0;
  padding-left: 0;
  padding-right: 0;
  border-right-color: transparent;
  opacity: 0;
  pointer-events: none;
}
.sidebar-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}
.sidebar-title {
  font-size: 1.05rem;
  line-height: 1.3;
  font-weight: 700;
  color: var(--ink);
  margin: 0;
  padding: 0 4px;
  white-space: nowrap;
}
.sidebar-sub {
  font-size: 0.75rem;
  line-height: 1.3;
  color: var(--ink-faint);
  padding: 0 4px;
  margin-top: 2px;
  white-space: nowrap;
}
.icon-btn {
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--ink-soft);
  cursor: pointer;
  padding: 0;
}
.icon-btn:hover { background: var(--accent-soft); color: var(--accent-strong); }
.icon-btn svg { width: 15px; height: 15px; }
.expand-fab {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 40;
  width: 38px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink-soft);
  box-shadow: var(--shadow);
  cursor: pointer;
}
.expand-fab:hover { color: var(--accent-strong); }
.expand-fab svg { width: 17px; height: 17px; }
.expand-fab[hidden] { display: none; }
.search-box {
  position: relative;
}
.search-box input {
  width: 100%;
  padding: 10px 30px 10px 34px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--ink);
  font-size: 0.9rem;
  font-family: inherit;
}
.search-box input:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
.search-box input:focus + .search-kbd { display: none; }
.search-box svg {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  width: 15px;
  height: 15px;
  color: var(--ink-faint);
  pointer-events: none;
}
.search-kbd {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  font-family: inherit;
  font-size: 0.7rem;
  color: var(--ink-faint);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 1px 6px;
  pointer-events: none;
}
.result-count {
  margin: -8px 4px 0;
  font-size: 0.72rem;
  color: var(--accent);
  min-height: 1em;
}
mark {
  background: var(--gold-soft);
  color: var(--ink);
  border-radius: 3px;
  padding: 0 1px;
}
.nav-list {
  list-style: none;
  margin: 0;
  padding: 0;
  overflow-y: auto;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.nav-list a {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  color: var(--ink-soft);
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 0.85rem;
  transition: background 0.12s ease, color 0.12s ease;
}
.nav-list a:hover { background: var(--surface-2); color: var(--ink); }
.nav-list a.active { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
.nav-count {
  font-size: 0.72rem;
  color: var(--ink-faint);
  background: var(--surface-2);
  border-radius: 999px;
  padding: 1px 7px;
  font-variant-numeric: tabular-nums;
}
.nav-list a.active .nav-count { background: var(--surface); }

.sidebar-footer {
  font-size: 0.72rem;
  color: var(--ink-faint);
  padding: 8px 4px 0;
  border-top: 1px solid var(--border);
}

/* ---- Main ---- */
.main {
  flex: 1;
  min-width: 0;
  padding: 40px clamp(20px, 4vw, 56px) 80px;
  max-width: 980px;
  transition: max-width 0.22s ease;
}
body.sidebar-collapsed .main {
  max-width: 1240px;
}
.hero {
  margin-bottom: 36px;
}
.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--gold);
  background: var(--gold-soft);
  padding: 4px 10px;
  border-radius: 999px;
  margin-bottom: 14px;
  font-family: "Noto Sans TC", sans-serif;
  font-weight: 600;
}
.hero h1 {
  font-size: clamp(1.5rem, 3vw, 2.1rem);
  margin: 0 0 10px;
  color: var(--ink);
  font-weight: 700;
}
.hero-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 20px;
  font-size: 0.85rem;
  color: var(--ink-soft);
  margin-bottom: 10px;
}
.hero-meta strong { color: var(--ink); font-weight: 600; }
.hero-note {
  font-size: 0.82rem;
  color: var(--ink-faint);
  border-left: 3px solid var(--border);
  padding-left: 12px;
  margin-top: 14px;
}

.category {
  margin-bottom: 44px;
  scroll-margin-top: 20px;
}
.category-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.category-num {
  font-family: "Noto Serif TC", serif;
  font-size: 0.85rem;
  color: var(--ink-faint);
}
.category h2 {
  font-size: 1.15rem;
  margin: 0;
  color: var(--ink);
  font-weight: 700;
}
.category-count {
  font-size: 0.72rem;
  color: var(--ink-faint);
  background: var(--surface-2);
  border-radius: 999px;
  padding: 2px 9px;
  font-variant-numeric: tabular-nums;
}

.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  box-shadow: var(--shadow);
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.88rem;
  min-width: 760px;
}
thead th {
  text-align: left;
  font-size: 0.72rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-faint);
  font-weight: 600;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-2);
  white-space: nowrap;
}
tbody td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
  color: var(--ink-soft);
}
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--surface-2); }
td.word {
  color: var(--ink);
  font-weight: 600;
  white-space: nowrap;
}
td.zh { white-space: nowrap; }
td.kk {
  color: var(--accent);
  font-family: "Noto Sans TC", "Doulos SIL", "Charis SIL", "Segoe UI", sans-serif;
  white-space: nowrap;
  font-size: 0.85rem;
}
td.example { font-style: italic; color: var(--ink-soft); min-width: 220px; }
td.colloc { color: var(--ink-faint); font-size: 0.83rem; }
td.colloc:empty::after { content: "—"; color: var(--border); font-style: normal; }
.speak-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  padding: 0;
  border: none;
  background: none;
  cursor: pointer;
  font-size: 0.85rem;
  color: var(--accent);
  opacity: 0.75;
  vertical-align: middle;
  border-radius: 6px;
}
.speak-btn:hover { opacity: 1; background: var(--accent-soft); }
.speak-btn.speak-btn-sm { font-size: 0.75rem; width: 18px; height: 18px; opacity: 0.55; }
.pos-tag {
  display: inline-block;
  font-size: 0.72rem;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 999px;
  white-space: nowrap;
  font-family: "Noto Sans TC", sans-serif;
}

/* Sentence bank */
.sentence-grid {
  display: grid;
  gap: 14px;
}
.sentence-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px 20px;
  box-shadow: var(--shadow);
}
.sentence-en {
  font-family: "Source Serif 4", "Noto Serif TC", serif;
  font-style: italic;
  font-size: 1.02rem;
  color: var(--ink);
  margin: 0 0 8px;
  line-height: 1.55;
}
.sentence-zh {
  font-size: 0.87rem;
  color: var(--ink-soft);
  margin: 0;
}

.empty-state {
  text-align: center;
  color: var(--ink-faint);
  padding: 60px 20px;
  font-size: 0.9rem;
  display: none;
}
.hidden { display: none !important; }

@media (max-width: 860px) {
  .layout { flex-direction: column; }
  .sidebar {
    width: 100%;
    height: auto;
    position: relative;
    border-right: none;
    border-bottom: 1px solid var(--border);
  }
  .nav-list { max-height: 200px; }
  .main { padding: 28px 18px 60px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* ---- Study mode toggle (sidebar) ---- */
.study-toggle-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  width: 100%;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--accent);
  background: var(--accent-soft);
  color: var(--accent-strong);
  font-family: "Noto Sans TC", sans-serif;
  font-size: 0.86rem;
  font-weight: 700;
  cursor: pointer;
}
.study-toggle-btn:hover { background: var(--accent); color: #fff; }
.study-toggle-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
.study-toggle-btn.active { background: var(--ink); border-color: var(--ink); color: var(--surface); }

/* ---- Study view shell ---- */
#studyView { max-width: 720px; }
.study-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: var(--shadow);
  padding: 22px clamp(16px, 3vw, 28px);
  margin-bottom: 20px;
}
.study-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 22px;
}
.study-head h2 {
  font-size: 1.3rem;
  margin: 0;
  color: var(--ink);
}
.study-back-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 0.8rem;
  color: var(--ink-soft);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 6px 13px;
  cursor: pointer;
  font-family: "Noto Sans TC", sans-serif;
}
.study-back-btn:hover { color: var(--accent-strong); border-color: var(--accent); }

.study-section { margin-bottom: 22px; }
.study-section:last-child { margin-bottom: 0; }
.study-section-title {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--ink-soft);
  margin: 0 0 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.study-section-title .mini-btn {
  font-size: 0.72rem;
  font-weight: 500;
  color: var(--accent);
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
}

.chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.82rem;
  padding: 7px 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--ink-soft);
  cursor: pointer;
  user-select: none;
  font-family: "Noto Sans TC", sans-serif;
}
.chip input { display: none; }
.chip.checked {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent-strong);
  font-weight: 600;
}
.chip .chip-count {
  font-size: 0.7rem;
  color: var(--ink-faint);
  background: var(--surface);
  border-radius: 999px;
  padding: 0 6px;
}
.chip.checked .chip-count { color: var(--accent-strong); }
.chip.disabled { opacity: 0.4; cursor: not-allowed; }

.radio-group { display: flex; flex-wrap: wrap; gap: 8px; }
.radio-pill {
  flex: 1;
  min-width: 130px;
  text-align: center;
  font-size: 0.83rem;
  padding: 10px 10px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--ink-soft);
  cursor: pointer;
  font-family: "Noto Sans TC", sans-serif;
}
.radio-pill input { display: none; }
.radio-pill.checked {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent-strong);
  font-weight: 700;
}
.radio-pill .pill-desc {
  display: block;
  font-size: 0.7rem;
  color: var(--ink-faint);
  font-weight: 400;
  margin-top: 2px;
}
.radio-pill.checked .pill-desc { color: var(--accent-strong); opacity: 0.85; }

.custom-count-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
}
.custom-count-row input {
  width: 100px;
  padding: 9px 12px;
  border-radius: 10px;
  border: 1px solid var(--accent);
  background: var(--accent-soft);
  color: var(--ink);
  font-size: 0.9rem;
  font-family: inherit;
}
.custom-count-row input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.custom-count-suffix { font-size: 0.82rem; color: var(--ink-soft); }

.study-pool-hint {
  font-size: 0.8rem;
  color: var(--ink-faint);
  margin: 4px 0 0;
}
.study-pool-hint strong { color: var(--accent-strong); }

.study-start-btn {
  width: 100%;
  padding: 13px;
  border-radius: 12px;
  border: none;
  background: var(--accent-strong);
  color: #fff;
  font-size: 0.95rem;
  font-weight: 700;
  font-family: "Noto Sans TC", sans-serif;
  cursor: pointer;
  margin-top: 6px;
}
.study-start-btn:hover { background: var(--accent); }
.study-start-btn:disabled { background: var(--border); color: var(--ink-faint); cursor: not-allowed; }

.study-reset-link {
  display: inline-block;
  margin-top: 14px;
  font-size: 0.75rem;
  color: var(--ink-faint);
  background: none;
  border: none;
  text-decoration: underline;
  cursor: pointer;
  padding: 0;
}

/* ---- Drill screen ---- */
.drill-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}
.drill-progress-text {
  font-size: 0.82rem;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.progress-track {
  flex: 1;
  height: 6px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 999px;
  transition: width 0.25s ease;
}
.drill-exit-btn {
  font-size: 0.78rem;
  color: var(--ink-faint);
  background: none;
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 5px 12px;
  cursor: pointer;
  white-space: nowrap;
}
.drill-exit-btn:hover { color: var(--accent-strong); border-color: var(--accent); }

.drill-mode-badge {
  display: inline-block;
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--gold);
  background: var(--gold-soft);
  border-radius: 999px;
  padding: 3px 10px;
  margin-bottom: 14px;
}

.flashcard {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: var(--shadow);
  min-height: 260px;
  padding: 32px 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  cursor: pointer;
  gap: 10px;
}
.flashcard .fc-cat {
  font-size: 0.72rem;
  color: var(--ink-faint);
  margin-bottom: 6px;
}
.flashcard .fc-word {
  font-family: "Noto Serif TC", serif;
  font-size: 1.7rem;
  font-weight: 700;
  color: var(--ink);
}
.flashcard .fc-kk {
  color: var(--accent);
  font-size: 0.95rem;
}
.flashcard .fc-hint {
  font-size: 0.76rem;
  color: var(--ink-faint);
  margin-top: 14px;
}
.flashcard .fc-back-block {
  width: 100%;
  text-align: left;
