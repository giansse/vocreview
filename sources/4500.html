<title>4500 單字多義複習</title>
<style>
/* Layout: sticky sidebar (search, 練習, categories) + main column of per-category tables; mirrors 學測作文單字庫 */
:root {
  --bg: #eef1f3;
  --surface: #ffffff;
  --surface-2: #f5f7f8;
  --ink: #1c2430;
  --ink-soft: #56606d;
  --ink-faint: #8993a1;
  --accent: #2f5d8a;
  --accent-strong: #1f4569;
  --accent-soft: #dce8f2;
  --gold: #a8781f;
  --gold-soft: #f3e6cd;
  --border: #dde2e6;
  --good: #2f7a47; --good-bg: #dcefe0;
  --bad: #b3413a;  --bad-bg: #f6dedb;
  --shadow: 0 1px 2px rgba(28,36,48,0.06), 0 8px 24px -12px rgba(28,36,48,0.12);
  --pos-v: #2f5d8a;      --pos-v-bg: #dce8f2;
  --pos-adj: #3f7a4e;    --pos-adj-bg: #dcefe0;
  --pos-n: #a8781f;      --pos-n-bg: #f3e6cd;
  --pos-phrase: #1f7a72; --pos-phrase-bg: #dbefec;
  --font-sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-serif: "Noto Serif TC", "Source Serif 4", "PMingLiU", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161b; --surface: #1a1f26; --surface-2: #20262e;
    --ink: #e7eaee; --ink-soft: #a3adb8; --ink-faint: #6d7885;
    --accent: #7db1e0; --accent-strong: #9cc6ec; --accent-soft: #223447;
    --gold: #e0b768; --gold-soft: #3a3018; --border: #2b323b;
    --good: #8fca9d; --good-bg: #1e3324; --bad: #ec9a92; --bad-bg: #3c1f1c;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    --pos-v: #7db1e0; --pos-v-bg: #1f3348;
    --pos-adj: #8fca9d; --pos-adj-bg: #1e3324;
    --pos-n: #e0b768; --pos-n-bg: #3a3018;
    --pos-phrase: #7fd0c6; --pos-phrase-bg: #1a3532;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161b; --surface: #1a1f26; --surface-2: #20262e;
  --ink: #e7eaee; --ink-soft: #a3adb8; --ink-faint: #6d7885;
  --accent: #7db1e0; --accent-strong: #9cc6ec; --accent-soft: #223447;
  --gold: #e0b768; --gold-soft: #3a3018; --border: #2b323b;
  --good: #8fca9d; --good-bg: #1e3324; --bad: #ec9a92; --bad-bg: #3c1f1c;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  --pos-v: #7db1e0; --pos-v-bg: #1f3348;
  --pos-adj: #8fca9d; --pos-adj-bg: #1e3324;
  --pos-n: #e0b768; --pos-n-bg: #3a3018;
  --pos-phrase: #7fd0c6; --pos-phrase-bg: #1a3532;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-sans); line-height: 1.6; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--font-serif); text-wrap: balance; }
button { font-family: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.layout { display: flex; min-height: 100vh; }
.sidebar {
  width: 272px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border);
  position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh;
  display: flex; flex-direction: column; gap: 14px; padding: 20px 16px;
}
.sidebar-title { font-family: var(--font-serif); font-size: 1.05rem; font-weight: 700; margin: 0; padding: 0 4px; }
.sidebar-sub { font-size: 0.75rem; color: var(--ink-faint); padding: 0 4px; margin-top: -10px; }
.search-box { position: relative; }
.search-box input {
  width: 100%; padding: 10px 12px 10px 34px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface-2); color: var(--ink); font-size: 0.9rem; font-family: inherit;
}
.search-box svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--ink-faint); pointer-events: none; }
.result-count { margin: -6px 4px 0; font-size: 0.72rem; color: var(--accent); min-height: 1em; }
.study-toggle-btn {
  display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%;
  padding: 10px 12px; border-radius: 10px; border: 1px solid var(--accent);
  background: var(--accent-soft); color: var(--accent-strong); font-size: 0.86rem; font-weight: 700; cursor: pointer;
}
.study-toggle-btn:hover { background: var(--accent); color: var(--surface); }
.study-toggle-btn.active { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.study-toggle-btn svg { width: 16px; height: 16px; }
.nav-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.nav-list a {
  display: flex; justify-content: space-between; align-items: center; gap: 8px; text-decoration: none;
  color: var(--ink-soft); padding: 8px 10px; border-radius: 8px; font-size: 0.85rem;
}
.nav-list a:hover { background: var(--surface-2); color: var(--ink); }
.nav-count { font-size: 0.72rem; color: var(--ink-faint); background: var(--surface-2); border-radius: 999px; padding: 1px 7px; font-variant-numeric: tabular-nums; }
.sidebar-footer { font-size: 0.72rem; color: var(--ink-faint); padding: 8px 4px 0; border-top: 1px solid var(--border); }

.main { flex: 1; min-width: 0; padding: 40px clamp(16px, 4vw, 56px) 80px; max-width: 1120px; }
.hero { margin-bottom: 34px; }
.hero-eyebrow {
  display: inline-block; font-size: 0.72rem; letter-spacing: 0.08em; color: var(--gold); background: var(--gold-soft);
  padding: 4px 10px; border-radius: 999px; margin-bottom: 12px; font-weight: 600;
}
.hero h1 { font-size: clamp(1.5rem, 3vw, 2.1rem); margin: 0 0 10px; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 0.85rem; color: var(--ink-soft); }
.hero-meta strong { color: var(--ink); font-variant-numeric: tabular-nums; }
.hero-note { font-size: 0.82rem; color: var(--ink-faint); border-left: 3px solid var(--border); padding-left: 12px; margin-top: 14px; max-width: 62ch; }

.category { margin-bottom: 42px; scroll-margin-top: 20px; }
.category-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
.category h2 { font-size: 1.15rem; margin: 0; }
.category-count { font-size: 0.72rem; color: var(--ink-faint); background: var(--surface-2); border-radius: 999px; padding: 2px 9px; font-variant-numeric: tabular-nums; }
.category-desc { font-size: 0.82rem; color: var(--ink-faint); margin: 0 0 12px; }

.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
table { width: 100%; border-collapse: collapse; font-size: 0.88rem; min-width: 820px; }
thead th {
  text-align: left; font-size: 0.72rem; letter-spacing: 0.04em; color: var(--ink-faint); font-weight: 600;
  padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--surface-2); white-space: nowrap;
}
tbody td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; color: var(--ink-soft); }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--surface-2); }
td.word { color: var(--ink); font-weight: 700; white-space: nowrap; }
.flag { display: inline-block; margin-left: 6px; font-size: 0.66rem; font-weight: 600; color: var(--gold); background: var(--gold-soft); border-radius: 4px; padding: 0 5px; vertical-align: 2px; }
td.zh { color: var(--ink); min-width: 150px; }
td.kk { color: var(--accent); white-space: nowrap; font-size: 0.85rem; }
td.example { min-width: 260px; }
.ex-en { font-style: italic; color: var(--ink); }
.ex-en b { font-style: normal; color: var(--accent-strong); background: var(--accent-soft); border-radius: 3px; padding: 0 3px; }
.ex-zh { font-size: 0.8rem; color: var(--ink-faint); margin-top: 2px; }
td.colloc { color: var(--ink-soft); font-size: 0.82rem; min-width: 200px; }
.pos-tag { display: inline-block; font-size: 0.72rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.pos-v { color: var(--pos-v); background: var(--pos-v-bg); }
.pos-n { color: var(--pos-n); background: var(--pos-n-bg); }
.pos-adj { color: var(--pos-adj); background: var(--pos-adj-bg); }
.pos-phr { color: var(--pos-phrase); background: var(--pos-phrase-bg); }
.empty-state { text-align: center; color: var(--ink-faint); padding: 60px 20px; font-size: 0.9rem; }

/* ---- Study ---- */
#studyView { max-width: 760px; }
.study-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 22px clamp(16px, 3vw, 28px); margin-bottom: 20px; }
.study-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.study-head h2 { font-size: 1.3rem; margin: 0; }
.ghost-btn { font-size: 0.8rem; color: var(--ink-soft); background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 6px 13px; cursor: pointer; }
.ghost-btn:hover { color: var(--accent-strong); border-color: var(--accent); }
.study-section { margin-bottom: 20px; }
.study-section-title { font-size: 0.82rem; font-weight: 700; color: var(--ink-soft); margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; }
.mini-btn { font-size: 0.72rem; color: var(--accent); background: none; border: none; cursor: pointer; padding: 0; }
.chip-group, .radio-group { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); color: var(--ink-soft); cursor: pointer; }
.chip.checked { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-strong); font-weight: 600; }
.chip-count { font-size: 0.7rem; color: var(--ink-faint); background: var(--surface); border-radius: 999px; padding: 0 6px; }
.radio-pill { flex: 1; min-width: 150px; text-align: center; font-size: 0.85rem; padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--ink-soft); cursor: pointer; }
.radio-pill.checked { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-strong); font-weight: 700; }
.pill-desc { display: block; font-size: 0.72rem; font-weight: 400; color: var(--ink-faint); margin-top: 2px; }
.radio-pill.checked .pill-desc { color: var(--accent-strong); }
.count-row { display: flex; align-items: center; gap: 8px; }
.count-row input { width: 90px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--ink); font-size: 0.9rem; font-family: inherit; }
.pool-hint { font-size: 0.8rem; color: var(--ink-faint); margin: 8px 0 0; }
.pool-hint strong { color: var(--accent-strong); }
.primary-btn { width: 100%; padding: 13px; border-radius: 12px; border: none; background: var(--accent-strong); color: var(--surface); font-size: 0.95rem; font-weight: 700; cursor: pointer; }
.primary-btn:hover { background: var(--accent); }
.primary-btn:disabled { background: var(--border); color: var(--ink-faint); cursor: not-allowed; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.btn-row .primary-btn { flex: 1; width: auto; min-width: 140px; }

/* 文意選填 */
.cloze-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.cloze-item { font-size: 0.98rem; line-height: 1.9; color: var(--ink); }
.cloze-item .qn { color: var(--ink-faint); font-variant-numeric: tabular-nums; margin-right: 6px; font-size: 0.85rem; }
.blank {
  display: inline-flex; align-items: center; gap: 4px; min-width: 96px; justify-content: center;
  border: none; border-bottom: 2px solid var(--ink-faint); background: var(--surface-2); color: var(--ink);
  padding: 0 8px; margin: 0 2px; border-radius: 4px 4px 0 0; font-size: 0.92rem; cursor: pointer; line-height: 1.7;
}
.blank.active { border-bottom-color: var(--accent); background: var(--accent-soft); }
.blank.right { border-bottom-color: var(--good); background: var(--good-bg); cursor: default; }
.blank.wrong { border-bottom-color: var(--bad); background: var(--bad-bg); cursor: default; }
.blank .lt { font-weight: 700; color: var(--accent-strong); }
.reveal { font-size: 0.8rem; color: var(--ink-soft); margin-top: 2px; line-height: 1.6; }
.reveal .fix { color: var(--good); font-weight: 700; }
.bank { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-top: 18px; padding-top: 18px; border-top: 1px dashed var(--border); }
.opt {
  display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface-2); color: var(--ink); font-size: 0.92rem; cursor: pointer; text-align: left;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .lt { font-size: 0.75rem; font-weight: 700; color: var(--ink-faint); }
.opt.used { opacity: 0.45; }
.opt:disabled { cursor: default; }
.score { font-family: var(--font-serif); font-size: 1.6rem; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.score small { font-size: 0.9rem; color: var(--ink-faint); font-weight: 400; }

/* 單題 */
.progress-text { font-size: 0.82rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.progress-bar { height: 4px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin: 8px 0 20px; }
.progress-bar span { display: block; height: 100%; background: var(--accent); transition: width 0.2s ease; }
.q-sentence { font-family: var(--font-serif); font-size: 1.12rem; line-height: 1.75; color: var(--ink); margin: 0 0 18px; }
.q-sentence .gap { display: inline-block; min-width: 90px; border-bottom: 2px solid var(--ink-faint); text-align: center; color: var(--accent-strong); font-weight: 700; font-family: var(--font-sans); }
.q-opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.q-opts .opt { justify-content: flex-start; padding: 12px 14px; }
.opt.right { border-color: var(--good); background: var(--good-bg); color: var(--good); font-weight: 700; opacity: 1; }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); opacity: 1; }
.feedback { margin-top: 16px; padding: 14px 16px; border-radius: 10px; background: var(--surface-2); font-size: 0.86rem; color: var(--ink-soft); }
.feedback .fb-word { color: var(--ink); font-weight: 700; }
.wrong-list { list-style: none; padding: 0; margin: 14px 0 0; display: flex; flex-direction: column; gap: 8px; }
.wrong-list li { font-size: 0.86rem; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); color: var(--ink-soft); }
.wrong-list b { color: var(--ink); }

/* 單字卡 */
.fc-top { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.fc-top .progress-bar { flex: 1; min-width: 80px; margin: 0; }
.fc-card {
  width: 100%; min-height: 240px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  text-align: center; padding: 28px 20px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface-2);
  color: var(--ink); cursor: pointer; font: inherit;
}
.fc-card.flipped { cursor: default; }
.fc-word { font-family: var(--font-serif); font-size: 1.9rem; font-weight: 700; }
.fc-kk { color: var(--accent); font-size: 0.92rem; }
.fc-hint { font-size: 0.78rem; color: var(--ink-faint); }
.fc-ex { font-style: italic; color: var(--ink-soft); font-size: 0.98rem; max-width: 52ch; }
.fc-ex b { font-style: normal; color: var(--accent-strong); }
.fc-back { width: 100%; border-top: 1px solid var(--border); padding-top: 14px; margin-top: 4px; display: flex; flex-direction: column; gap: 6px; text-align: left; }
.fc-zh { font-size: 1.1rem; font-weight: 700; color: var(--ink); }
.fc-t { font-size: 0.86rem; color: var(--ink-soft); }
.fc-n { font-size: 0.8rem; color: var(--ink-faint); }
.rate-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.rate-btn { padding: 13px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--ink-soft); font-size: 0.92rem; font-weight: 700; cursor: pointer; }
.rate-btn.bad:hover { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.rate-btn.good:hover { background: var(--good-bg); border-color: var(--good); color: var(--good); }
.undo-btn { font-size: 0.8rem; color: var(--accent-strong); background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 999px; padding: 6px 13px; cursor: pointer; white-space: nowrap; }
.undo-btn:hover { background: var(--accent); color: var(--surface); }
.chip.weak { margin-top: 10px; }

/* 側欄收起／展開（同作文單字庫） */
.side-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.icon-btn { flex-shrink: 0; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--ink-soft); cursor: pointer; padding: 0; }
.icon-btn:hover { background: var(--accent-soft); color: var(--accent-strong); }
.icon-btn svg { width: 15px; height: 15px; }
.expand-fab { position: fixed; top: calc(20px + env(safe-area-inset-top, 0px)); left: 20px; z-index: 40; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--ink-soft); box-shadow: var(--shadow); cursor: pointer; padding: 0; }
.expand-fab:hover { color: var(--accent-strong); }
.expand-fab svg { width: 17px; height: 17px; }
.expand-fab[hidden] { display: none; }
body.sidebar-collapsed .sidebar { display: none; }
body.sidebar-collapsed .main { max-width: 1240px; padding-top: 72px; }

@media (max-width: 860px) {
  .layout { flex-direction: column; }
  .sidebar { width: 100%; height: auto; position: relative; top: 0; border-right: none; border-bottom: 1px solid var(--border); }
  .nav-list { max-height: 180px; }
  body.studying .nav-list, body.studying .search-box, body.studying .result-count, body.studying .sidebar-footer { display: none; }
  .main { padding: 28px 16px 60px; }
}
@media (max-width: 480px) { .q-opts { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<button id="expandBtn" class="expand-fab" type="button" aria-label="展開側欄" title="展開側欄（搜尋／分類）" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
</button>
<div class="layout">
  <aside class="sidebar">
    <div class="side-head">
      <div>
        <p class="sidebar-title">4500 單字多義複習</p>
        <div class="sidebar-sub">學測 · 文意選填加強</div>
      </div>
      <button id="collapseBtn" class="icon-btn" type="button" aria-label="收合側欄" title="收合側欄">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
    </div>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="搜尋單字、中文、例句" autocomplete="off">
    </div>
    <div class="result-count" id="resultCount"></div>
    <button class="study-toggle-btn" id="studyToggle" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a2 2 0 0 1 2-2h12v14H6a2 2 0 0 0-2 2Zm0 0a2 2 0 0 0 2 2h12"/><path d="M9 8h6M9 11h4"/></svg>
      <span id="studyToggleText">進入練習</span>
    </button>

    <div class="sidebar-footer" id="footer"></div>
  </aside>

  <main class="main">

const POS = { v:["動詞","pos-v"], n:["名詞","pos-n"], adj:["形容詞","pos-adj"], adv:["副詞","pos-adj"], phr:["片語","pos-phr"] };
const UPDATED = "2026-10-14";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[ch]));
// 片語可能有好幾個空格（例如 drain ___ her ___ all），a 用「 … 」分開每一格要填的字
const aParts = a => String(a).split(" … ");
const fillBlanks = (s, a, wrap) => { const p = aParts(a); let i = 0; return esc(s).replace(/___/g, () => wrap(esc(p[Math.min(i++, p.length - 1)] || ""))); };
const exHTML = e => fillBlanks(e.s, e.a, x => "<b>" + x + "</b>");
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
D.forEach((e, i) => e.id = i);

/* ---------- list view ---------- */
function renderList() {
  const words = new Set(D.map(e => e.w)).size;
  $("#heroMeta").innerHTML = `<span><strong>${D.length}</strong> 個字義</span><span><strong>${words}</strong> 個單字／片語</span><span>更新於 ${UPDATED}</span>`;
  $("#footer").textContent = `${D.length} 個字義 · ${CATS.length} 類`;
  $("#nav").innerHTML = CATS.map(c => `<li><a href="#cat-${c.id}">${esc(c.name)}<span class="nav-count" data-nav="${c.id}">${D.filter(e => e.c === c.id).length}</span></a></li>`).join("");
  $("#categories").innerHTML = CATS.map(c => {
    const rows = D.filter(e => e.c === c.id).map(e => {
      const [pl, pc] = POS[e.p];
      const q = [e.w, e.zh, e.s, e.a, e.t, e.n].join(" ").toLowerCase();
      return `<tr data-q="${esc(q)}" data-id="${e.id}">
        <td class="word">${esc(e.w)}${e.f ? `<span class="flag">${esc(e.f)}</span>` : ""}</td>
        <td><span class="pos-tag ${pc}">${pl}</span></td>
        <td class="zh">${esc(e.zh)}</td>
        <td class="kk">${esc(e.kk)}</td>
        <td class="example"><div class="ex-en">${exHTML(e)}</div><div class="ex-zh">${esc(e.t)}</div></td>
        <td class="colloc">${esc(e.n)}</td>
      </tr>`;
    }).join("");
    return `<section class="category" id="cat-${c.id}" data-cat="${c.id}">
      <div class="category-head"><h2>${esc(c.name)}</h2><span class="category-count" data-count="${c.id}"></span></div>
      <p class="category-desc">${esc(c.desc)}</p>
      <div class="table-wrap"><table>
        <thead><tr><th>單字</th><th>詞性</th><th>要加強的字義</th><th>KK 音標</th><th>例句（標色為填入形式）</th><th>搭配與提示</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </section>`;
  }).join("");
  applySearch();
}

function applySearch() {
  const q = $("#search").value.trim().toLowerCase();
  let total = 0;
  document.querySelectorAll(".category").forEach(sec => {
    let n = 0;
    sec.querySelectorAll("tbody tr").forEach(tr => {
      const hit = !q || tr.dataset.q.includes(q);
      tr.hidden = !hit; if (hit) n++;
    });
    sec.hidden = n === 0;
    sec.querySelector("[data-count]").textContent = n + " 個";
    const nav = document.querySelector(`[data-nav="${sec.dataset.cat}"]`);
    if (nav) nav.textContent = n;
    total += n;
  });
  $("#resultCount").textContent = q ? `找到 ${total} 個字義` : "";
  $("#empty").hidden = total !== 0;
}
$("#search").addEventListener("input", () => { if (studyOn) toggleStudy(false); applySearch(); });

function toggleStudy(force) {
  studyOn = typeof force === "boolean" ? force : !studyOn;
  $("#listView").hidden = studyOn;
  $("#studyView").hidden = !studyOn;
  $("#studyToggle").classList.toggle("active", studyOn);
  document.body.classList.toggle("studying", studyOn);

    const reveal = done ? `<div class="reveal">${(f !== null && opts[f].a.toLowerCase() === q.a.toLowerCase()) ? "" : `正解 <span class="fix">${esc(q.a)}</span>　`}${esc(q.w)}（${POS[q.p][0]}）${esc(q.zh)}｜${esc(q.t)}</div>${f !== null && opts[f].a.toLowerCase() !== q.a.toLowerCase() ? wdFor(opts[f].a, "你填的") : ""}` : "";
    // 有兩格的片語：第一格是可以點的空格，後面的格子跟著顯示同一個選項的後半段
    const extra = j => { const op = f === null ? null : aParts(opts[f].show); return `<span class="${cls}" style="cursor:default">${op ? esc(op[Math.min(j, op.length - 1)]) : "…"}</span>`; };
    return `<li class="cloze-item"><span class="qn">${i + 1}.</span>${parts[0]}<button type="button" class="${cls}" data-blank="${i}" ${done ? "disabled" : ""}>${label}</button>${parts.slice(1).map((x, j) => (j ? extra(j) : "") + x).join("")}${reveal}</li>`;
  }).join("");
  const usedBy = new Map(); fill.forEach((f, i) => { if (f !== null) usedBy.set(f, i); });
  const bank = opts.map((o, k) => `<button type="button" class="opt ${usedBy.has(k) ? "used" : ""}" data-opt="${k}" ${done ? "disabled" : ""}><span class="lt">${o.lt}</span>${esc(o.show)}</button>`).join("");
  const filled = fill.filter(f => f !== null).length;
  $("#studyView").innerHTML = `<div class="study-card">
    <div class="study-head"><h2>文意選填</h2>${done ? `<span class="score">${right}<small> / ${qs.length}</small></span>` : `<span class="progress-text">已填 ${filled} / ${qs.length}</span>`}</div>
    <ol class="cloze-list">${items}</ol>
    <div class="bank">${bank}</div>
    <div class="btn-row">
      ${done ? `<button class="primary-btn" type="button" id="again">再來一組</button>` : `<button class="primary-btn" type="button" id="submit" ${filled === qs.length ? "" : "disabled"}>交卷</button>`}
      <button class="ghost-btn" type="button" id="toSetup">回設定</button>
    </div>
  </div>`;
  document.querySelectorAll("[data-blank]").forEach(b => b.onclick = () => {
    const i = +b.dataset.blank;
    if (cz.active === i && cz.fill[i] !== null) cz.fill[i] = null;
    cz.active = i; renderCloze();
  });
  document.querySelectorAll("[data-opt]").forEach(b => b.onclick = () => {
    const k = +b.dataset.opt;
    const prev = cz.fill.indexOf(k);
    if (prev !== -1) cz.fill[prev] = null;
    cz.fill[cz.active] = k;
    const next = cz.fill.findIndex((f, i) => f === null && i > cz.active);
    const any = cz.fill.indexOf(null);
    cz.active = next !== -1 ? next : (any !== -1 ? any : cz.active);
    renderCloze();
  });
  const s = $("#submit"); if (s) s.onclick = () => { cz.done = true; cz.qs.forEach((q, i) => recordStat(q, cz.fill[i] !== null && cz.opts[cz.fill[i]].a.toLowerCase() === q.a.toLowerCase())); renderCloze(); window.scrollTo(0, 0); };
  const a = $("#again"); if (a) a.onclick = startCloze;
  $("#toSetup").onclick = renderSetup;
}

/* 答錯時：列出選錯的那個字的完整釋義 */
function wdFor(a, label) {
  if (!window.wrongDefHTML || !a) return "";
  const k = a.toLowerCase();
  let hits = D.filter(e => e.a.toLowerCase() === k);
  if (!hits.length) hits = D.filter(e => e.w.toLowerCase() === k);
  if (!hits.length) return "";
  const base = hits[0].w.toLowerCase() === k ? a : `${a}（${hits[0].w}）`;
  return wrongDefHTML(base, hits.map(e => ({ pos: POS[e.p][0], kk: e.kk, zh: e.w.toLowerCase() === hits[0].w.toLowerCase() ? e.zh : `${e.w}：${e.zh}`, ex: exHTML(e), exZh: e.t, note: e.n })), label);
}

/* 單題四選一 */
let sg = null;
// 選項一律用原形（單字本身 e.w），而且不能「長得一樣」：同一個字、互為開頭、或前 5 個字母相同的都不放在同一題
const baseKey = w => String(w).toLowerCase().trim();
function lookAlike(a, b) {
  a = baseKey(a); b = baseKey(b);
  if (a === b || a.startsWith(b) || b.startsWith(a)) return true;
  const fa = a.split(" ")[0], fb = b.split(" ")[0];
  return fa === fb || (fa.length >= 5 && fb.length >= 5 && fa.slice(0, 5) === fb.slice(0, 5));
}
function distractors(q) {
  const pick = [];
  const same = shuffle(D.filter(e => e.p === q.p));
  const rest = shuffle(D.filter(e => e.p !== q.p));
  for (const e of same.concat(rest)) {
    if (lookAlike(e.w, q.w) || pick.some(w => lookAlike(w, e.w))) continue;
    pick.push(e.w);
    if (pick.length === 3) break;
  }
  return pick;
}
function startSingle() {
  const p = pool();
  const n = Math.max(1, Math.min(cfg.count, p.length));
  const qs = weightedOrder(p, statOf).slice(0, n).map(q => ({ q, opts: shuffle([q.w].concat(distractors(q))), pick: null }));
  sg = { qs, i: 0 };
  renderSingle();
}
function renderSingle() {
  const { qs, i } = sg;
  if (i >= qs.length) return renderSingleEnd();
  const it = qs[i], q = it.q, answered = it.pick !== null;
  if (!answered && !it.t0) it.t0 = famStart();
  const parts = esc(q.s).split("___");
  const gap = answered ? esc(q.a) : "&nbsp;";
  const opts = it.opts.map((o, k) => {
    let cls = "opt";
    if (answered) { if (o === q.w) cls += " right"; else if (k === it.pick) cls += " wrong"; }
    return `<button type="button" class="${cls}" data-k="${k}" ${answered ? "disabled" : ""}><span class="lt">${"ABCD"[k]}</span>${esc(o)}</button>`;
  }).join("");
  $("#studyView").innerHTML = `<div class="study-card">
    <div class="study-head"><h2>單題四選一</h2><span class="progress-text">${i + 1} / ${qs.length}</span></div>
    <div class="progress-bar"><span style="width:${(i / qs.length) * 100}%"></span></div>
    <p class="q-sentence">${parts.map((x, j) => j ? `<span class="gap">${answered ? esc(aParts(q.a)[Math.min(j - 1, aParts(q.a).length - 1)]) : "&nbsp;"}</span>${x}` : x).join("")}</p>
    <div class="q-opts">${opts}</div>
    ${answered ? `<div class="feedback"><span class="fb-word">${esc(q.w)}</span>　${POS[q.p][0]}　${esc(q.kk)}<br>${esc(q.zh)}<br><span style="color:var(--ink)">整句：${esc(q.t)}</span><br>${esc(q.n)}</div>${it.opts[it.pick] !== q.w ? wdFor(it.opts[it.pick], "你選的") : ""}
      <div class="btn-row"><button class="primary-btn" type="button" id="next">${i + 1 < qs.length ? "下一題" : "看結果"}</button></div>` : ""}
    <div class="btn-row"><button class="ghost-btn" type="button" id="toSetup">回設定</button></div>
  </div>`;
  document.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { it.pick = +b.dataset.k; recordStat(it.q, it.opts[it.pick] === it.q.w, famElapsed(it.t0), 'quick'); renderSingle(); });
  const nx = $("#next"); if (nx) nx.onclick = () => { sg.i++; renderSingle(); };
  $("#toSetup").onclick = renderSetup;
}
function renderSingleEnd() {
  const wrong = sg.qs.filter(it => it.opts[it.pick] !== it.q.a);
  const right = sg.qs.length - wrong.length;
  $("#studyView").innerHTML = `<div class="study-card">
    <div class="study-head"><h2>練習結果</h2><span class="score">${right}<small> / ${sg.qs.length}</small></span></div>
    ${wrong.length ? `<div class="study-section-title">答錯的字義</div><ul class="wrong-list">${wrong.map(it => `<li><b>${esc(it.q.w)}</b>（${POS[it.q.p][0]}）${esc(it.q.zh)}<br>${exHTML(it.q)}</li>`).join("")}</ul>` : `<p class="pool-hint">全對。</p>`}
    <div class="btn-row">
      ${wrong.length ? `<button class="primary-btn" type="button" id="retryWrong">只練答錯的</button>` : ""}
      <button class="primary-btn" type="button" id="again">再練一輪</button>
      <button class="ghost-btn" type="button" id="toSetup">回設定</button>
    </div>
  </div>`;
  const rw = $("#retryWrong");
  if (rw) rw.onclick = () => { sg = { qs: shuffle(wrong).map(it => ({ q: it.q, opts: shuffle([it.q.a].concat(distractors(it.q))), pick: null })), i: 0 }; renderSingle(); };
  $("#again").onclick = startSingle;
  $("#toSetup").onclick = renderSetup;
}

/* ---------- 學習分析頁 ---------- */
// cfg: { title, items, statOf(item), resolve(logKey) -> item|null, groupOf(item) -> 分類名, groups: [分類名…], wordOf(item), zhOf(item), anchor }

  .fa-pill { display: inline-block; font-size: 0.7rem; font-weight: 700; padding: 0 7px; border-radius: 999px; }
  .fa-pill.w { color: var(--qz-bad); background: var(--qz-bad-bg); } .fa-pill.m { color: var(--qz-mid); background: var(--qz-mid-bg); } .fa-pill.s { color: var(--qz-good); background: var(--qz-good-bg); }
  .fa-entry { margin-top: -6px; }`;
  const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
  const root = document.createElement('div'); root.className = 'qz-overlay'; root.hidden = true; document.body.appendChild(root);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';
  const sec = ms => ms ? (ms / 1000).toFixed(1) + ' 秒' : '—';
  const median = xs => { if (!xs.length) return 0; const a = xs.slice().sort((x, y) => x - y); return a[Math.floor(a.length / 2)]; };
  const dayKey = t => { const d = new Date(t); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
  const level = v => v == null ? 'n' : v < 0.35 ? 'w' : v < 0.7 ? 'm' : 's';
  const LV = { w: '不熟', m: '普通', s: '熟', n: '沒練過' };

  function barChart(data, opt) {   // data: [{label, value, tip}]
    const W = 600, H = 170, padL = 8, padR = 8, padT = 18, padB = 26;
    const max = Math.max(1, ...data.map(d => d.value));
    const bw = (W - padL - padR) / data.length;
    const bars = data.map((d, i) => {
      const h = (d.value / max) * (H - padT - padB), x = padL + i * bw + bw * 0.18, w = bw * 0.64, y = H - padB - h;

      return `<g><title>${esc(d.tip)}</title>${path ? `<path class="bar" d="${path}"/>` : ''}<rect x="${padL + i * bw}" y="${padT}" width="${bw}" height="${H - padT - padB}" fill="transparent"/>

    }).join('');
    return `<div class="fa-chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt && opt.aria || '')}"><line class="axis" x1="${padL}" x2="${W - padR}" y1="${H - padB}" y2="${H - padB}"/>${bars}</svg></div>`;
  }
  const stack = c => { const t = c.w + c.m + c.s + c.n || 1; return `<div class="fa-stack" title="不熟 ${c.w}・普通 ${c.m}・熟 ${c.s}・沒練過 ${c.n}">${['w', 'm', 's', 'n'].map(k => c[k] ? `<i class="${k}" style="flex:${c[k] / t}"></i>` : '').join('')}</div>`; };

  function render() {
    const allLog = (typeof famLog !== 'undefined' ? famLog : []).filter(r => r && r[0]);
    const log = allLog.filter(famIsQuiz), flipN = allLog.length - log.length;   // 單字卡翻閱不算作答
    const items = cfg.items;
    const now = Date.now();
    // per-item aggregates from the log
    const per = new Map();
    log.forEach(r => {
      const it = cfg.resolve(r[1]); if (!it) return;
      let a = per.get(it); if (!a) { a = { n: 0, ok: 0, ms: [], last: 0, seq: [] }; per.set(it, a); }

    const quickMs = log.filter(r => r[5] && r[3] === 'quick' && r[4] > 0).map(r => r[4]);
    const typeMs = log.filter(r => r[5] && r[3] === 'type' && r[4] > 0).map(r => r[4]);
    // daily (14 days)
    const daily = [];
    for (let d = 13; d >= 0; d--) {
      const k = dayKey(now - d * 864e5), rows = log.filter(r => dayKey(r[0]) === k), dt = new Date(now - d * 864e5);
      daily.push({ label: (dt.getMonth() + 1) + '/' + dt.getDate(), value: rows.length, tip: `${dt.getMonth() + 1}/${dt.getDate()}：${rows.length} 題，正確率 ${pct(rows.filter(r => r[5]).length, rows.length)}` });
    }
    // forgetting: accuracy of a word vs gap since its previous answer
    const GAPS = [['同一天', 0, 1], ['隔 1 天', 1, 2], ['隔 2–3 天', 2, 4], ['隔 4–7 天', 4, 8], ['隔 8 天以上', 8, 1e9]];
    const gapAgg = GAPS.map(() => ({ n: 0, ok: 0 }));
    per.forEach(a => { const s = a.seq.slice().sort((x, y) => x[0] - y[0]); for (let i = 1; i < s.length; i++) { const g = (s[i][0] - s[i - 1][0]) / 864e5; const b = GAPS.findIndex(x => g >= x[1] && g < x[2]); if (b >= 0) { gapAgg[b].n++; gapAgg[b].ok += s[i][5]; } } });
    // time of day
    const SLOTS = [['早上 5–11 點', 5, 12], ['下午 12–17 點', 12, 18], ['晚上 18–22 點', 18, 23], ['深夜 23–4 點', 23, 29]];
    const slot = SLOTS.map(s => { const rows = log.filter(r => { let h = new Date(r[0]).getHours(); if (h < 5) h += 24; return h >= s[1] && h < s[2]; }); return { name: s[0], n: rows.length, acc: pct(rows.filter(r => r[5]).length, rows.length), med: median(rows.filter(r => r[5] && r[4] > 0).map(r => r[4])) }; });

    const slowest = practiced.map(it => ({ it, a: per.get(it) })).filter(x => x.a.ms.length >= 2).map(x => ({ ...x, m: median(x.a.ms) })).sort((x, y) => y.m - x.m).slice(0, 10);
    const cal = typeof FAM_CAL !== 'undefined' ? FAM_CAL : {};

    root.innerHTML = `<div class="qz-wrap" style="max-width:860px">
      <div class="qz-bar"><h2>${esc(cfg.title)}・學習分析</h2><button class="qz-x" type="button" id="faClose" aria-label="關閉">✕</button></div>
      <p class="fa-sub" style="margin:-6px 0 0">根據這台裝置上原本測驗模式的作答紀錄（${log.length} 筆）。單字卡只算熟悉度、不算答對率${flipN ? `（翻閱過 ${flipN} 張）` : ''}；Quizlet 式單字卡／學習不在統計內。</p>
      <div class="fa-tiles">
        <div class="fa-tile"><b>${items.length - total.n} / ${items.length}</b><span>練過的字</span></div>
        <div class="fa-tile"><b>${log.length}</b><span>總作答題數（近 7 天 ${week.length}）</span></div>
        <div class="fa-tile"><b>${pct(okCount, log.length)}</b><span>整體正確率</span></div>
        <div class="fa-tile"><b>${streak} 天</b><span>連續練習天數（共 ${days.size} 天有練）</span></div>
        <div class="fa-tile"><b>${sec(median(quickMs))}</b><span>選擇題答對的中位時間</span></div>
        <div class="fa-tile"><b>${sec(median(typeMs))}</b><span>拼字／填空答對的中位時間</span></div>
      </div>

      <div class="qz-card">
        <h3 class="fa-h">熟練度分布</h3><p class="fa-sub">整個單字庫目前的狀態。新字算在「不熟」裡出題，這裡分開標出來。</p>
        ${stack(total)}
        <div class="fa-legend"><span><i style="background:var(--qz-bad)"></i>不熟 ${total.w}</span><span><i style="background:var(--qz-mid)"></i>普通 ${total.m}</span><span><i style="background:var(--qz-good)"></i>熟 ${total.s}</span><span><i style="background:var(--border)"></i>沒練過 ${total.n}</span></div>
        <h3 class="fa-h" style="margin-top:18px">各${esc(cfg.groupLabel || '分類')}</h3>
        <div class="fa-rows">${cfg.groups.map(g => { const c = byGroup.get(g); const t = c.w + c.m + c.s + c.n; if (!t) return ''; return `<div class="fa-row"><span class="nm" title="${esc(g)}">${esc(g)}</span>${stack(c)}<span class="pc">熟 ${pct(c.s, t)}</span></div>`; }).join('')}</div>

// cfg: { statOf(item), resolve(logKey) -> item|null, slots() -> [[要放標籤的元素, item], …], inline, qzKey }
function famBadgeSetup(cfg) {
  const css = `
  .famb { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 0.7rem; font-weight: 500; color: var(--ink-faint); white-space: nowrap; font-variant-numeric: tabular-nums; line-height: 1.3; letter-spacing: 0; text-transform: none; font-style: normal; }
  .famb.inl { display: inline-flex; margin: 0 0 0 8px; vertical-align: 1px; }
  .famb .fb-bar { position: relative; width: 34px; height: 5px; border-radius: 3px; background: var(--border); overflow: hidden; flex: none; }
  .famb .fb-bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
  .famb.fbw .fb-bar i { background: var(--qz-bad); } .famb.fbm .fb-bar i { background: var(--qz-mid); } .famb.fbs .fb-bar i { background: var(--qz-good); }
  .famb.fbw b { color: var(--qz-bad); } .famb.fbm b { color: var(--qz-mid); } .famb.fbs b { color: var(--qz-good); }
  .famb b { font-weight: 700; }
  .famb.fbn { opacity: 0.8; }
  .famb[hidden] { display: none; }`;
  const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
  const level = v => v == null ? 'n' : v < 0.35 ? 'w' : v < 0.7 ? 'm' : 's';

  function html(item, acc) {
    const s = cfg.statOf(item), v = s ? famScore(s) : null, l = level(v);
    if (v == null) return { l, h: '還沒練過' };
    const p = Math.round(v * 100);
    let a;
    if (acc && acc.n) a = `答對率 ${Math.round(acc.ok / acc.n * 100)}%（${acc.ok}/${acc.n}）`;
    else if (acc && acc.fl) a = `單字卡看過 ${acc.fl} 次`;
    else if (s.prior) a = '學習模式學過';
    else a = '';
    return { l, h: `<span class="fb-bar"><i style="width:${Math.max(4, p)}%"></i></span>熟悉度 <b>${p}%</b>${a ? '・' + a : ''}` };
  }
  let sig = '';
  function signature() {
    const log = typeof famLog !== 'undefined' ? famLog : [];
    let q = ''; try { q = localStorage.getItem(cfg.qzKey || '') || ''; } catch (e) {}
    return log.length + ':' + (log.length ? log[log.length - 1][0] : 0) + ':' + q.length;
  }
  function refresh(force) {
    const slots = cfg.slots();
    if (!slots.length) return;
    const s = signature();
    if (!force && s === sig && slots[0][0].querySelector(':scope > .famb')) return;
    sig = s;
    const per = new Map();
    (typeof famLog !== 'undefined' ? famLog : []).forEach(r => {
      const it = r && cfg.resolve(r[1]); if (!it) return;
      let a = per.get(it); if (!a) { a = { n: 0, ok: 0, fl: 0 }; per.set(it, a); }
      if (!famIsQuiz(r)) { a.fl++; return; }   // 單字卡翻閱不算答對率
      a.n++; if (r[5]) a.ok++;
    });
    slots.forEach(([el, item]) => {
      if (!el || !item) return;
      let b = el.querySelector(':scope > .famb');
      if (!b) { b = document.createElement('span'); el.appendChild(b); }
      const o = html(item, per.get(item));
      b.className = 'famb fb' + o.l + (cfg.inline ? ' inl' : '');
      b.hidden = cfg.inline && o.l === 'n';   // 單元庫字太多：沒練過的就不標
      b.innerHTML = o.h;
    });
  }
  let t = 0;
  const later = () => { clearTimeout(t); t = setTimeout(() => refresh(false), 250); };
  document.addEventListener('click', later, true);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) later(); });
  setTimeout(() => refresh(true), 0);
  return { refresh };
}

          return `<button type="button" class="qz-g${on ? ' on' : ''}" data-g="${esc(g.id)}" title="${esc(g.name)}（${gc.t} 字，已掌握 ${gc.m}）"><span class="qz-gn">${esc(compact ? (g.short || g.name) : g.name)}</span><span class="qz-mini"><i class="m" style="width:${w(gc.m)}"></i><i class="l" style="width:${w(gc.l)}"></i></span></button>`;
        }).join('')}</div>
        ${(A.filters || []).length ? `<div class="qz-opt">${A.filters.map(f => `<label><input type="checkbox" data-filt="${f.key}" ${st.filt[f.key] ? 'checked' : ''}>${esc(f.label)}</label>`).join('')}</div>` : ''}
      </div>
      <div class="qz-card">
        <p class="qz-h"><span>學習進度（已選範圍）</span></p>
        ${bar(c)}
        <div class="qz-stat" style="margin-top:10px"><span><i class="qz-dot m"></i>已掌握 <strong>${c.m}</strong></span><span><i class="qz-dot l"></i>學習中 <strong>${c.l}</strong></span><span><i class="qz-dot n"></i>未學 <strong>${c.n}</strong></span><span>單字卡「會了」<strong>${knownN}</strong></span></div>
      </div>
      <div class="qz-modes">
        <button class="qz-mode" type="button" id="qzFlash" ${pool.length ? '' : 'disabled'}><b>單字卡</b><span>看中文和挖空例句，翻面看英文。分成「還在學／會了」，下一輪只練還在學的。</span></button>
        <button class="qz-mode" type="button" id="qzLearn" ${pool.length ? '' : 'disabled'}><b>學習</b><span>每回合 ${ROUND} 個字：先全部考選擇題，再全部考拼寫；答錯的字下一回合再考。</span></button>
      </div>
      <div class="qz-opt"><span>單字卡正面</span><span class="qz-seg"><button type="button" data-front="zh" class="${st.front === 'zh' ? 'on' : ''}">中文</button><button type="button" data-front="en" class="${st.front === 'en' ? 'on' : ''}">英文</button></span>
        <button class="qz-reset" type="button" id="qzReset">${resetArmed ? '確定清除這個範圍的進度？再按一次' : '清除這個範圍的學習進度'}</button></div>
    </div>`;
    wireHeader();
    root.querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
      const id = b.dataset.g, cur = st.sel.map(String);
      st.sel = cur.includes(id) ? st.sel.filter(x => String(x) !== id) : st.sel.concat([A.groups.find(g => String(g.id) === id).id]);
      save(); resetArmed = false; renderHome();
    });
    $('#qzAll').onclick = () => { st.sel = A.groups.map(g => g.id); save(); renderHome(); };
    $('#qzNone').onclick = () => { st.sel = []; save(); renderHome(); };
    root.querySelectorAll('[data-filt]').forEach(cb => cb.onchange = () => { st.filt[cb.dataset.filt] = cb.checked; save(); renderHome(); });
    root.querySelectorAll('[data-front]').forEach(b => b.onclick = () => { st.front = b.dataset.front; save(); renderHome(); });
    $('#qzFlash').onclick = () => startFlash();
    $('#qzLearn').onclick = () => startLearn();
    $('#qzReset').onclick = () => {
      if (!resetArmed) { resetArmed = true; renderHome(); return; }
      poolItems().forEach(it => { delete st.m[it.id]; known.delete(it.id); }); st.k = [...known]; save(); resetArmed = false; renderHome();
    };
  }

  /* ---------- flashcards ---------- */
  let F = null;
  function startFlash(ids) {
    const pool = poolItems();
    if (!ids) {
      const notKnown = pool.filter(it => !known.has(it.id));
      ids = shuffle((notKnown.length ? notKnown : pool).map(it => it.id));
    }
    F = { deck: ids, i: 0, flipped: false, hist: [], still: [], know: [] };
    mode = 'flash'; renderFlash();
  }
  function flashSort(ok) {
    if (!F || F.i >= F.deck.length) return;
    const id = F.deck[F.i];
    F.hist.push({ i: F.i, id, wasKnown: known.has(id) });
    if (ok) { known.add(id); F.know.push(id); } else { known.delete(id); F.still.push(id); }
    st.k = [...known]; save();
    F.i++; F.flipped = false; renderFlash(ok ? 'k' : 's');
  }
  function flashUndo() {
    const h = F.hist.pop(); if (!h) return;
    if (h.wasKnown) known.add(h.id); else known.delete(h.id);
    st.k = [...known]; save();
    F.still = F.still.filter(x => x !== h.id); F.know = F.know.filter(x => x !== h.id);
    F.i = h.i; F.flipped = false; renderFlash();
  }
  function renderFlash(dir) {
    if (F.i >= F.deck.length) return renderFlashEnd();
    const it = BY.get(F.deck[F.i]);
    const frontEn = st.front === 'en';
    const showEn = frontEn ? !F.flipped : F.flipped;
    const extra = `${exFullHTML(it)}${it.note ? `<div class="qz-note">${esc(it.note)}</div>` : ''}`;
    const zhOnly = `<div class="qz-zh">${it.pos ? `<span class="qz-pos">${esc(it.pos)}</span>` : ''}${esc(it.zh)}</div>`;
    let face;
    if (!frontEn) face = F.flipped ? answerHTML(it) + extra : promptHTML(it);
    else face = F.flipped ? zhOnly + extra : answerHTML(it);
    root.innerHTML = `<div class="qz-wrap">${header('單字卡', true)}
      <div class="qz-top"><span class="qz-count">${F.i + 1} / ${F.deck.length}</span>${bar({ m: F.know.length, l: F.still.length, t: F.deck.length })}${F.hist.length ? '<button class="qz-btn undo" type="button" id="qzUndo">← 上一張</button>' : ''}</div>
      <div class="qz-tally"><span class="s">還在學 ${F.still.length}</span><span class="k">會了 ${F.know.length}</span></div>
      <div class="qz-fc${F.flipped ? ' flip' : ''}" id="qzCard" role="button" tabindex="0" aria-label="翻面">
        <span class="qz-side">${showEn ? 'ENGLISH' : '中文'}</span>${face}
        ${F.flipped ? '' : `<span class="qz-hint">點卡片翻面</span>`}
      </div>
      <div class="qz-sort"><button type="button" class="s" id="qzStill">✗ 還在學</button><button type="button" class="k" id="qzKnow">✓ 會了</button></div>
      <p class="qz-keys">空白鍵翻面　←／→ 還在學／會了　手機可左右滑動</p>
    </div>`;
    wireHeader();
    const card = $('#qzCard');
    let sx = null, moved = false;
    card.onclick = e => { if (e.target.closest('[data-say]') || moved) return; F.flipped = !F.flipped; renderFlash(); };
    card.addEventListener('touchstart', e => { sx = e.touches[0].clientX; moved = false; }, { passive: true });
    card.addEventListener('touchmove', e => { if (sx == null) return; const dx = e.touches[0].clientX - sx; if (Math.abs(dx) > 12) { moved = true; card.style.transform = `translateX(${dx}px) rotate(${dx / 30}deg)`; card.classList.toggle('go-k', dx > 60); card.classList.toggle('go-s', dx < -60); } }, { passive: true });
    card.addEventListener('touchend', e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; sx = null; card.style.transform = ''; if (dx > 70) flashSort(true); else if (dx < -70) flashSort(false); else setTimeout(() => moved = false, 0); });
    $('#qzStill').onclick = () => flashSort(false);
    $('#qzKnow').onclick = () => flashSort(true);
    const u = $('#qzUndo'); if (u) u.onclick = flashUndo;
    if (F.flipped && showEn) say(it.term);
  }
  function renderFlashEnd() {
    const still = F.still.slice();
    root.innerHTML = `<div class="qz-wrap">${header('單字卡', true)}
      <div class="qz-card qz-done"><div class="big">${still.length ? '👍' : '🎉'}</div>
        <b>這一輪：會了 ${F.know.length}　還在學 ${still.length}</b>
        <span class="qz-hint">${still.length ? '下一輪只會出還在學的卡' : '這個範圍的卡全部都會了'}</span></div>
      ${still.length ? `<div class="qz-card"><p class="qz-h"><span>還在學的字</span></p><ul class="qz-list">${still.map(id => { const it = BY.get(id); return `<li><b>${esc(it.term)}</b><span>${esc(it.zh)}</span></li>`; }).join('')}</ul></div>` : ''}
      <div class="qz-row">
        ${still.length ? `<button class="qz-primary" type="button" id="qzMore">繼續練還在學的 ${still.length} 張</button>` : ''}
        <button class="qz-btn" type="button" id="qzAllAgain">整個範圍重新洗牌</button>
        <button class="qz-btn" type="button" id="qzToLearn">去學習模式</button>
      </div>
      ${F.hist.length ? '<div class="qz-row"><button class="qz-btn undo" type="button" id="qzUndo" style="flex:0">← 回到最後一張</button></div>' : ''}
    </div>`;
    wireHeader();
    const m = $('#qzMore'); if (m) m.onclick = () => startFlash(shuffle(still));
    $('#qzAllAgain').onclick = () => startFlash(shuffle(poolItems().map(it => it.id)));
    $('#qzToLearn').onclick = () => startLearn();
    const u = $('#qzUndo'); if (u) u.onclick = flashUndo;
  }

  /* ---------- learn ---------- */
  let L = null;
  // 每回合：這批字先全部考選擇題，再全部考拼寫；答錯的字留到下一回合，選擇題錯就下回合再考選擇題，拼寫錯就下回合再考拼寫
  function startLearn() {
    const pool = poolItems(), inPool = new Set(pool.map(it => it.id));
    const carry = (st.carry || []).filter(id => inPool.has(id) && lvl(id) < 2);
    const learning = shuffle(pool.filter(it => lvl(it.id) === 1).map(it => it.id));
    const fresh = shuffle(pool.filter(it => lvl(it.id) === 0).map(it => it.id));
    const pick = [...new Set(carry.concat(learning, fresh))].slice(0, ROUND);
    mode = 'learn';
    if (!pick.length) return renderLearnDone();
    L = { items: pick, phase: 'mc', queue: [], qDone: 0, qTotal: 0, cur: null, state: 'ask', hint: 0 };
    startPhase('mc');
  }
  function startPhase(ph) {
    L.phase = ph;
    L.queue = shuffle(L.items.filter(id => ph === 'mc' ? lvl(id) === 0 : lvl(id) === 1));
    L.qDone = 0; L.qTotal = L.queue.length;
    if (!L.queue.length) { if (ph === 'mc') return startPhase('write'); return renderRoundEnd(); }
    nextQ(true);
  }
  function nextQ(first) {
    if (!first) L.qDone++;
    if (!L.queue.length) { if (L.phase === 'mc') return startPhase('write'); return renderRoundEnd(); }
    L.cur = L.queue.shift(); L.state = 'ask'; L.hint = 0; L.choice = null; L.typed = ''; L.given = '';
    const it = BY.get(L.cur);
    L.kind = L.phase === 'mc' ? 'mc' : 'write';
    if (L.kind === 'mc') L.opts = buildChoices(it);
    renderLearn();
  }
  function buildChoices(it) {
    const key = norm(it.term), seen = new Set([key]);
    const pk = (it.pos || '').replace(/[^a-z]/gi, '').slice(0, 1).toLowerCase();
    const cands = shuffle(A.items.filter(x => !seen.has(norm(x.term))));
    const pref = cands.filter(x => (x.pos || '').replace(/[^a-z]/gi, '').slice(0, 1).toLowerCase() === pk && String(x.g) === String(it.g));
    const pref2 = cands.filter(x => (x.pos || '').replace(/[^a-z]/gi, '').slice(0, 1).toLowerCase() === pk);
    const out = [];
    for (const x of pref.concat(pref2, cands)) { const k = norm(x.term); if (seen.has(k)) continue; seen.add(k); out.push(x.term); if (out.length === 3) break; }
    return shuffle(out.concat([it.term]));
  }
  function setLvl(id, v) { st.m[id] = v; st.mt = st.mt || {}; st.mt[id] = Date.now(); save(); }
  // 每次學習模式的作答都記下來，讓原本測驗模式的熟悉度也跟著調整：選擇題答對 +0.5、拼字答對 +0.8、答錯記 -1（各字最多留 12 筆）
  function learnEvent(id, credit) {
    st.ev = st.ev || {}; const a = st.ev[id] = st.ev[id] || [];
    a.push([Date.now(), credit]); if (a.length > 12) a.splice(0, a.length - 12); save();
  }
  function overall() { return counts(poolItems()); }
  function renderLearn() {
    const it = BY.get(L.cur);
    const phaseName = L.phase === 'mc' ? '第 1 階段・選擇題' : '第 2 階段・拼寫';
    const c = overall();
    let body = '';
    if (L.kind === 'mc') {
      body = `<div class="qz-qlabel">選出正確的英文</div>
        <div class="qz-choices">${L.opts.map((o, k) => {
          let cls = '';
          if (L.state !== 'ask') { if (norm(o) === norm(it.term)) cls = ' ok'; else if (k === L.choice) cls = ' no'; }
          return `<button type="button" class="qz-choice${cls}" data-k="${k}" ${L.state !== 'ask' ? 'disabled' : ''}><span class="n">${k + 1}</span><span>${esc(o)}</span></button>`;
        }).join('')}</div>`;
    } else {
      const hintLine = L.hint ? `<div class="qz-hintline">${esc(it.term.split('').map((ch, i) => (i < L.hint || ch === ' ') ? ch : '_').join(' '))}</div>` : '';
      body = `<div class="qz-qlabel">${L.state === 'retype' ? '把正確答案打一次' : '用英文打出答案'}</div>${hintLine}
        <form class="qz-write" id="qzForm" autocomplete="off"><input id="qzIn" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${L.state === 'retype' ? esc(it.term) : '輸入英文'}" aria-label="輸入英文答案" ${L.state === 'ok' || L.state === 'no' ? 'readonly' : ''} value="${esc(L.typed)}"><button type="submit">${L.state === 'ask' || L.state === 'retype' ? '送出' : '繼續'}</button></form>
        ${L.state === 'ask' ? `<div class="qz-sub"><button class="qz-link" type="button" id="qzHint">提示字母</button><button class="qz-link" type="button" id="qzIdk">不知道</button></div>` : ''}`;
    }
    let fb = '';
    if (L.state === 'ok') fb = `<div class="qz-fb ok"><b>答對了！</b>${answerHTML(it).replace('qz-term', 'ans')}${exFullHTML(it)}</div>`;
    if (L.state === 'no' || L.state === 'retype') fb = `<div class="qz-fb no"><b>${L.kind === 'mc' ? '再想想，正確答案是' : (L.given ? '不太對，正確答案是' : '正確答案是')}</b><div class="ans">${esc(it.term)} ${sayBtn(it.term)}</div>${it.kk ? `<div class="qz-kk">${esc(it.kk)}</div>` : ''}${exFullHTML(it)}${it.note ? `<div class="qz-note">${esc(it.note)}</div>` : ''}${L.kind === 'write' && L.given ? `<div class="qz-hint">你的答案：${esc(L.given)}</div>` : ''}${wrongDef(it)}</div>`;
    let actions = '';
    if (L.state === 'ok' || L.state === 'no') actions = `<div class="qz-sub"><button class="qz-primary" type="button" id="qzNext" style="flex:0;min-width:120px">繼續</button></div>`;
    if (L.state === 'retype' && L.given) actions = `<div class="qz-sub"><button class="qz-btn" type="button" id="qzOverride">我其實答對了</button></div>`;
    root.innerHTML = `<div class="qz-wrap">${header('學習', true)}
      <div class="qz-top"><span class="qz-count">${phaseName}　${Math.min(L.qDone + 1, L.qTotal)} / ${L.qTotal}</span><div class="qz-big"><i class="p" style="width:${(L.qDone / Math.max(1, L.qTotal) * 100).toFixed(1)}%"></i></div></div>
      <div class="qz-card qz-q">
        <div class="qz-hint">${L.kind === 'mc' ? '四選一' : '拼寫'}・${esc(groupName(it.g))}</div>
        ${promptHTML(it)}
        ${body}
        ${fb}
        ${actions}
      </div>
      <div class="qz-stat"><span><i class="qz-dot m"></i>已掌握 ${c.m}</span><span><i class="qz-dot l"></i>學習中 ${c.l}</span><span><i class="qz-dot n"></i>未學 ${c.n}</span></div>
      <p class="qz-keys">${L.kind === 'mc' ? '可按 1–4 作答，Enter 或「繼續」下一題' : 'Enter 送出／繼續'}</p>
    </div>`;
    wireHeader();
    if (L.kind === 'mc' && L.state === 'ask') root.querySelectorAll('[data-k]').forEach(b => b.onclick = () => answerMC(+b.dataset.k));
    const f = $('#qzForm');
    if (f) {
      const inp = $('#qzIn');
      f.onsubmit = e => { e.preventDefault(); if (L.state === 'ask') answerWrite(inp.value); else if (L.state === 'retype') retype(inp.value); else nextQ(); };
      if (L.state === 'ask' || L.state === 'retype') { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
      const h = $('#qzHint'); if (h) h.onclick = () => { L.hint = Math.min(L.hint + 1, it.term.length - 1); L.typed = $('#qzIn').value; renderLearn(); };
      const k = $('#qzIdk'); if (k) k.onclick = () => answerWrite('');
    }
    const n = $('#qzNext'); if (n) { n.onclick = () => nextQ(); if (!f || L.state !== 'retype') n.focus(); }
    const o = $('#qzOverride'); if (o) o.onclick = () => { const e = st.ev && st.ev[L.cur]; if (e && e.length && e[e.length - 1][1] < 0) e.pop(); setLvl(L.cur, 2); learnEvent(L.cur, 0.8); nextQ(); };
  }
  function answerMC(k) {
    const it = BY.get(L.cur);
    L.choice = k;
    if (norm(L.opts[k]) === norm(it.term)) {
      L.state = 'ok'; setLvl(it.id, Math.max(lvl(it.id), 1)); learnEvent(it.id, 0.5);
      renderLearn(); famCheer.hit(root.querySelector('.qz-choice.ok')); setTimeout(() => say(it.term), 700);
    } else {
      L.state = 'no'; learnEvent(it.id, -1); renderLearn(); famCheer.miss();
    }
  }
  function answerWrite(v) {
    const it = BY.get(L.cur);
    L.typed = v.trim();
    if (L.typed && isRight(it, L.typed)) {
      L.state = 'ok'; setLvl(it.id, 2); learnEvent(it.id, 0.8); renderLearn(); famCheer.hit(root.querySelector('#qzIn')); setTimeout(() => say(it.term), 700);
    } else {
      famCheer.miss(); learnEvent(it.id, -1); L.state = 'retype'; L.given = L.typed; L.typed = ''; renderLearn();
    }
  }
  function retype(v) {
    const it = BY.get(L.cur);
    if (isRight(it, v)) nextQ();
    else { const inp = $('#qzIn'); inp.classList.add('no'); inp.value = ''; inp.placeholder = it.term; inp.focus(); }
  }
  function renderRoundEnd() {
    st.carry = L.items.filter(id => lvl(id) < 2); save();
    const c = overall();
    const rows = L.items.map(id => { const it = BY.get(id), v = lvl(id); return `<li><b>${esc(it.term)}</b><span>${esc(it.zh)}</span><span class="r ${v >= 2 ? 'm' : 'l'}">${v >= 2 ? '已掌握' : v === 1 ? '下回合考拼寫' : '下回合考選擇題'}</span></li>`; }).join('');
    const left = c.t - c.m;
    root.innerHTML = `<div class="qz-wrap">${header('學習', true)}
      <div class="qz-card qz-done"><div class="big">💪</div><b>這回合結束</b><span class="qz-hint">整個範圍：已掌握 ${c.m} / ${c.t}</span>${bar(c, ' style="width:100%"')}</div>
      <div class="qz-card"><p class="qz-h"><span>這回合的字</span></p><ul class="qz-list">${rows}</ul></div>
      <div class="qz-row">${left ? '<button class="qz-primary" type="button" id="qzGo">下一回合</button>' : ''}<button class="qz-btn" type="button" id="qzFc">用單字卡複習</button></div>
    </div>`;
    wireHeader();
    const g = $('#qzGo'); if (g) { g.onclick = startLearn; g.focus(); } else renderLearnDone();
    $('#qzFc').onclick = () => startFlash(shuffle(L.items));
  }
  function renderLearnDone() {
    const pool = poolItems();
    root.innerHTML = `<div class="qz-wrap">${header('學習', true)}
      <div class="qz-card qz-done"><div class="big">🎉</div><b>這個範圍的 ${pool.length} 個字全部掌握了</b><span class="qz-hint">可以換別的範圍，或重新學一次加深印象</span></div>
      <div class="qz-row"><button class="qz-primary" type="button" id="qzAgain">重新學一次</button><button class="qz-btn" type="button" id="qzHome">換範圍</button></div>
    </div>`;
    wireHeader();
    $('#qzAgain').onclick = () => { pool.forEach(it => delete st.m[it.id]); save(); startLearn(); };
    $('#qzHome').onclick = renderHome;
  }

  /* ---------- keyboard ---------- */
  document.addEventListener('keydown', e => {
    if (root.hidden) return;
    if (e.key === 'Escape') { close(); return; }
    const typing = e.target && e.target.tagName === 'INPUT';
    if (mode === 'flash' && F && F.i < F.deck.length && !typing) {
      if (e.key === ' ') { e.preventDefault(); F.flipped = !F.flipped; renderFlash(); }
      else if (e.key === 'ArrowRight') flashSort(true);
      else if (e.key === 'ArrowLeft') flashSort(false);
    } else if (mode === 'learn' && L && !typing) {
      if (L.kind === 'mc' && L.state === 'ask' && /^[1-4]$/.test(e.key)) answerMC(+e.key - 1);
      else if ((L.state === 'ok' || L.state === 'no') && e.key === 'Enter') { e.preventDefault(); nextQ(); }
    }
  });

  /* ---------- entry button ---------- */
  const anchor = document.querySelector(A.anchor || '.study-toggle-btn');
  if (anchor) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = (anchor.className || '').replace(/\bactive\b/, '') + ' qz-entry'; b.id = 'qzOpen';
