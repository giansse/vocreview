<title>單元單字庫</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&family=Source+Serif+4:ital,wght@1,500&display=swap">
<style>
/* Layout: sticky unit sidebar + main column; same token system as 學測作文單字庫 so the two pages feel like a set */
:root {
  --bg: #eef1f3; --surface: #ffffff; --surface-2: #f5f7f8;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161b; --surface: #1a1f26; --surface-2: #20262e;
    --ink: #e7eaee; --ink-soft: #a3adb8; --ink-faint: #6d7885;
    --accent: #7db1e0; --accent-strong: #9cc6ec; --accent-soft: #223447;
    --gold: #e0b768; --gold-soft: #3a3018;
    --good: #8fca9d; --good-bg: #1e3324; --bad: #e79a9a; --bad-bg: #3a2022; --bad-line: #b25d5d;
    --border: #2b323b; --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161b; --surface: #1a1f26; --surface-2: #20262e;
  --ink: #e7eaee; --ink-soft: #a3adb8; --ink-faint: #6d7885;
  --accent: #7db1e0; --accent-strong: #9cc6ec; --accent-soft: #223447;
  --gold: #e0b768; --gold-soft: #3a3018;
  --good: #8fca9d; --good-bg: #1e3324; --bad: #e79a9a; --bad-bg: #3a2022; --bad-line: #b25d5d;
  --border: #2b323b; --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); line-height: 1.6; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.layout { display: flex; min-height: 100vh; }

/* sidebar */
.sidebar { width: 260px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border);
  position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 20px 14px; gap: 14px; }
.sidebar-title { font-family: var(--f-display); font-size: 1.05rem; font-weight: 700; margin: 0; padding: 0 4px; }

.study-toggle-btn { display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%; padding: 10px 12px;
  border-radius: 10px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent-strong);
  font-size: 0.86rem; font-weight: 700; cursor: pointer; }
.study-toggle-btn:hover { background: var(--accent); color: var(--surface); }
.study-toggle-btn.active { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.study-toggle-btn svg { width: 16px; height: 16px; }
.search-box { position: relative; }
.search-box input { width: 100%; padding: 9px 12px 9px 32px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface-2); color: var(--ink); font-size: 0.88rem; font-family: inherit; }
.search-box svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--ink-faint); }

.hero h1 { font-size: clamp(1.5rem, 3vw, 2.05rem); margin: 0 0 8px; }

.unit-quiz-btn:hover { border-color: var(--accent); }

.wrow .w { font-weight: 700; font-size: 1rem; color: var(--ink); }
.wrow.sub .w { font-weight: 600; font-size: 0.93rem; }
.wrow .star { color: var(--gold); font-size: 0.8rem; letter-spacing: -1px; }
.wrow .ph { color: var(--accent); font-size: 0.82rem; }
.sense { font-size: 0.88rem; color: var(--ink-soft); }
.pos { display: inline-block; font-size: 0.68rem; font-weight: 700; padding: 0 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-strong); margin-right: 4px; vertical-align: 1px; }
.syn { font-size: 0.78rem; color: var(--ink-faint); font-family: var(--f-en); font-style: italic; }

.exs { margin: 8px 0 0; padding: 8px 0 0; border-top: 1px dashed var(--border); display: grid; gap: 6px; list-style: none; }
.exs li { font-size: 0.86rem; }
.ex-en { font-family: var(--f-en); font-style: italic; color: var(--ink); }
.ex-en b { font-style: italic; color: var(--accent-strong); font-weight: 700; }
.ex-zh { display: block; color: var(--ink-faint); font-size: 0.8rem; }
.notes { font-size: 0.8rem; color: var(--ink-soft); margin-top: 6px; }
.speak-btn { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; padding: 0; border: none; background: none;

mark { background: var(--gold-soft); color: var(--ink); border-radius: 3px; padding: 0 1px; }

.ghost-btn:hover { color: var(--accent-strong); border-color: var(--accent); }
.sec { margin-bottom: 22px; }
.sec-title { font-size: 0.82rem; font-weight: 700; color: var(--ink-soft); margin: 0 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.sec-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.range-input { width: 150px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--ink); font-size: 0.78rem; font-family: inherit; }
.unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; }

.pills { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.pill { text-align: center; font-size: 0.85rem; padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--ink-soft); cursor: pointer; }

.q { text-align: center; padding: 30px clamp(16px, 4vw, 32px); }
.q-unit { font-size: 0.72rem; color: var(--ink-faint); margin-bottom: 6px; }
.q-word { font-family: var(--f-display); font-size: clamp(1.6rem, 5vw, 2.1rem); font-weight: 700; color: var(--ink); line-height: 1.25; word-break: break-word; }
.q-ph { color: var(--accent); font-size: 0.95rem; margin-top: 2px; }
.q-zh { display: grid; gap: 6px; font-size: clamp(1.1rem, 3vw, 1.3rem); font-weight: 600; color: var(--ink); line-height: 1.5; }
.hint-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.hint-row .link-btn { padding: 6px 12px; }
.hint-text { font-family: var(--f-en); font-size: 1.05rem; letter-spacing: 1px; color: var(--accent-strong); }
.q-hint { font-size: 0.76rem; color: var(--ink-faint); margin-top: 16px; }
.flash { cursor: pointer; min-height: 250px; display: flex; flex-direction: column; align-items: center; justify-content: center; }

.rate button { padding: 12px 6px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); font-size: 0.86rem; font-weight: 700; cursor: pointer; color: var(--ink-soft); }

.rate [data-r="0"]:hover { background: var(--bad-bg); border-color: var(--bad-line); color: var(--bad); }

.fb .verdict { font-weight: 700; }

.fb .your { color: var(--ink-faint); font-size: 0.8rem; }
.cloze { font-family: var(--f-en); font-style: italic; font-size: clamp(1.05rem, 2.6vw, 1.25rem); line-height: 1.75; color: var(--ink); text-align: left; }
.blank { font-style: normal; font-family: var(--f-body); font-weight: 700; color: var(--accent-strong); border-bottom: 2px solid var(--accent); padding: 0 4px; white-space: nowrap; letter-spacing: 1px; }
.blank.ok { color: var(--good); border-color: var(--good); }

.stat .lbl { font-size: 0.74rem; color: var(--ink-faint); }
.missed { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.missed li { display: flex; justify-content: space-between; gap: 12px; font-size: 0.86rem; padding: 8px 12px; border-radius: 8px; background: var(--surface-2); color: var(--ink-soft); }
.missed li strong { color: var(--ink); }

.btn-row { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.btn-row button { flex: 1; min-width: 140px; padding: 11px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--ink-soft); font-weight: 700; cursor: pointer; }
.btn-row button.main-b { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--surface); }

.side-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.side-toggle { flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px; font-size: 0.74rem; color: var(--ink-soft); background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 4px 9px; cursor: pointer; white-space: nowrap; }
.side-toggle:hover { color: var(--accent-strong); border-color: var(--accent); }

body.side-collapsed .sidebar { height: auto; align-self: flex-start; }
.grid-toggle { font-size: 0.74rem; font-weight: 700; color: var(--accent-strong); background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 999px; padding: 2px 10px; cursor: pointer; }
.sel-summary { font-size: 0.84rem; color: var(--ink-soft); background: var(--surface-2); border: 1px dashed var(--border); border-radius: 10px; padding: 8px 12px; font-variant-numeric: tabular-nums; }

}

<script>
(function () {
const UNITS = JSON.parse(document.getElementById('data').textContent);
// UNITS: [{u, g:[{n, w:[[word, star, ph, [[pos, zh, syn]...], bad]], e:[[en, zh, ts, tl, wi]], nt:[...]}]}]
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const SPEAK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';

/* ---------- storage (per-viewer, optional) ---------- */
const PROG_KEY = 'unitvocab.progress.v1', CFG_KEY = 'unitvocab.cfg.v1';
let progress = {};
try { progress = JSON.parse(localStorage.getItem(PROG_KEY) || '{}') || {}; } catch (e) { progress = {}; }
const saveProg = () => { try { localStorage.setItem(PROG_KEY, JSON.stringify(progress)); } catch (e) {} };
function record(key, ok) {
  const p = progress[key] || { c: 0, w: 0 };
  ok ? p.c++ : p.w++;
  p.last = ok ? 1 : 0;
  progress[key] = p; saveProg();
}

/* ---------- speech ---------- */
let voices = [];
if ('speechSynthesis' in window) {
  voices = speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => { voices = speechSynthesis.getVoices(); };
}
function speak(text) {
  if (!('speechSynthesis' in window) || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.92;
  const v = voices.find(v => /en[-_]US/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-say]');
  if (b) { e.stopPropagation(); speak(b.dataset.say); }
});
const sayBtn = t => `<button class="speak-btn" type="button" data-say="${esc(t)}" aria-label="朗讀 ${esc(t)}">${SPEAK_SVG}</button>`;

/* ---------- flatten ---------- */
const WORDS = [], CLOZES = [];
UNITS.forEach(U => U.g.forEach((G, gi) => {
  G.w.forEach((W, wi) => {
    WORDS.push({ key: `${U.u}-${gi}-${wi}`, u: U.u, gi, wi, w: W[0], star: W[1], ph: W[2], senses: W[3], bad: !!W[4], head: wi === 0, G });
  });
  G.e.forEach((E, ei) => {
    if (E[2] >= 0) CLOZES.push({ key: `${U.u}-${gi}-e${ei}`, u: U.u, gi, en: E[0], zh: E[1], ts: E[2], tl: E[3], wi: E[4], G });
  });
}));
const totalGroups = UNITS.reduce((a, U) => a + U.g.length, 0);
$('#entryCount').textContent = `${UNITS.length} 個單元 · ${WORDS.length} 個單字`;
$('#heroMeta').innerHTML = `<span><strong>${UNITS.length}</strong> 個單元</span><span><strong>${totalGroups}</strong> 組主單字</span><span><strong>${WORDS.length}</strong> 個單字（含衍生字）</span><span><strong>${UNITS.reduce((a, U) => a + U.g.reduce((b, G) => b + G.e.length, 0), 0)}</strong> 句例句</span>`;

const senseHTML = (s) => `<span class="sense">${s[0] ? `<span class="pos">${esc(s[0])}</span>` : ''}${esc(s[1])}${s[2] ? ` <span class="syn">= ${esc(s[2])}</span>` : ''}</span>`;
function exHTML(E, hl) {
  let en = E[0];
  if (E[2] >= 0) en = esc(en.slice(0, E[2])) + '<b>' + esc(en.slice(E[2], E[2] + E[3])) + '</b>' + esc(en.slice(E[2] + E[3]));
  else en = esc(en);
  return `<span class="ex-en">${en}</span> ${sayBtn(E[0])}<span class="ex-zh">${esc(E[1])}</span>`;
}
function unitRange(U) { const f = U.g[0]?.w[0]?.[0] || '', l = U.g[U.g.length - 1]?.w[0]?.[0] || ''; return `${f} – ${l}`; }

/* ---------- browse ---------- */
function groupHTML(G, idx) {
  const rows = G.w.map((W, wi) => `<div class="wrow${wi ? ' sub' : ''}"><span class="w">${esc(W[0])}</span>${W[1] ? `<span class="star">${'★'.repeat(W[1])}</span>` : ''}${W[2] ? `<span class="ph">[${esc(W[2])}]</span>` : ''}${sayBtn(W[0])}${W[3].map(senseHTML).join(' ')}${W[4] ? ' <span class="ocr-flag">待校對</span>' : ''}</div>`).join('');

}

}

/* ---------- grading for Chinese answers ---------- */
const STRIP = /[的地之使得被著了]/g;
function meaningsOf(senses) {
  const out = [];
  senses.forEach(s => String(s[1]).replace(/（[^）]*）|\([^)]*\)/g, '').split(/[；;，,、\/。=\s]+/).forEach(m => {
    m = m.replace(/[^一-鿿]/g, ''); if (m) out.push(m);
  }));
  return out;
}
function gradeZh(ans, senses) {
  const parts = ans.replace(/[^一-鿿\s；;，,、\/]/g, '').split(/[\s；;，,、\/]+/).filter(Boolean);
  if (!parts.length) return false;
  const ms = meaningsOf(senses);
  return parts.some(a => ms.some(m => {
    if (a === m) return true;
    const a2 = a.replace(STRIP, ''), m2 = m.replace(STRIP, '');
    if (!a2 || !m2) return a === m;
    if (a2 === m2) return true;
    if (a2.length >= 2 && m2.includes(a2)) return true;
    if (m2.length >= 2 && a2.includes(m2)) return true;
    if (m2.length === 1 && a2.length === 1) return a2 === m2;
    const hit = [...new Set(m2)].filter(ch => a2.includes(ch)).length;
    return m2.length >= 2 && hit / new Set(m2).size >= 0.6;
  }));
}

function flip() {

function finish(ok, it, inpOrHtml, html, isCloze) {

  const label = it => it.en !== undefined
    ? `<span><strong>${esc(it.en.substr(it.ts, it.tl))}</strong>　第 ${it.u} 單元</span><span>${esc(it.zh)}</span>`
    : `<span><strong>${esc(it.w)}</strong>　第 ${it.u} 單元</span><span>${esc(it.senses.map(s => s[1]).join('；'))}</span>`;
  $('#studyView').innerHTML = `<div class="card"><div class="study-head"><h2>這回合結果</h2><button class="ghost-btn" type="button" id="toSetup">回設定</button></div>
    <div class="stats"><div class="stat"><div class="num">${done}</div><div class="lbl">完成題數</div></div><div class="stat"><div class="num">${S.ok}</div><div class="lbl">${S.mode === 'flash' ? '記住了' : '答對'}</div></div><div class="stat"><div class="num">${pct}%</div><div class="lbl">正確率</div></div></div>
    ${missed.length ? `<p class="sec-title">${S.mode === 'flash' ? '還不熟的字' : '答錯的題目'}（${missed.length}）</p><ul class="missed">${missed.map(it => `<li>${label(it)}</li>`).join('')}</ul>` : '<p class="pool-hint">全部答對，這幾個單元可以往下一個進度了。</p>'}
    <div class="btn-row">${missed.length ? '<button type="button" class="main-b" id="redo">只重練這些</button>' : ''}<button type="button" id="again">同設定再來一次</button></div>
    ${canUndo() ? '<div class="row-end" style="justify-content:flex-start"><button class="undo-btn" type="button" id="undoBtn">← 回到最後一張重新選</button></div>' : ''}</div>`;
  const ub = $('#undoBtn'); if (ub) ub.onclick = undoLast;
  $('#toSetup').onclick = () => { S = null; renderSetup(); };
  const r = $('#redo'); if (r) r.onclick = () => startDrill(shuffle(missed.slice()));
  $('#again').onclick = () => { const p = pool(); const n = cfg.count === 'all' ? p.length : Math.min(p.length, cfg.count === 'custom' ? cfg.custom : cfg.count); startDrill(shuffle(p.slice()).slice(0, n)); };
}

/* ---------- sidebar collapse ---------- */
const SIDE_KEY = 'unitvocab.sideCollapsed';
function setSide(collapsed) {
  document.body.classList.toggle('side-collapsed', collapsed);
  const t = $('#sideToggle'); t.textContent = collapsed ? '展開 ▾' : '收起 ▴'; t.setAttribute('aria-expanded', String(!collapsed));
  try { localStorage.setItem(SIDE_KEY, collapsed ? '1' : '0'); } catch (e) {}
}
$('#sideToggle').onclick = () => setSide(!document.body.classList.contains('side-collapsed'));
try { if (localStorage.getItem(SIDE_KEY) === '1') setSide(true); } catch (e) {}

/* ---------- view switching ---------- */
function showStudy() {
  $('#browseView').hidden = true; $('#studyView').hidden = false;
  document.body.classList.add('studying'); $('#studyBtn').classList.add('active'); $('#studyBtnLabel').textContent = '回到單字表';
  S = null; renderSetup(); window.scrollTo(0, 0);
}
function showBrowse() {
  $('#browseView').hidden = false; $('#studyView').hidden = true;
  document.body.classList.remove('studying'); $('#studyBtn').classList.remove('active'); $('#studyBtnLabel').textContent = '背誦模式';
}
$('#studyBtn').onclick = () => $('#studyView').hidden ? showStudy() : showBrowse();
})();
</script>
